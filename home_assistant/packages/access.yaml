homeassistant:
  customize:
    binary_sensor.main_gate_gate_status:
      icon: mdi:gate
    binary_sensor.garage_doors_lhs_occupied:
      icon: mdi:car-connected
    binary_sensor.garage_doors_rhs_occupied:
      icon: mdi:car-connected
    cover.garage_doors:
      device_class: garage
      icon: mdi:garage-variant

input_datetime:
  main_gate_opened:
    has_date: true
    has_time: true
  garage_doors_lhs_opened:
    has_date: true
    has_time: true
  garage_doors_rhs_opened:
    has_date: true
    has_time: true

timer:
  # format: <entity_id>_timer
  main_gate_timer:
    duration: "00:05:00"
    restore: true
  garage_doors_lhs_timer:
    duration: "00:05:00"
    restore: true
  garage_doors_rhs_timer:
    duration: "00:05:00"
    restore: true

cover:
  - platform: group
    name: "Garage Doors"
    unique_id: "5f3a9238-772d-4281-bf48-ad45284b745d"
    entities:
      - cover.garage_doors_lhs
      - cover.garage_doors_rhs

group:
  covers_with_timers:
    name: Covers With Timers
    entities:
      - cover.main_gate
      - cover.garage_doors_lhs
      - cover.garage_doors_rhs

# https://www.dahuasecurity.com/products/All-Products/Video-Intercoms/IP-Products/Door-Stations/VTO2211G-WP
# https://amcrest.com/smarthome-2-megapixel-wireless-doorbell-security-camera-1920-x-1080p-wifi-doorbell-camera-ip55-weatherproof-two-way-audio-ad110.html
# https://www.hikvision.com/en/products/Video-Intercom-Products/
# https://community.home-assistant.io/t/amcrest-doorbell-ad110-api-local-only/223838
# https://community.home-assistant.io/t/dahua-vto-custom-integration/293693
# replaced with: https://github.com/rroller/dahua
# amcrest:
#   - name: Doorbell
#     host: !secret doorbell_host
#     username: !secret doorbell_username
#     password: !secret doorbell_password
#     binary_sensors:
#       - online
#       - motion_detected

template:
  - cover:
      - name: "Main Gate"
        device_class: gate
        open_cover:
          # https://community.home-assistant.io/t/cover-template-open-close/248449
          - condition: state
            entity_id: binary_sensor.main_gate_gate_status
            state: "off"
          - service: switch.turn_on
            data:
              entity_id: switch.main_gate_remote
        close_cover:
          - condition: state
            entity_id: binary_sensor.main_gate_gate_status
            state: "on"
          - service: switch.turn_on
            data:
              entity_id: switch.main_gate_remote
        stop_cover:
          service: switch.turn_on
          data:
            entity_id: switch.main_gate_remote
        # true (on) means open
        state: "{{ is_state('binary_sensor.main_gate_gate_status', 'on') }}"
        icon: >-
          {%- from 'security.jinja' import get_cover_icon -%}
          {{ get_cover_icon('binary_sensor.main_gate_gate_status', 'binary_sensor.main_gate_alert', 'mdi:gate') }}
        # has_value, not just a check for unavailable: at start-up the esphome sensor may not
        # exist yet, and an unknown source state would otherwise render this cover as closed
        availability: "{{ has_value('binary_sensor.main_gate_gate_status') }}"
  - cover:
      - name: "Garage Doors LHS"
        device_class: garage
        open_cover:
          - condition: state
            entity_id: binary_sensor.garage_doors_lhs_status
            state: "off"
          - service: switch.turn_on
            data:
              entity_id: switch.garage_doors_lhs_remote
        close_cover:
          - condition: state
            entity_id: binary_sensor.garage_doors_lhs_status
            state: "on"
          - service: switch.turn_on
            data:
              entity_id: switch.garage_doors_lhs_remote
        stop_cover:
          service: switch.turn_on
          data:
            entity_id: switch.garage_doors_lhs_remote
        # true (on) means open
        state: "{{ is_state('binary_sensor.garage_doors_lhs_status', 'on') }}"
        icon: >-
          {%- from 'security.jinja' import get_cover_icon -%}
          {{ get_cover_icon('binary_sensor.garage_doors_lhs_status', 'binary_sensor.garage_doors_lhs_alert', 'mdi:garage') }}
        # has_value, not just a check for unavailable: at start-up the esphome sensor may not
        # exist yet, and an unknown source state would otherwise render this cover as closed
        availability: "{{ has_value('binary_sensor.garage_doors_lhs_status') }}"
  - cover:
      - name: "Garage Doors RHS"
        device_class: garage
        open_cover:
          - condition: state
            entity_id: binary_sensor.garage_doors_rhs_status
            state: "off"
          - service: switch.turn_on
            data:
              entity_id: switch.garage_doors_rhs_remote
        close_cover:
          - condition: state
            entity_id: binary_sensor.garage_doors_rhs_status
            state: "on"
          - service: switch.turn_on
            data:
              entity_id: switch.garage_doors_rhs_remote
        stop_cover:
          service: switch.turn_on
          data:
            entity_id: switch.garage_doors_rhs_remote
        # true (on) means open
        state: "{{ is_state('binary_sensor.garage_doors_rhs_status', 'on') }}"
        icon: >-
          {%- from 'security.jinja' import get_cover_icon -%}
          {{ get_cover_icon('binary_sensor.garage_doors_rhs_status', 'binary_sensor.garage_doors_rhs_alert', 'mdi:garage') }}
        # has_value, not just a check for unavailable: at start-up the esphome sensor may not
        # exist yet, and an unknown source state would otherwise render this cover as closed
        availability: "{{ has_value('binary_sensor.garage_doors_rhs_status') }}"
  # example:
  # {
  #     "event_type": "amcrest",
  #     "data": {
  #         "camera": "Doorbell",
  #         "event": "CallNoAnswered",
  #         "payload": {
  #             "Code": "CallNoAnswered",
  #             "action": "Start",
  #             "index": "0",
  #             "data": {
  #                 "CallID": "3"
  #             }
  #         }
  #     },
  #     "origin": "LOCAL",
  #     "time_fired": "2021-10-16T14:59:57.236917+00:00",
  #     "context": {
  #         "id": "381f8debeef10751b18edc4acf3f4491",
  #         "parent_id": null,
  #         "user_id": null
  #     }
  # }
  # explanation:
  # the first trigger updates the state to true, but at this point the icon template
  # using the sensor itself will still have the old value. the second trigger will be
  # triggered when the state changes due to the first trigger. this will cause the
  # icon template to update to whatever the current state of the sensor is. at the same
  # time, one must prevent an infinite loop, because even if the state doesn't get
  # updated, there will still be an event emitted. this is why the state template needs
  # to update only when the first trigger gets triggered.
  # - trigger:
  #   - platform: event
  #     event_type: amcrest
  #     event_data:
  #       event: CallNoAnswered
  #       payload:
  #         action: Start
  #   - platform: state
  #     entity_id: binary_sensor.doorbell_rang
  #     to: "off"
  #   binary_sensor:
  #     - name: Doorbell Rang
  #       # https://github.com/home-assistant/core/issues/39932
  #       # https://github.com/home-assistant/core/issues/58056
  #       # https://github.com/home-assistant/core/issues/66459
  #       # https://github.com/home-assistant/home-assistant.io/pull/22021
  #       icon: "{{ (trigger.platform == 'event') | iif('mdi:bell-ring-outline', 'mdi:bell-outline') }}"
  #       state: "{{ trigger.platform == 'event' }}"
  #       # https://github.com/home-assistant/core/issues/67397
  #       auto_off:
  #         seconds: 5
  - binary_sensor:
      - name: Doorbell Rang
        # icon: "{{ is_state('binary_sensor.doorbell_call_no_answered', 'on') | iif('mdi:bell-ring-outline', 'mdi:bell-outline') }}"
        icon: "{{ 'mdi:bell-ring-outline' if is_state('binary_sensor.doorbell_call_no_answered', 'on') else 'mdi:bell-outline' }}"
        # sensor remains on for 10 s
        state: "{{ states('binary_sensor.doorbell_call_no_answered') }}"

  - binary_sensor:
      - name: "Main Gate Alert"
        unique_id: "c0519290-d5b4-4c3f-9809-906316d94b04"
        state: >-
          {%- from 'security.jinja' import get_alert_status -%}
          {{ get_alert_status('binary_sensor.main_gate_gate_status',
                              'timer.main_gate_timer',
                              'input_datetime.main_gate_opened') }}
        device_class: problem
  - binary_sensor:
      - name: "Garage Doors LHS Alert"
        unique_id: "8683ff75-958e-44f0-9233-36a5a8bfe3c8"
        state: >-
          {%- from 'security.jinja' import get_alert_status -%}
          {{ get_alert_status('binary_sensor.garage_doors_lhs_status',
                              'timer.garage_doors_lhs_timer',
                              'input_datetime.garage_doors_lhs_opened') }}
        device_class: problem
  - binary_sensor:
      - name: "Garage Doors RHS Alert"
        unique_id: "74597585-0fb3-459e-b90f-3cd6ba034a1a"
        state: >-
          {%- from 'security.jinja' import get_alert_status -%}
          {{ get_alert_status('binary_sensor.garage_doors_rhs_status',
                              'timer.garage_doors_rhs_timer',
                              'input_datetime.garage_doors_rhs_opened') }}
        device_class: problem

script:
  open_pedestrian_gap:
    mode: single
    sequence:
      - condition: state
        entity_id: cover.main_gate
        state: "closed"
      - service: switch.turn_on
        entity_id: switch.main_gate_remote
      - delay: "00:00:05"
      - service: switch.turn_on
        entity_id: switch.main_gate_remote

  close_garage_door_and_main_gate:
    description: "Close the applicable garage door if it's open and also the main gate if it's open"
    fields:
      garage_door:
        description: "A cover entity"
        example: "cover.garage_door"
    mode: single
    sequence:
      - service: cover.close_cover
        data:
          entity_id: "{{ garage_door }}"
      - service: cover.close_cover
        entity_id: cover.main_gate

automation:
  - alias: "Notify If Doorbell Rang"
    id: "46054fb3-4e60-40ad-9e0f-e22b8137b23c"
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.doorbell_rang
        to: "on"
    mode: queued
    action:
      # taking a snapshot here, while there's also an automation for taking snapshots in general
      # when motion is detected could be problematic (too many calls in quick succession). let's
      # see how this goes without taking a snapshot here. otherwise, we'll let that automation
      # do its thing and check the mtime to see if it's sufficiently recent for us in the
      # notification, and if not, we'll take a new one and use that.
      - service: shell_command.get_doorbell_snapshot_mtime
        response_variable: result_current
      - variables:
          mtime_current: "{{ result_current.stdout | int(0) }}"
          ts_now: "{{ as_timestamp(now()) }}"
          snapshot_age: "{{ ts_now - mtime_current }}"
      - if:
          - condition: template
            value_template: "{{ snapshot_age > 2 or snapshot_age < 0 }}"
        then:
          - service: script.take_snapshot
            data:
              camera_entity: camera.doorbell
              subdirectory: "doorbell"
          - delay:
              seconds: 1
      - service: shell_command.get_doorbell_snapshot_mtime
        response_variable: result_new
      - variables:
          mtime_new: "{{ result_new.stdout | int(0) }}"
          snapshot_valid: "{{ (mtime_new > mtime_current) or (snapshot_age <= 2 and snapshot_age >= 0) }}"
      - if:
          - condition: template
            value_template: "{{ snapshot_valid }}"
        then:
          - service: notify.family
            data:
              title: "🔔 Security"
              message: "The doorbell rang."
              data:
                group: "doorbell"
                url: homeassistant://navigate/lovelace-main/security
                sound:
                  name: "Doorbell.caf"
                  critical: 1
                  volume: 0.3
                attachment:
                  url: !secret doorbell_camera_last_snapshot_url
                  hide-thumbnail: false
                  lazy: false
                actions:
                  - action: "PARTLY_OPEN_AND_CLOSE_GATE"
                    title: "Open and close (pedestrian)"
                  - action: "PARTLY_OPEN_GATE"
                    title: "Open (pedestrian)"
                  - action: "FULLY_OPEN_GATE"
                    title: "Open (fully)"
                  - action: "CLOSE_GATE"
                    title: "Close"
        else:
          - service: notify.family
            data:
              title: "🔔 Security"
              message: "The doorbell rang. (No image available.)"
              data:
                group: "doorbell"
                url: homeassistant://navigate/lovelace-main/security
                sound:
                  name: "Doorbell.caf"
                  critical: 1
                  volume: 0.3
                actions:
                  - action: "PARTLY_OPEN_AND_CLOSE_GATE"
                    title: "Open and close (pedestrian)"
                  - action: "PARTLY_OPEN_GATE"
                    title: "Open (pedestrian)"
                  - action: "FULLY_OPEN_GATE"
                    title: "Open (fully)"
                  - action: "CLOSE_GATE"
                    title: "Close"

  - alias: "Handle Doorbell Alert Action"
    id: "c39b4bb0-9a1d-475c-ac7d-ee93fbee8e69"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: PARTLY_OPEN_AND_CLOSE_GATE
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: PARTLY_OPEN_GATE
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: FULLY_OPEN_GATE
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: CLOSE_GATE
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ is_state('cover.main_gate', 'closed') and trigger.event.data.action == 'FULLY_OPEN_GATE' }}"
            sequence:
              - service: cover.open_cover
                data:
                  entity_id: cover.main_gate
          - conditions:
              - condition: template
                value_template: "{{ is_state('cover.main_gate', 'closed') and trigger.event.data.action == 'PARTLY_OPEN_GATE' }}"
            sequence:
              # non-blocking call
              - service: script.turn_on
                target:
                  entity_id: script.open_pedestrian_gap
          - conditions:
              - condition: template
                value_template: "{{ is_state('cover.main_gate', 'closed') and trigger.event.data.action == 'PARTLY_OPEN_AND_CLOSE_GATE' }}"
            sequence:
              # non-blocking call
              - service: script.turn_on
                target:
                  entity_id: script.open_pedestrian_gap
              - delay:
                  seconds: 15
              - condition: "{{ is_state('cover.main_gate', 'open') }}"
              - service: cover.close_cover
                data:
                  entity_id: cover.main_gate
          - conditions:
              - condition: template
                value_template: "{{ is_state('cover.main_gate', 'open') and trigger.event.data.action == 'CLOSE_GATE' }}"
            sequence:
              - service: cover.close_cover
                data:
                  entity_id: cover.main_gate
        # default: intentionally omitted. for safety, do nothing.

  - alias: "Start Cover Timer When Opened"
    id: "e2ec6802-6131-4264-8226-5df65c900699"
    initial_state: true
    trigger:
      - platform: state
        entity_id:
          - cover.main_gate
          - cover.garage_doors_lhs
          - cover.garage_doors_rhs
        to: "open"
    mode: queued
    action:
      # coming out of unavailable is the sensor reappearing, not the cover opening: after a
      # dropped connection this would otherwise restart the timer and reset the opened time,
      # making a cover that has been open for an hour look like it just opened.
      # the timer says which of the two it is, because closing always cancels it:
      #   open -> unavailable -> open: the timer is still running, so we were already timing
      #     this open cover and the clock must be left alone.
      #   closed -> unavailable -> open: the timer is idle, so the cover really was opened
      #     while we couldn't see it, and now is the best estimate of when that happened.
      # this does not cover a restart: triggers are only attached once ha has started, so a
      # cover that reports again during startup is never seen here. a cover opened while ha
      # was down therefore gets no timer, only the startup notification, which is enough.
      - condition: template
        value_template: >-
          {{ (trigger.from_state is not none and trigger.from_state.state == 'closed')
             or is_state('timer.' ~ trigger.entity_id | replace('cover.', '') ~ '_timer', 'idle') }}
      # set before the timer starts, since the live activity reads it on the timer's start
      - service: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.{{ trigger.entity_id | replace('cover.', '') }}_opened"
        data:
          datetime: "{{ now() }}"
      - service: timer.start
        target:
          entity_id: "timer.{{ trigger.entity_id | replace('cover.', '') }}_timer"
        data:
          duration: "00:05:00"

  - alias: "Update Timers For Covers On Startup"
    id: "29fc90a8-8fd1-4aad-a803-81db261509f2"
    initial_state: true
    trigger:
      - platform: homeassistant
        event: start
    mode: single
    action:
      - repeat:
          for_each: "{{ expand('group.covers_with_timers') | map(attribute='entity_id') | list }}"
          sequence:
            # the sensors behind these covers report over the network, so a cover can still be
            # unavailable at this point: wait for a real state instead of deciding on a blank one
            - wait_template: "{{ has_value(repeat.item) }}"
              timeout: "00:02:00"
              continue_on_timeout: true
            # this will fire regardless of whether there's a timer running or it was disabled
            # the implication is: a disabled timer typically means we know a cover is open and that it's on purpose,
            # but we'll remind ourselves anyway, just in case
            - if:
                - condition: template
                  value_template: "{{ is_state(repeat.item, 'open') }}"
              then:
                - service: notify.mobile_app_ceres
                  data:
                    title: "⚠️ Security"
                    message: >-
                      {% set name = None %}
                      {% if repeat.item | regex_search("lhs", ignorecase=True) %}
                        {% set name = "Rouvé's garage door" %}
                      {% elif repeat.item | regex_search("rhs", ignorecase=True) %}
                        {% set name = "Pieter's garage door" %}
                      {% else %}
                        {% set name = "The main gate" %}
                      {% endif %}
                      {{ name }} is open.
                    data:
                      # group notifications by the timer entity
                      group: "timer.{{ repeat.item | replace('cover.', '') }}_timer"
                      url: homeassistant://navigate/lovelace-main/security
                      actions:
                        - action: "CLOSE_COVER"
                          title: "Close now"
                        - action: "EXTEND_COVER_TIMEOUT_10_MIN"
                          title: "Snooze for 10 min"
                        - action: "EXTEND_COVER_TIMEOUT_30_MIN"
                          title: "Snooze for 30 min"
                        - action: "DISABLE_COVER_TIMEOUT"
                          title: "Disable"
                      action_data:
                        # convert this to the cover entity to use in the automation that receives this
                        cover_id: "{{ repeat.item }}"
                        timer_id: "timer.{{ repeat.item | replace('cover.', '') }}_timer"
                      push:
                        # perhaps one day it will be possible to use a template to only make it critical under certain conditions
                        sound:
                          name: default
                          critical: 1
                          volume: 0.3
                # saving for later:
                # if e.g. the gate is open, but the timer was disabled, don't start it now, since it was intentional
                # if the timer wasn't disabled, it will be restored, so the normal mechanism will notify
                # in other words, maintain the status quo
                # can also just create a guard condition to not continue (simpler)
                # - if:
                #     - condition: template
                #       value_template: "{{ is_state('timer.' ~ repeat.item | replace('cover.', 'timer.') ~ '_timer', 'idle') }}"
                #   then:
                #     - service: timer.start
                #       target:
                #         entity_id: "timer.{{ repeat.item | replace('cover.', '') }}_timer"
                #       data:
                #         duration: "00:05:00"
              else:
                # if the cover got opened while the server was running, but closed while down.
                # only act on a cover that actually reports closed: one that never reported
                # tells us nothing, so leave its restored timer running
                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item, 'closed') }}"
                  then:
                    - service: timer.cancel
                      target:
                        entity_id: "timer.{{ repeat.item | replace('cover.', '') }}_timer"

  - alias: "Cover Left Open Alert"
    id: "26bf6fd5-1caf-4c21-ac29-8cd7985b2de7"
    initial_state: true
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.main_gate_timer
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.garage_doors_lhs_timer
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.garage_doors_rhs_timer
    mode: queued
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: cover.main_gate
            state: "open"
          - condition: state
            entity_id: cover.garage_doors_lhs
            state: "open"
          - condition: state
            entity_id: cover.garage_doors_rhs
            state: "open"
    action:
      # this re-arms its own timer below, so it re-nags every timer period on a fixed tag,
      # and ios can neither replace nor group critical notifications: without clearing
      # first, each period stacks another alert that a single clear can't remove
      # https://companion.home-assistant.io/docs/notifications/notifications-basic
      - service: notify.mobile_app_ceres
        data:
          message: "clear_notification"
          data:
            tag: "{{ trigger.event.data.entity_id }}"
      - delay:
          seconds: 1
      # if the cover was closed during the gap above, stop here: the alert would be stale,
      # and this also skips the timer.start below rather than re-arming a zombie timer
      - condition: template
        value_template: >-
          {{ is_state(trigger.event.data.entity_id | replace('_timer', '') | replace('timer', 'cover'), 'open') }}
      # https://companion.home-assistant.io/docs/notifications/critical-notifications/
      - service: notify.mobile_app_ceres
        data:
          title: "⚠️ Security"
          # timer.garage_doors_lhs_timer -> Pieter's garage door
          message: >-
            {% set name = None %}
            {% if trigger.event.data.entity_id | regex_search("lhs", ignorecase=True) %}
              {% set name = "Rouvé's garage door" %}
            {% elif trigger.event.data.entity_id | regex_search("rhs", ignorecase=True) %}
              {% set name = "Pieter's garage door" %}
            {% else %}
              {% set name = "The main gate" %}
            {% endif %}
            {% set last_opened_entity = trigger.event.data.entity_id | replace('_timer', '_opened') | replace('timer.', 'input_datetime.') %}
            {% set last_opened = as_timestamp(states(last_opened_entity)) %}
            {% set utc_now_ts = as_timestamp(utcnow()) %}
            {{ name }} has been left open for {{ ((utc_now_ts - last_opened) // 60) | int }} min.
          data:
            # https://github.com/home-assistant/iOS/issues/579
            # https://github.com/home-assistant/iOS/issues/215
            # https://companion.home-assistant.io/docs/notifications/notifications-basic (to clear and/or replace; note the quotes around 'apns-collapse-id')
            # https://developer.apple.com/documentation/usernotifications/unnotificationrequest/1649634-identifier
            # by apple rules, critical notifications can't be grouped or replaced
            # group notifications by the timer entity
            group: "{{ trigger.event.data.entity_id }}"
            tag: "{{ trigger.event.data.entity_id }}"
            url: homeassistant://navigate/lovelace-main/security
            actions:
              - action: "CLOSE_COVER"
                title: "Close now"
              - action: "EXTEND_COVER_TIMEOUT_10_MIN"
                title: "Snooze for 10 min"
              - action: "EXTEND_COVER_TIMEOUT_30_MIN"
                title: "Snooze for 30 min"
              - action: "DISABLE_COVER_TIMEOUT"
                title: "Disable"
            action_data:
              # convert this to the cover entity to use in the automation that receives this
              cover_id: "{{ trigger.event.data.entity_id | replace('_timer', '') | replace('timer', 'cover') }}"
              timer_id: "{{ trigger.event.data.entity_id }}"
            push:
              # perhaps one day it will be possible to use a template to only make it critical under certain conditions
              sound:
                name: default
                critical: 1
                volume: 0.3
      - service: timer.start
        target:
          entity_id: "{{ trigger.event.data.entity_id }}"

  - alias: "Close Cover From Alert Action"
    id: "4a65ac41-3dae-43dd-ae75-486adfc747b7"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: CLOSE_COVER
    condition:
      # check this for that case where the notification gets sent just as the gate closes
      - condition: template
        value_template: "{{ is_state(trigger.event.data.action_data.cover_id, 'open') }}"
    action:
      - service: cover.close_cover
        data:
          entity_id: "{{ trigger.event.data.action_data.cover_id }}"

  - alias: "Extend Cover Timeout From Alert Action"
    id: "1d1b940e-c70d-47e2-bb39-1e984e5514f1"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: EXTEND_COVER_TIMEOUT_05_MIN
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: EXTEND_COVER_TIMEOUT_10_MIN
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: EXTEND_COVER_TIMEOUT_30_MIN
    action:
      - service: timer.start
        target:
          # {
          #   'id': '0',
          #   'idx': '0',
          #   'platform':
          #     'event',
          #     'event': <Event mobile_app_notification_action[R]:
          #       action=EXTEND_COVER_TIMEOUT_05_MIN,
          #       action_data=
          #         cover_id=cover.garage_doors_rhs,
          #         timer_id=timer.garage_doors_rhs_timer>,
          #       'description': "event 'mobile_app_notification_action'"
          # }
          entity_id: "{{ trigger.event.data.action_data.timer_id }}"
        data:
          # in seconds
          duration: "{{ trigger.event.data.action | regex_findall_index(find='\\d+', index=0, ignorecase=False) | int * 60 }}"

  - alias: "Disable Cover Timeout From Alert Action"
    id: "a8f612ad-fade-45cb-b774-d65feb8831ae"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: DISABLE_COVER_TIMEOUT
    action:
      - service: timer.cancel
        target:
          entity_id: "{{ trigger.event.data.action_data.timer_id }}"

  - alias: "Stop Cover Timer When Closed"
    id: "7ccfaf0f-ab16-4a3b-9b43-e884138971b2"
    initial_state: true
    trigger:
      - platform: state
        entity_id:
          - cover.main_gate
          - cover.garage_doors_lhs
          - cover.garage_doors_rhs
        to: "closed"
    mode: queued
    action:
      - service: timer.cancel
        target:
          entity_id: "{{ trigger.entity_id | replace('cover', 'timer') }}_timer"

  # mirrors each cover timer as a live activity counting down to the next alert.
  # following the timer covers opening, snoozing and the alert re-arming in one place.
  # finished is ignored, since the alert restarts the timer a moment later
  # https://companion.home-assistant.io/docs/notifications/live-activities/
  - alias: "Show Cover Timer Live Activity"
    id: "27966c7c-9df8-48c7-8dfd-4f44c652783a"
    initial_state: true
    trigger:
      - platform: event
        id: "timer"
        event_type:
          - timer.started
          - timer.restarted
          - timer.cancelled
      # a cover closed while its timer is idle (between finishing and re-arming) fires no cancel
      - platform: state
        id: "closed"
        entity_id:
          - cover.main_gate
          - cover.garage_doors_lhs
          - cover.garage_doors_rhs
        to: "closed"
    mode: queued
    variables:
      timer_id: >-
        {{ trigger.event.data.entity_id if trigger.id == 'timer' else trigger.entity_id | replace('cover.', 'timer.') ~ '_timer' }}
      cover_id: "{{ timer_id | replace('timer.', 'cover.') | replace('_timer', '') }}"
      # tags can't contain dots
      tag: "live_{{ timer_id | replace('timer.', '') }}"
    condition:
      - condition: template
        value_template: "{{ cover_id in state_attr('group.covers_with_timers', 'entity_id') }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'timer' and trigger.event.event_type != 'timer.cancelled' and is_state(cover_id, 'open') }}"
            sequence:
              - service: notify.mobile_app_ceres
                data:
                  # the title can't change once started
                  title: >-
                    {% if 'lhs' in cover_id %}
                      Rouvé's garage door
                    {% elif 'rhs' in cover_id %}
                      Pieter's garage door
                    {% else %}
                      Main gate
                    {% endif %}
                  message: >-
                    Open since {{ (states('input_datetime.' ~ cover_id | replace('cover.', '') ~ '_opened') | as_datetime).strftime('%H:%M') }}
                  data:
                    tag: "{{ tag }}"
                    live_update: true
                    chronometer: true
                    when: "{{ as_timestamp(state_attr(timer_id, 'finishes_at')) | int }}"
                    notification_icon: "{{ 'mdi:gate-open' if cover_id == 'cover.main_gate' else 'mdi:garage-open-variant' }}"
                    notification_icon_color: "#03A9F4"
                    # the default, but stated since the bar drains as the alert nears
                    progress_bar_direction: decreasing
                    silent: true
                    url: /lovelace-main/security
        default:
          - service: notify.mobile_app_ceres
            data:
              message: "clear_notification"
              data:
                tag: "{{ tag }}"

  - alias: "Notify If Cover Was Left Open"
    id: "db54683c-0216-4985-9136-de81baee3e00"
    initial_state: true
    trigger:
      platform: state
      entity_id:
        - cover.main_gate
        - cover.garage_doors_lhs
        - cover.garage_doors_rhs
      to: "closed"
      # prevent false positive due to flaky connectivity or after loadshedding and sensors being unavailable
      not_from: "unavailable"
    mode: queued
    condition:
      condition: template
      value_template: >-
        {% set timer_entity = trigger.entity_id | replace('cover', 'timer') ~ "_timer" %}
        {% set duration = state_attr(timer_entity, 'duration') %}
        {% set (hours, minutes, seconds) = duration.split(':') | map('int') %}
        {% set threshold =  minutes*60 + seconds %}
        {% set last_opened_entity = trigger.entity_id | replace('cover', 'input_datetime') ~ "_opened" %}
        {% set last_opened = as_timestamp(states(last_opened_entity)) %}
        {% set utc_now_ts = as_timestamp(utcnow()) %}
        {{ (utc_now_ts - last_opened) | int >= threshold }}
    action:
      - service: notify.mobile_app_ceres
        data:
          message: "clear_notification"
          data:
            tag: "{{ trigger.entity_id | replace('cover', 'timer') }}_timer"
      # we need to wait, otherwise it seems like the next notification will be cleared too
      # could be a race condition in HA, the companion app, ios or firebase – who knows...
      - delay:
          seconds: 1
      - service: notify.mobile_app_ceres
        data:
          title: "⚠️ Security"
          # cover.garage_doors_rhs -> Pieter's garage door
          message: >-
            {% set name = None %}
            {% if trigger.entity_id | regex_search("lhs", ignorecase=True) %}
              {% set name = "Rouvé's garage door" %}
            {% elif trigger.entity_id | regex_search("rhs", ignorecase=True) %}
              {% set name = "Pieter's garage door" %}
            {% else %}
              {% set name = "The main gate" %}
            {% endif %}
            {% set last_opened_entity = trigger.entity_id | replace('cover', 'input_datetime') ~ "_opened" %}
            {% set last_opened = as_timestamp(states(last_opened_entity)) %}
            {{ name }} has been closed after {{ ((as_timestamp(utcnow()) - last_opened) // 60) | int }} min.
          data:
            # the timer entity
            # cover.garage_doors_rhs -> timer.garage_doors_rhs_timer
            group: "{{ trigger.entity_id | replace('cover', 'timer') }}_timer"
            tag: "{{ trigger.entity_id | replace('cover', 'timer') }}_timer"
            url: homeassistant://navigate/lovelace-main/security

  - alias: "Alert If Garages Opened Or Closed When Not Supposed To"
    id: "ad4db54e-fbb3-4377-9711-4731d58da0f5"
    initial_state: true
    trigger:
      platform: state
      entity_id:
        - cover.garage_doors_lhs
        - cover.garage_doors_rhs
      from:
        - "open"
        - "closed"
      to:
        - "open"
        - "closed"
    condition:
      - condition: state
        entity_id: binary_sensor.anybody_home
        state: "off"
    action:
      - variables:
          message: >-
            {% set name = None %}
            {% if trigger.entity_id | regex_search("lhs", ignorecase=True) %}
              {% set name = "Rouvé's garage door" %}
            {% else %}
              {% set name = "Pieter's garage door" %}
            {% endif %}
            {% set action = 'opened' if (trigger.to_state.state == 'open') else 'closed' %}
            {{ name }} has been {{ action }}.
      # https://companion.home-assistant.io/docs/notifications/notification-commands#request-location-updates
      - service: notify.mobile_app_ceres
        data:
          message: "request_location_update"
      - service: notify.mobile_app_rouve
        data:
          message: "request_location_update"
      - delay:
          seconds: 45
      # give the location update a chance to land, then only alert if presence still hasn't been confirmed
      - condition: state
        entity_id: binary_sensor.anybody_home
        state: "off"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'open' }}"
            sequence:
              - service: notify.mobile_app_ceres
                data:
                  title: "⚠️ Security"
                  message: "{{ message }}"
                  data:
                    group: "{{ trigger.entity_id }}"
                    url: homeassistant://navigate/lovelace-main/security
                    actions:
                      - action: "CLOSE_COVER"
                        title: "Close now"
                    action_data:
                      # convert this to the cover entity to use in the automation that receives this
                      cover_id: "{{ trigger.entity_id | replace('_timer', '') | replace('timer', 'cover') }}"
                      timer_id: "{{ trigger.entity_id }}"
                    # todo: make critical?
        default:
          - service: notify.mobile_app_ceres
            data:
              title: "⚠️ Security"
              message: "{{ message }}"
              data:
                group: "{{ trigger.entity_id }}"
                url: homeassistant://navigate/lovelace-main/security

  - alias: "Alert If Gate Opened Or Closed When Not Supposed To"
    id: "62a52103-4d0d-429e-a59a-fc674d72f3ee"
    initial_state: true
    trigger:
      platform: state
      entity_id:
        - cover.main_gate
      # prevent false positive due to flaky connectivity or after loadshedding and sensors being unavailable
      not_from: "unavailable"
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.anybody_home
          state: "off"
          for:
            minutes: 1
        - condition: state
          entity_id: binary_sensor.tenant_present
          state: "off"
        - condition: state
          entity_id: binary_sensor.housekeeper_mobile_phone
          state: "off"
    action:
      - variables:
          message: >-
            {% set action = 'opened' if (trigger.to_state.state == 'open') else 'closed' %}
            The main gate has been {{ action }}.
      # https://companion.home-assistant.io/docs/notifications/notification-commands#request-location-updates
      - service: notify.mobile_app_ceres
        data:
          message: "request_location_update"
      - service: notify.mobile_app_rouve
        data:
          message: "request_location_update"
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.tenant_mobile_phone
      - delay:
          seconds: 15
      # give the location updates a chance to land, then only alert if presence still hasn't been confirmed
      - condition: and
        conditions:
          - condition: state
            entity_id: binary_sensor.anybody_home
            state: "off"
          - condition: state
            entity_id: binary_sensor.tenant_present
            state: "off"
          - condition: state
            entity_id: binary_sensor.housekeeper_mobile_phone
            state: "off"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'open' }}"
            sequence:
              - service: notify.mobile_app_ceres
                data:
                  title: "⚠️ Security"
                  message: "{{ message }}"
                  data:
                    group: "{{ trigger.entity_id }}"
                    url: homeassistant://navigate/lovelace-main/security
                    # https://companion.home-assistant.io/docs/notifications/actionable-notifications#building-notification-action-scripts
                    actions:
                      - action: "CLOSE_COVER"
                        title: "Close now"
                    action_data:
                      # convert this to the cover entity to use in the automation that receives this
                      cover_id: "{{ trigger.entity_id | replace('_timer', '') | replace('timer', 'cover') }}"
                      timer_id: "{{ trigger.entity_id }}"
                    # todo: make critical?
        default:
          - service: notify.mobile_app_ceres
            data:
              title: "⚠️ Security"
              message: "{{ message }}"
              data:
                group: "{{ trigger.entity_id }}"
                url: homeassistant://navigate/lovelace-main/security

  - alias: "Alert When Cabinet Opened"
    id: "f9a95e6c-e0bf-45a4-bf5c-3b774ff3fd47"
    trigger:
      - platform: state
        entity_id: binary_sensor.cabinet_door
        # https://www.home-assistant.io/integrations/binary_sensor/
        # not open/close unless it's a cover
        to: "on"
        # not going to use this, since it seems the sensor just goes unavailable,
        # but will come back online when the state changes – annoyingly so (just stay online)
        # not_from: "unavailable"
    action:
      - choose:
          - conditions:
              - condition: time
                after: "21:00:00"
                before: "07:00:00"
              # maybe later; not sure yet
              # - condition: state
              #   entity_id: binary_sensor.pieter_present
              #   state: "off"
            sequence:
              - service: notify.mobile_app_ceres
                data:
                  title: "⚠️ Security"
                  message: >-
                    The backup power system's cabinet has been opened!
                  data:
                    group: "home-security"
                    url: homeassistant://navigate/lovelace-main/security
                    push:
                      sound:
                        name: default
                        critical: 1
                        volume: 0.3
        default:
          - service: notify.mobile_app_ceres
            data:
              title: "⚠️ Security"
              message: >-
                The backup power system's cabinet has been opened.
              data:
                group: "home-security"
                url: homeassistant://navigate/lovelace-main/security
