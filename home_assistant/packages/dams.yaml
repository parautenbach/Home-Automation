homeassistant:
  customize:
    package.node_anchors:
      dam_full_storage_capacity: &dam_full_storage_capacity
        icon: "mdi:waves"
        value_template: >-
          {{ value | float(0) | multiply(1000000) | int(0) }}
        unit_of_measurement: "m³"
        on_error:
          value: last
      dam_level_percentage: &dam_level_percentage
        icon: "mdi:waves"
        value_template: >-
          {{ value | float(0) }}
        unit_of_measurement: "%"
        on_error:
          value: last

shell_command:
  download_latest_dam_levels: "/root/scripts/download_latest_dam_levels.sh"

template:
  - sensor:
      - name: "Cape Town Major Dams Total Level This Week"
        unique_id: "693844bf-bf47-4e71-abe1-47b9b398daae"
        icon: mdi:waves
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{% from 'environment.jinja' import dam_data_ok %}{{ dam_data_ok('this_week') }}"
        state: "{% from 'environment.jinja' import dam_total %}{{ dam_total('this_week') }}"

      - name: "Cape Town Major Dams Total Level Last Week"
        unique_id: "6afd64f2-4305-48df-a269-ec9c8dfcaa7b"
        icon: mdi:waves
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{% from 'environment.jinja' import dam_data_ok %}{{ dam_data_ok('last_week') }}"
        state: "{% from 'environment.jinja' import dam_total %}{{ dam_total('last_week') }}"

      - name: "Cape Town Major Dams Total Level Last Year"
        unique_id: "896366dc-5eac-4c45-b6fc-63cbfeaa70d6"
        icon: mdi:waves
        unit_of_measurement: "%"
