automation:
  - alias: "Download Dam Levels Data"
    id: "0cb4d6ba-5a63-45f7-8adc-efb98724a44e"
    # replaced by scraper
    initial_state: false
    trigger:
      - platform: time
        at: "05:00:00"
    action:
      - service: shell_command.download_latest_dam_levels

  - alias: "Send Dam Level Update"
    id: "40f9506b-f35b-43ca-903b-7c7b3f006510"
    trigger:
      - platform: state
        entity_id: sensor.dam_levels_last_update
        not_from: ["unavailable", "unknown"]
        not_to: ["unavailable", "unknown"]
        for: "00:01:00"
    condition:
      - condition: template
        value_template: >-
          {{ [
            'sensor.cape_town_major_dams_total_level_this_week',
            'sensor.cape_town_major_dams_total_level_last_week',
            'sensor.cape_town_major_dams_total_level_last_year'
          ] | map('states') | select('in', ['unknown', 'unavailable']) | list | count == 0 }}
    action:
      - service: notify.mobile_app_ceres
        data:
          title: "💧 Dam Levels"
          message: >-
            {% set this_week = states('sensor.cape_town_major_dams_total_level_this_week') | float(0) %}
            {% set last_week = states('sensor.cape_town_major_dams_total_level_last_week') | float(0) %}
            {% set last_year = states('sensor.cape_town_major_dams_total_level_last_year') | float(0) %}
            {% set from_date = trigger.from_state.state | as_datetime %}
            {% set to_date = trigger.to_state.state | as_datetime %}
            {% set days = (to_date - from_date).days %}
            {# the other option is to use percentage points for a pure delta #}
            {% set change = ((this_week - last_week) / last_week * 100) | abs | round(1) if last_week > 0 else 0 %}
            {% if this_week > last_week %}
              {% set update = 'rose by ' ~ change ~ '% to ' ~ this_week ~ '%' %}
            {% elif this_week < last_week %}
              {% set update = 'dropped by ' ~ change ~ '% to ' ~ this_week ~ '%' %}
            {% else %}
              {% set update = 'is stable at ' ~ this_week ~ '%' %}
            {% endif %}
            Dam levels {{ update }} over the past {{ days }} days. Last year it was at {{ last_year }}%.
          data:
            url: homeassistant://navigate/lovelace-main/environment
            group: "environment"
