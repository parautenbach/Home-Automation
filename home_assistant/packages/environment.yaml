# ─────────────────────────────────────────────────────────
# Thermal time constant (tau) reference — living room / office zone
# tau (clear night, confirmed) ~= 15h (14.4-15.5h)
# tau (cloudy night)           ~= 21-26h
# UA and C below were derived using the OLD tau=37.7h estimate
# and should be refit against tau=15h before trusting formula 5-6
# absolute power/energy numbers.
#
# Core relationship (T_outside assumed constant over the window):
#   T_inside(t) = T_outside + (T_inside_0 - T_outside) * e^(-t / tau)
#
# 1. Predict inside temp after time t (free decay, no heating)
#    T_inside(t) = T_outside + (T_inside_0 - T_outside) * e^(-t / tau)
#    Example: inside 17C, outside steady at 9C, tau=15h, t=6h
#      T_inside = 9 + (17-9) * e^(-6/15) = 14.4C
#
# 2. Time to reach a target inside temperature
#    t = -tau * ln[ (T_target - T_outside) / (T_inside_0 - T_outside) ]
#    Example: 17C -> 15C, outside 9C, tau=15h
#      t = -15 * ln[(15-9)/(17-9)] = 4.3h
#
# 3. Quick "time per degree" near current conditions (small steps only)
#    t ~= tau / (T_inside_0 - T_outside)
#    Example: dT=8C, tau=15h -> ~1.9h per degree right now
#
# 4. Standard decay milestones (fraction of inside-outside gap closed)
#    50%    -> 0.69 * tau
#    63.2%  -> 1.00 * tau
#    86.5%  -> 2.00 * tau
#    95%    -> 3.00 * tau
#
# 5. Steady-state heating power to hold a target inside temperature
#    P = UA * (T_target - T_outside) = (C / tau) * (T_target - T_outside)
#
# 6. Time to heat from T_inside_0 to a target, constant heater power P
#    T_eq = T_outside + P / UA     (equilibrium temp the heater alone sustains)
#    t = -tau * ln[ (T_target - T_eq) / (T_inside_0 - T_eq) ]
#
# 7. Energy needed for a temperature rise (ignoring ongoing losses)
#    E = C * (T_target - T_inside_0)
#
# Caveats:
#  - Single lumped zone (this room), not necessarily the whole house
#  - Assumes T_outside constant over the window; use small time-steps
#    with real forecast T_outside for anything beyond a few hours
#  - No wind/cloud term - use tau~15h clear nights, ~21-26h cloudy
#  - Ignores internal gains and residual daytime solar mass release,
#    which distorts predictions for the first few hours after sunset
# ─────────────────────────────────────────────────────────
# refereince: https://claude.ai/chat/454df39a-7aa8-40db-a698-9ec0f6aaed35

homeassistant:
  customize:
    sensor.conditions_temperature:
      friendly_name: Temperature
    sensor.conditions_humidity:
      friendly_name: Humidity
    sensor.ambient_temperature_filtered:
      friendly_name: Temperature
    # sensor.uva_irradiance:
    #   icon: mdi:weather-sunny-alert
    # sensor.uvb_irradiance:
    #   icon: mdi:weather-sunny-alert
    # sensor.saaqis_pm_coarse:
    #   icon: mdi:grain
    # sensor.saaqis_pm_10:
    #   icon: mdi:grain
    #   device_class: pm10
    # sensor.saaqis_pm_2_5:
    #   icon: mdi:grain
    #   device_class: pm25
    sensor.saaqis_o3:
      icon: mdi:skull-outline
    sensor.saaqis_no2:
      icon: mdi:smog
    sensor.saaqis_so2:
      icon: mdi:smog
    sensor.owm_pollution_overall_air_quality:
      icon: mdi:lungs
      device_class: aqi
      # unit_of_measurement: aqi
    sensor.owm_pollution_ammonia_nh3:
      icon: mdi:skull
      unit_of_measurement: "µg/m³"
    sensor.owm_pollution_carbon_monoxide_co:
      icon: mdi:molecule-co
      device_class: carbon_monoxide
    sensor.owm_pollution_coarse_particles_pm10:
      icon: mdi:grain
      device_class: pm10
    sensor.owm_pollution_fine_particles_pm2_5:
      icon: mdi:grain
      device_class: pm25
    sensor.owm_pollution_nitrogen_dioxide_no2:
      icon: mdi:smog
      device_class: nitrogen_dioxide
    sensor.owm_pollution_nitrogen_monoxide_no:
      icon: mdi:smog
      device_class: nitrogen_monoxide
    sensor.owm_pollution_ozone_o3:
      icon: mdi:skull-outline
      device_class: ozone
    sensor.owm_pollution_sulphur_dioxide_so2:
      icon: mdi:smog
      device_class: sulphur_dioxide
    sensor.bedroom_ht_temperature:
      friendly_name: Bedroom Temperature
      state_class: measurement
    sensor.bedroom_ht_humidity:
      friendly_name: Bedroom Humidity
    sensor.main_bedroom_ht_temperature:
      friendly_name: Main Bedroom Temperature
      state_class: measurement
    sensor.main_bedroom_ht_humidity:
      friendly_name: Main Bedroom Humidity
    sensor.home_sun_daylight:
      state_class: measurement
    sensor.temperature_difference:
      state_class: measurement

binary_sensor:
  - platform: trend
    sensors:
      inside_temperature_trend:
        entity_id: sensor.office_temperature
        friendly_name: "Inside Temperature Trend"
        # 30 minutes * 60 seconds
        sample_duration: 1800
        # 1 degree in the last 30 min
        min_gradient: 0.00056

sensor:
  - platform: filter
    name: ambient_temperature_filtered
    entity_id: sensor.conditions_temperature
    filters:
      filter: lowpass
      time_constant: 10
      precision: 1

  - platform: statistics
    entity_id: sensor.office_temperature
    name: "Inside Temperature Change"
    # the difference between the newest and the oldest measurement
    state_characteristic: change
    max_age:
      minutes: 30

  - platform: statistics
    name: "Bedroom Minimum Temperature (12 hours)"
    entity_id: sensor.bedroom_ht_temperature
    state_characteristic: value_min
    max_age:
      hours: 12
    precision: 1

  - platform: statistics
    name: "Bedroom Maximum Temperature (12 hours)"
    entity_id: sensor.bedroom_ht_temperature
    state_characteristic: value_max
    max_age:
      hours: 12
    precision: 1

  - platform: statistics
    name: "Bedroom Average Temperature (12 hours)"
    entity_id: sensor.bedroom_ht_temperature
    state_characteristic: average_linear
    max_age:
      hours: 12
    precision: 1

template:
  - binary_sensor:
      # this is just to be able to plot a simple state history,
      # because the history graph chart will do a fancy plot if it sees a climate entity
      - name: Living Room AC
        state: "{{ has_value('climate.living_room_ac') and not is_state('climate.living_room_ac', 'off') }}"
        device_class: running
      - name: Main Bedroom AC
        state: "{{ has_value('climate.main_bedroom_ac') and not is_state('climate.main_bedroom_ac', 'off') }}"
        device_class: running
  - binary_sensor:
      - name: "Golden Hour"
        # https://community.home-assistant.io/t/wth-is-there-no-golden-hour-data-available-to-trigger-light-automations/220359/3
        state: >
          {{ -4 <  states('sensor.solar_angle') | float(0) < 6 }}
        icon: mdi:weather-sunset
  - binary_sensor:
      - name: "Nighttime"
        state: "{{  states('sensor.solar_angle') | float(0) < -0.833 }}"
  - binary_sensor:
      - name: "Daytime"
        state: "{{  states('sensor.solar_angle') | float(0) >= -0.833 }}"
  - sensor:
      - name: Overall Pollen Risk for Badge
        state: >-
          {{ states('sensor.overall_pollen_risk') }}
        attributes:
          label: >-
            {% set mapping = {
                                1: "Very Low",
                                2: "Low",
                                3: "Moderate",
                                4: "High",
                                5: "Very High" } %}
            {% set key = states('sensor.overall_pollen_risk') | int(0) %}
            {{ mapping[key] if key in mapping else "Unknown" }}
          color: >-
            {% set mapping = {
                                1: "#40b100",
                                2: "#ffe500",
                                3: "#ffa800",
                                4: "#ff5800",
                                5: "#aa0000" } %}
            {% set key = states('sensor.overall_pollen_risk') | int(0) %}
            {{ mapping[key] if key in mapping else "#ffffff" }}
        icon: >-
          {% set mapping = {
                              1: "mdi:gauge-empty",
                              2: "mdi:gauge-low",
                              3: "mdi:gauge",
                              4: "mdi:gauge-full",
                              5: "mdi:gauge-full" } %}
          {% set key = states('sensor.overall_pollen_risk') | int(0) %}
          {{ mapping[key] if key in mapping else "mdi:alert" }}
  - sensor:
      - name: "Sun Angle"
        unique_id: "87e4fff1-5099-41a6-9c1a-6c95e0f491ab"
        default_entity_id: sensor.solar_angle
        unit_of_measurement: '°'
        state: "{{ '%+.1f' | format(state_attr('sun.sun', 'elevation')) }}"
        icon: mdi:sun-angle-outline
  - sensor:
      - name: "Daylight Length"
        unique_id: "561ee1b3-fcf4-4477-9f93-d7c402b9283b"
        default_entity_id: sensor.daylight_hm
        state: >-
          {{ state_attr('sensor.home_sun_daylight', 'today_hms')[:5] }}
        icon: mdi:weather-sunny
  - sensor:
      - name: "Nighttime Number"
        unique_id: "4afecc94-25fc-41a3-a11d-162044c1dda8"
        state: "{{ iif(is_state('binary_sensor.nighttime', 'on'), 1, 0) }}"
  - sensor:
      - name: "Inside vs Outside Temperature"
        unique_id: "77c739d7-87b1-47f7-bcf5-a26f2a484335"
        default_entity_id: sensor.temperature_difference
        state: >-
          {{ (states('sensor.office_temperature') | float(0) - states('sensor.outside_temperature_filtered') | float(0)) | round(1) }}
        device_class: temperature
        unit_of_measurement: "°C"
  - sensor:
      - name: Time of Day
        unique_id: "9c81145a-3e30-4850-8e4a-3b8873be4333"
        state: "{{ 'Day' if states('sensor.solar_angle') | float(0) >= -0.833 else 'Night' }}"
        # icon
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.stormglass_simon_s_town_tide_extremes
        attribute: data
      - platform: time
        at:
          - sensor.stormglass_simon_s_town_next_low_tide
          - sensor.stormglass_simon_s_town_next_high_tide
    sensor:
      - name: Stormglass Simon's Town Next Low Tide
        unique_id: "a6216372-5645-4653-a4ee-32646296b0b2"
        icon: mdi:waves-arrow-left
        device_class: timestamp
        variables:
          next_at: >-
            {% from 'environment.jinja' import next_tide_extreme %}
            {% set data = state_attr('sensor.stormglass_simon_s_town_tide_extremes', 'data') %}
            {% set phase = 'low' %}
            {{ next_tide_extreme(data, phase) }}
        availability: "{{ next_at != '' or this.state not in ['unknown', 'unavailable'] }}"
        state: "{{ next_at if next_at != '' else this.state }}"
      - name: Stormglass Simon's Town Next High Tide
        unique_id: "a62c01e5-b90c-423e-b8f7-efc24a162383"
        icon: mdi:waves-arrow-right
        device_class: timestamp
        variables:
          next_at: >-
            {% from 'environment.jinja' import next_tide_extreme %}
            {% set data = state_attr('sensor.stormglass_simon_s_town_tide_extremes', 'data') %}
            {% set phase = 'high' %}
            {{ next_tide_extreme(data, phase) }}
        availability: "{{ next_at != '' or this.state not in ['unknown', 'unavailable'] }}"
        state: "{{ next_at if next_at != '' else this.state }}"
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.stormglass_simon_s_town_next_low_tide
          - sensor.stormglass_simon_s_town_next_high_tide
    sensor:
      - name: Stormglass Simon's Town Tide Horizontal Movement
        unique_id: "52fe7672-4756-48a7-ab96-31d5e65af582"
        variables:
          next_low: "{{ states('sensor.stormglass_simon_s_town_next_low_tide') | as_timestamp(0) }}"
          next_high: "{{ states('sensor.stormglass_simon_s_town_next_high_tide') | as_timestamp(0) }}"
        icon: >-
          {% if next_low < next_high %}
            mdi:waves-arrow-left
          {% elif next_low > next_high %}
            mdi:waves-arrow-right
          {% else %}
            {# default sensor icon #}
          {% endif %}
        state: >-
          {% if next_low < next_high %}
            outgoing
          {% elif next_low > next_high %}
            incoming
          {% else %}
            unknown
          {% endif %}
        attributes:
          next_tide: >-
            {% if next_low < next_high %}
              low
            {% elif next_low > next_high %}
              high
            {% else %}
              unknown
            {% endif %}
          following_tide: >-
            {% if next_low < next_high %}
              high
            {% elif next_low > next_high %}
              low
            {% else %}
              unknown
            {% endif %}
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.stormglass_simon_s_town_marine_hours
        attribute: hours
      - platform: time_pattern
        minutes: 0
    sensor:
      - name: Stormglass Simon's Town Current Direction
        unique_id: "48f4928e-df4d-4c31-b10e-96e6054da89d"
        icon: mdi:compass-outline
        unit_of_measurement: "°"
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'currentDirection' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) | round(0) | int }}"
      - name: Stormglass Simon's Town Current Speed
        unique_id: "47334c18-dcb8-4a48-b859-30bc795401e7"
        icon: mdi:speedometer
        unit_of_measurement: "m/s"
        device_class: speed
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'currentSpeed' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) }}"
      - name: Stormglass Simon's Town Swell Direction
        unique_id: "bb12a878-7437-4f5d-81e5-ff519db15fa4"
        icon: mdi:compass-outline
        unit_of_measurement: "°"
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'swellDirection' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) | round(0) | int }}"
      - name: Stormglass Simon's Town Swell Height
        unique_id: "f42009dd-141c-41e1-94b4-4af626a71992"
        icon: mdi:arrow-up-down
        unit_of_measurement: "m"
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'swellHeight' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) }}"
      - name: Stormglass Simon's Town Swell Period
        unique_id: "0de68764-b4e7-4541-89d7-aa3185c6ec14"
        icon: mdi:arrow-left-right
        unit_of_measurement: "s"
        device_class: duration
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'swellPeriod' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) }}"
      - name: Stormglass Simon's Town Water Temperature
        unique_id: "b0f1ce76-9cdf-47f9-b256-b3a60d5665ee"
        icon: mdi:water-thermometer-outline
        unit_of_measurement: "°C"
        device_class: temperature
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'waterTemperature' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) }}"
      - name: Stormglass Simon's Town Wave Direction
        unique_id: "606b1c15-cacd-4c2c-bd84-adacdfba3a0f"
        icon: mdi:compass-outline
        unit_of_measurement: "°"
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'waveDirection' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) | round(0) | int }}"
      - name: Stormglass Simon's Town Wave Height
        unique_id: "5089ff5f-2781-46fc-b76b-acb53e57a41e"
        icon: mdi:arrow-up-down
        unit_of_measurement: "m"
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'waveHeight' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) }}"
      - name: Stormglass Simon's Town Wave Period
        unique_id: "9ef143be-739d-4891-801d-eb3f9605a44c"
        icon: mdi:arrow-left-right
        unit_of_measurement: "s"
        device_class: duration
        variables:
          value: >-
            {% from 'environment.jinja' import marine_hour_value %}
            {% set hours = state_attr('sensor.stormglass_simon_s_town_marine_hours', 'hours') %}
            {% set param = 'wavePeriod' %}
            {{ marine_hour_value(hours, param) }}
        availability: "{{ value != '' }}"
        state: "{{ value | float(0) }}"
  - trigger:
      - platform: state
        entity_id: sensor.stormglass_simon_s_town_swell_direction
    sensor:
      - name: "Stormglass Simon's Town Swell Direction Named"
        unique_id: "f10b62e6-7884-4850-b0d6-81b5db962f31"
        variables:
          bearing: "{{ trigger.to_state.state | float(0) }}"
        state: >
          {% from 'environment.jinja' import get_direction_8 %}
          {{ get_direction_8(bearing) }}
        icon: >
          {% from 'environment.jinja' import get_icon_direction_8 %}
          {{ get_icon_direction_8(bearing) }}
        attributes:
          bearing: "{{ bearing }}"
  - trigger:
      - platform: state
        entity_id: sensor.stormglass_simon_s_town_wave_direction
    sensor:
      - name: "Stormglass Simon's Town Wave Direction Named"
        unique_id: "1393bbe3-3503-4ea4-99d6-a6a98c645864"
        variables:
          bearing: "{{ trigger.to_state.state | float(0) }}"
        state: >
          {% from 'environment.jinja' import get_direction_8 %}
          {{ get_direction_8(bearing) }}
        icon: >
          {% from 'environment.jinja' import get_icon_direction_8 %}
          {{ get_icon_direction_8(bearing) }}
        attributes:
          bearing: "{{ bearing }}"
  - trigger:
      - platform: state
        entity_id: sensor.stormglass_simon_s_town_current_direction
    sensor:
      - name: "Stormglass Simon's Town Current Direction Named"
        unique_id: "1f378862-f1db-46d6-a188-2dd7914fe2a3"
        variables:
          bearing: "{{ trigger.to_state.state | float(0) }}"
        state: >
          {% from 'environment.jinja' import get_direction_8 %}
          {{ get_direction_8(bearing, flip=true) }}
        icon: >
          {% from 'environment.jinja' import get_icon_direction_8 %}
          {{ get_icon_direction_8(bearing) }}
        attributes:
          bearing: "{{ bearing }}"
multiscrape:
  - resource: https://pollencount.co.za/
    scan_interval: 21600  # 60*60*6 or 4 updates per day
    timeout: 30
    log_response: true
    sensor:
      - name: Overall Pollen Risk
        icon: mdi:flower-pollen-outline
        select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(2) > div"
        attribute: "class"
        value_template: >-
          {# set value = ["pollen-darkorange"] #}
          {%- from 'environment.jinja' import color_level_map -%}
          {%- set key = value | first -%}
          {{ color_level_map[key] if key in color_level_map else "unknown" }}
        on_error:
          value: last
        attributes:
          - name: Label
            select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(2) > div"
            attribute: "class"
            value_template: >-
              {%- from 'environment.jinja' import color_label_map -%}
              {%- set key = value | first -%}
              {{ color_label_map[key] if key in color_label_map else "Unavailable" }}
            on_error:
              value: last
          # this looks like massive duplication, but we want attributes here so that we can trigger on state
          # changes of this sensor if an individual pollen level has changed. we need the individual sensors
          # so that we can set a name and an icon for use on dashboards. granted, we can make these normal
          # template sensors that extracts the attributes from here.
          - name: Tree Pollen
            select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(3) > div"
            attribute: "class"
            value_template: >-
              {%- from 'environment.jinja' import color_label_map -%}
              {%- set key = value | first -%}
              {{ color_label_map[key] if key in color_label_map else "unknown" }}
            on_error:
              value: last
          - name: Grass Pollen
            select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(4) > div"
            attribute: "class"
            value_template: >-
              {%- from 'environment.jinja' import color_label_map -%}
              {%- set key = value | first -%}
              {{ color_label_map[key] if key in color_label_map else "unknown" }}
            on_error:
              value: last
          - name: Weed Pollen
            select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(5) > div"
            attribute: "class"
            value_template: >-
              {%- from 'environment.jinja' import color_label_map -%}
              {%- set key = value | first -%}
              {{ color_label_map[key] if key in color_label_map else "unknown" }}
            on_error:
              value: last
          - name: Mould Spores
            select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(6) > div"
            attribute: "class"
            value_template: >-
              {%- from 'environment.jinja' import color_label_map -%}
              {%- set key = value | first -%}
              {{ color_label_map[key] if key in color_label_map else "unknown" }}
            on_error:
              value: last
      - name: Tree Pollen
        icon: mdi:pine-tree
        select: "#wpv-view-layout-300 .row:has(h5:-soup-contains('Cape Town')) > div.col-xs-2:nth-of-type(3) > div"
        attribute: "class"
        value_template: >-
          {%- from 'environment.jinja' import color_level_map -%}
          {%- set key = value | first -%}
          {{ color_level_map[key] if key in color_level_map else "unknown" }}
        on_error:
          value: last
        attributes:
          - name: Label
