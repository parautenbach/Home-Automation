automation:
  - alias: "Pollen Levels Update"
    id: "eeb7f4a7-367d-4aee-b4d5-cf84da3b1323"
    initial_state: true
    trigger:
      # If only entity_id is given, the trigger will fire for all state changes, even if only state attributes change.
      # https://www.home-assistant.io/docs/automation/trigger/#state-trigger
      - platform: state
        entity_id:
          - sensor.overall_pollen_risk
        # avoid triggering on attribute changes
        # https://www.home-assistant.io/docs/automation/trigger/#state-trigger
        # not_from: null
        # actually, we want to trigger on attribute changes; just not on the individual pollen sensors too
    mode: single
    # workaround for the case where the multiscrape sensor during startup adds the icon separately after updating the state,
    # which causes the state trigger to fire when including attribute changes
    # https://github.com/danieldotnl/ha-multiscrape/issues/437
    # {
    #     'id': '0',
    #     'idx': '0',
    #     'alias': None,
    #     'platform': 'state',
    #     'entity_id': 'sensor.overall_pollen_risk',
    #     'from_state': {
    #         'state': '4',
    #         'label': 'High',
    #         'tree_pollen': 'Moderate',
    #         'grass_pollen': 'Moderate',
    #         'weed_pollen': 'Moderate',
    #         'mould_spores': 'Very Low',
    #         'friendly_name': 'Overall Pollen Risk',
    #         'unit_of_measurement': 'index',
    #         'timestamp': '2025-01-24T17:32:44.031622+02:00'
    #     },
    #     'to_state': {
    #         'state': '4',
    #         'label': 'High',
    #         'tree_pollen': 'Moderate',
    #         'grass_pollen': 'Moderate',
    #         'weed_pollen': 'Moderate',
    #         'mould_spores': 'Very Low',
    #         'icon': 'mdi:flower-pollen-outline',
    #         'friendly_name': 'Overall Pollen Risk',
    #         'unit_of_measurement': 'index',
    #         'timestamp': '2025-01-24T17:32:44.031622+02:00'
    #     },
    #     'for': None,
    #     'attribute': None,
    #     'description': 'state of sensor.overall_pollen_risk'
    # }
    condition:
      - condition: template
        value_template: "{{ 'icon' in trigger.from_state.attributes }}"
    action:
      - service: notify.family
        data:
          title: "⛑️ Health"
          # https://community.home-assistant.io/t/trigger-to-from-attribute/325345
          # https://community.home-assistant.io/t/access-attribute-of-from-state/380497
          message: >-
            {%- macro build_item(sensor, name) -%}
              {%- set attribute = sensor.split('.')[1] -%}
              {%- set from = trigger.from_state.attributes[attribute] | lower -%}
              {%- set to = trigger.to_state.attributes[attribute] | lower -%}
              {%- if from != to and (from != 'unavailable' or to != 'unavailable') -%}
                {{ name }}: {{ from }} → {{ to }}
              {%- else -%}
                {{ name }}: {{ to }}
              {%- endif -%}
            {%- endmacro -%}
            {%- set sensors = [('sensor.tree_pollen', 'Trees'), ('sensor.grass_pollen', 'Grasses'), ('sensor.weed_pollen', 'Weeds'), ('sensor.mould_spores', 'Mould')] -%}
            {%- set summary = '' -%}
            {%- set from_state_label = trigger.from_state.attributes.label | lower -%}
            {%- set to_state_label = trigger.to_state.attributes.label | lower -%}
            {%- if from_state_label != to_state_label -%}
              {%- set summary = 'Pollen levels changed from ' ~ from_state_label ~ ' to ' ~ to_state_label ~ ':' -%}
            {%- else -%}
              {%- set summary = 'Pollen levels are ' ~ to_state_label ~ ':' -%}
            {%- endif -%}
            {{ summary }}
            {%- for (sensor, name) in sensors %}
              - {{ build_item(sensor, name) }}
            {%- endfor %}
          data:
            group: "environment"
            url: homeassistant://navigate/lovelace-main/environment

  - alias: "High Fire Risk Notification"
    id: "657e1700-f69f-416e-9b62-269d702e8a38"
    initial_state: true
    trigger:
      - platform: numeric_state
        entity_id: sensor.winelands_fdi
        above: 45
    mode: single
    action:
      - service: notify.mobile_app_ceres
        data:
          title: "🔥 Environment"
          message: >-
            The risk of fires is high. FDI: {{ states('sensor.winelands_fdi') }}.
          data:
            group: "environment"
            url: homeassistant://navigate/lovelace-main/environment


  # polling should be turned off for this sql sensor (via the ui)
  # https://github.com/home-assistant/core/issues/71563
  #
  # helper query:
  #   SELECT * FROM states_meta WHERE entity_id = 'sensor.bedroom_ht_temperature';
  #
  # sql sensor query:
  #   SELECT state::NUMERIC AS state
  #   FROM states
  #   WHERE metadata_id = 17128
  #     AND state NOT IN ('unavailable', 'unknown')
  #     AND TO_TIMESTAMP(last_updated_ts) <= NOW() - INTERVAL '24 hours'
  #   ORDER BY last_updated_ts DESC
  #   LIMIT 1;
  - alias: "Update Bedroom Temperature 24 Hours Ago"
    id: "3a6fa2e6-355b-405b-b53a-5d52d8e3aa84"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.bedroom_ht_temperature
        # trigger on any state change, but not attribute changes
        to: null
      - platform: time_pattern
        minutes: "/30"
      - platform: homeassistant
        event: start
    mode: single
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.bedroom_temperature_24_hours_ago

