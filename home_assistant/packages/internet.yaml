homeassistant:
  customize:
    sensor.internet_speed_in:
      friendly_name: 'Download Traffic'
      icon: mdi:download
    sensor.internet_speed_out:
      friendly_name: 'Upload Traffic'
      icon: mdi:upload
    # kept for reference/comparison against the 64-bit sensors below; safe to remove after ~2026-10
    sensor.internet_usage_in:
      friendly_name: 'Download Usage'
      icon: mdi:download
    sensor.internet_usage_out:
      friendly_name: 'Upload Usage'
      icon: mdi:upload
    sensor.daily_internet_usage_in:
      friendly_name: 'Daily Downloads'
      icon: mdi:download
      state_class: total_increasing
    sensor.daily_internet_usage_out:
      friendly_name: 'Daily Uploads'
      icon: mdi:upload
      state_class: total_increasing
    sensor.monthly_internet_usage_in:
      friendly_name: 'Monthly Downloads'
      icon: mdi:download
    sensor.monthly_internet_usage_out:
      friendly_name: 'Monthly Uploads'
      icon: mdi:upload
    sensor.internet_usage_in_64:
      friendly_name: 'Download Usage'
      icon: mdi:download
    sensor.internet_usage_out_64:
      friendly_name: 'Upload Usage'
      icon: mdi:upload
    sensor.daily_internet_usage_in_64:
      friendly_name: 'Daily Downloads'
      icon: mdi:download
      state_class: total_increasing
    sensor.daily_internet_usage_out_64:
      friendly_name: 'Daily Uploads'
      icon: mdi:upload
      state_class: total_increasing
    sensor.monthly_internet_usage_in_64:
      friendly_name: 'Monthly Downloads'
      icon: mdi:download
    sensor.monthly_internet_usage_out_64:
      friendly_name: 'Monthly Uploads'
      icon: mdi:upload
    binary_sensor.internet:
      scan_interval: 60
    sensor.internet_packet_loss:
      friendly_name: Internet Packet Loss
      icon: mdi:cancel
    sensor.internet_round_trip_time_avg:
      friendly_name: Internet Mean Ping Time
      icon: mdi:timer-outline
    sensor.internet_jitter:
      friendly_name: Internet Jitter
      icon: mdi:sigma-lower
    binary_sensor.front_extender:
      scan_interval: 30
    sensor.front_extender_packet_loss:
      friendly_name: Front Extender Packet Loss
      icon: mdi:cancel
    sensor.front_extender_round_trip_time_avg:
      friendly_name: Front Extender Mean Ping Time
      icon: mdi:timer-outline
    sensor.front_extender_jitter:
      friendly_name: Front Extender Jitter
      icon: mdi:sigma-lower
    binary_sensor.back_extender:
      scan_interval: 30
    sensor.back_extender_packet_loss:
      friendly_name: Back Extender Packet Loss
      icon: mdi:cancel
    sensor.back_extender_round_trip_time_avg:
      friendly_name: Back Extender Mean Ping Time
      icon: mdi:timer-outline
    sensor.back_extender_jitter:
      friendly_name: Back Extender Jitter
      icon: mdi:sigma-lower

# why these when you can just look at the last_changed property?
# because this is more resilient against restarts
input_datetime:
  front_extender_disconnected:
    has_date: true
    has_time: true
  back_extender_disconnected:
    has_date: true
    has_time: true

timer:
  front_extender_disconnected:
    duration: "00:1:00"
    restore: true
  back_extender_disconnected:
    duration: "00:1:00"
    restore: true

utility_meter:
  daily_internet_usage_in:
    unique_id: "f6f3293b-81e9-4427-95ad-ed467f642ee3"
    source: sensor.internet_usage_in
    cycle: daily
  monthly_internet_usage_in:
    unique_id: "692217cc-cb53-4ade-aaf2-a7810c1dd287"
    source: sensor.internet_usage_in
    cycle: monthly
  daily_internet_usage_out:
    unique_id: "f967f73e-cd3e-428d-873e-0f11ce703c7e"
    source: sensor.internet_usage_out
    cycle: daily
  monthly_internet_usage_out:
    unique_id: "00f46f8f-f570-4e3f-a883-7b747d36d47f"
    source: sensor.internet_usage_out
    cycle: monthly
  daily_internet_usage_in_64:
    unique_id: "aa255d75-688e-4c43-97f4-ed3db54c0997"
    source: sensor.internet_usage_in_64
    cycle: daily
  monthly_internet_usage_in_64:
    unique_id: "4f0df1ad-e7e8-4f90-91b4-4a3f7024dc50"
    source: sensor.internet_usage_in_64
    cycle: monthly
  daily_internet_usage_out_64:
    unique_id: "c7c132ea-da63-414d-85da-3aad78612b75"
    source: sensor.internet_usage_out_64
    cycle: daily
  monthly_internet_usage_out_64:
    unique_id: "6b1114a2-1276-4860-9084-84ce207cc6eb"
    source: sensor.internet_usage_out_64
    cycle: monthly

sensor:
  # https://community.ui.com/releases/UniFi-OS-Dream-Router-4-0-6/305296c8-c5ed-4dbf-b79e-cb259945d9fb
  # ifIndex 44 (ppp0) is the logical WAN interface/route, but its software counters massively
  # undercount real usage - hardware NAT/flow offload fast-paths established connections straight
  # through the switch silicon, bypassing ppp0's kernel stats entirely. eth4 (ifIndex 14) is the
  # physical WAN port below that offload, so its counters reflect the true byte totals.
  - platform: snmp
    name: snmp_wan_in
    host: 192.168.0.1
    community: !secret router_snmp_community
    version: 2c
    baseoid: 1.3.6.1.2.1.2.2.1.10.14  # ifInOctets.14: eth4
    unit_of_measurement: octets

  - platform: snmp
    name: snmp_wan_out
    host: 192.168.0.1
    community: !secret router_snmp_community
    version: 2c
    baseoid: 1.3.6.1.2.1.2.2.1.16.14  # ifOutOctets.14: eth4
    unit_of_measurement: octets

  - platform: snmp
    name: snmp_wan_in_64
    host: 192.168.0.1
    community: !secret router_snmp_community
    version: 2c
    baseoid: 1.3.6.1.2.1.31.1.1.1.6.14  # 64-bit, eth4
    unit_of_measurement: octets

  - platform: snmp
    name: snmp_wan_out_64
    host: 192.168.0.1
    community: !secret router_snmp_community
    version: 2c
    baseoid: 1.3.6.1.2.1.31.1.1.1.10.14  # 64-bit, eth4
    unit_of_measurement: octets

  # alternative: https://community.home-assistant.io/t/snmp-bandwidth-monitor-using-statistics/96684/82
  - platform: statistics
    name: 'Internet Traffic In'
    entity_id: sensor.internet_speed_in
    state_characteristic: mean
    # it's a little unclear how to set this, but let's say if this updates every second,
    # 100 samples should cover 1 minute even with some misses
    # https://www.home-assistant.io/integrations/statistics/#an-important-note-on-max_age-and-sampling_size
    sampling_size: 100
    max_age:
      minutes: 1

  - platform: statistics
    name: 'Internet Traffic Out'
    entity_id: sensor.internet_speed_out
    state_characteristic: mean
    sampling_size: 100
    max_age:
      minutes: 1

template:
  - binary_sensor:
      - name: "Internet"
        default_entity_id: binary_sensor.internet_connection
        device_class: connectivity
        state: >-
          {{ is_state('binary_sensor.internet', 'on') }}
        icon: >-
          {% if is_state('binary_sensor.internet', 'on') %}
            mdi:server-network
          {% else %}
            mdi:server-network-off
          {% endif %}
  # https://github.com/home-assistant/core/blob/dev/homeassistant/const.py#L571
  # background on the original delta-tracking approach this replaced:
  # https://community.home-assistant.io/t/snmp-bandwidth-monitor/7122
  # https://community.home-assistant.io/t/snmp-bandwidth-monitor-using-statistics-and-a-utility-meter/176971
  - trigger:
      - platform: state
        entity_id: sensor.snmp_wan_in_64
    sensor:
      - name: "Internet Speed In"
        unique_id: "cb6da88f-f6b0-46ba-a003-6dcce4999e18"
        state: >-
          {% set to = trigger.to_state.state | float(0) %}
          {% set from = trigger.from_state.state | float(0) if trigger.from_state else to %}
          {% set time_delta = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() if trigger.from_state else 0 %}
          {{ (((to - from) * 8) / time_delta / 1000000) | round(3) if time_delta > 0 else 0 }}
        device_class: data_rate
        unit_of_measurement: 'Mbit/s'
  - trigger:
      - platform: state
        entity_id: sensor.snmp_wan_out_64
    sensor:
      - name: "Internet Speed Out"
        unique_id: "da1b796f-2e23-4ca3-88e6-d39fdde983bc"
        state: >-
          {% set to = trigger.to_state.state | float(0) %}
          {% set from = trigger.from_state.state | float(0) if trigger.from_state else to %}
          {% set time_delta = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() if trigger.from_state else 0 %}
          {{ (((to - from) * 8) / time_delta / 1000000) | round(3) if time_delta > 0 else 0 }}
        device_class: data_rate
        unit_of_measurement: 'Mbit/s'
  - sensor:
      - name: "Internet Usage In"
        unique_id: "09c36e4d-7db9-4499-8dbf-99e43452adfd"
        state: "{{ ((states('sensor.snmp_wan_in')  | float(0) ) / 1000000000 ) }}"
        device_class: data_size
        unit_of_measurement: 'GB'
  - sensor:
      - name: "Internet Usage Out"
        unique_id: "09ec3858-8705-4503-a162-afebb2808d27"
        state: "{{ ((states('sensor.snmp_wan_out') | float(0) ) / 1000000000 ) }}"
        device_class: data_size
        unit_of_measurement: 'GB'
  - sensor:
      - name: "Internet Usage In (64)"
        unique_id: "ca6f49a3-33a5-44d8-b6e7-8051c58967ff"
        state: "{{ ((states('sensor.snmp_wan_in_64')  | float(0) ) / 1000000000 ) }}"
        device_class: data_size
        unit_of_measurement: 'GB'
  - sensor:
      - name: "Internet Usage Out (64)"
        unique_id: "cb3f34c4-23ad-44d9-a52e-2aa716666025"
        state: "{{ ((states('sensor.snmp_wan_out_64') | float(0) ) / 1000000000 ) }}"
        device_class: data_size
        unit_of_measurement: 'GB'

automation:
  - alias: "Notify If Internet Status Changed"
    id: "ff386c09-1dd5-4381-b404-abad62bffb01"
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.internet_connection
        from: "on"
        to: "off"
        for:
          minutes: 2
      - platform: state
        entity_id: binary_sensor.internet_connection
        from: "off"
        to: "on"
        for:
          minutes: 1
    mode: queued
    condition:
      - condition: state
        entity_id: binary_sensor.pieter_present
        state: "on"
      - condition: time
        after: "05:00:00"
        before: "23:00:00"
      - condition: template
        # when the state has changed to off, we want to notify when the "for" threshold has been reached,
        # but when it changed to on, we only want to notify if we notified that it was off before,
        # otherwise we may notify that it's on after an outage shorter than the minimum we care about.
        # 120 seconds below matches the for: 2 min in the trigger above
        value_template: >-
          {{ trigger.to_state.state == "off" or
             (trigger.to_state.state == "on" and
              (utcnow() - trigger.from_state.last_changed).total_seconds() >= 120) }}
    action:
      - service: notify.mobile_app_ceres
        data:
          title: "⚠️ Internet"
          message: >-
            {% from 'utilities.jinja' import sec_to_hour_and_min %}
            {% set seconds = max((as_timestamp(utcnow()) - as_timestamp(trigger.from_state.last_changed)) | int(0), 60) %}
            {% set duration = sec_to_hour_and_min(seconds) %}
            {% set problem = trigger.to_state.state == 'off' %}
            {{ 'There seems to be' if problem else 'There seems to have been' }} a problem with the Internet connection{{ '.' if problem else ' for ' ~  duration ~ '.' }}
          data:
            group: "home-internet"
            url: homeassistant://navigate/lovelace-main/internet
            tag: "internet-status"

  - alias: "Detect When Extender Disconnected"
    id: "b5d61b3c-516a-4428-9141-969d9fc47b4c"
    initial_state: true
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.front_extender
          - binary_sensor.back_extender
        from: "on"
        to: "off"
    variables:
      # captured once here, at trigger time, so the timer and the input_datetime
      # below are anchored to the same instant instead of two independent now()
      # samples (which drifted apart by a second or two - see the threshold note
      # in "Detect When Extender Reconnected")
      now_dt: "{{ now() }}"
    mode: parallel
    action:
      - service: timer.start
        target:
          entity_id: "{{ trigger.entity_id | replace('binary_sensor', 'timer') }}_disconnected"
        data:
          # test duration
          # if changed here, change it in "Notify When Extender Disconnected" too
          duration: "00:02:00"
      - service: input_datetime.set_datetime
        target:
          entity_id: "{{ trigger.entity_id | replace('binary_sensor', 'input_datetime') }}_disconnected"
        data:
          datetime: "{{ now_dt }}"

  - alias: "Detect When Extender Reconnected"
    id: "a80aad69-169e-4a24-aec0-088512a443ae"
    initial_state: true
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.front_extender
          - binary_sensor.back_extender
        from: "off"
        to: "on"
        # this automation and the one to notify an extender has disconnected can race...
        for:
          seconds: 5
    variables:
      # captured here, before the delay below, so the "for X" message reflects
      # the time the state actually changed rather than when the delay ends
      now_dt: "{{ now() }}"
    mode: parallel
    action:
      # if the timer completed at least once
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set timer_entity_id = trigger.entity_id | replace('binary_sensor', 'timer') ~ '_disconnected' %}
                  {% set duration = state_attr(timer_entity_id, 'duration') %}
                  {% set (hours, minutes, seconds) = duration.split(':') | map('int') %}
                  {# note that we assume here and in the next automation that the timer's duration isn't less than 1 min #}
                  {# the -1 is a small safety margin: int() truncates the elapsed-seconds float
                     towards zero, and there's normal (sub-second) automation dispatch latency
                     between the trigger firing and the timer/input_datetime actions running #}
                  {% set threshold =  minutes*60 + seconds - 1 %}
                  {% set input_datetime_entity_id = trigger.entity_id | replace('binary_sensor', 'input_datetime') ~ '_disconnected' %}
                  {% set last_available = states(input_datetime_entity_id) | as_timestamp %}
                  {{ (as_timestamp(now_dt) - last_available) | int(0) >= threshold }}
            sequence:
              # give the "unavailable" push a head start so it isn't still in flight when
              # "was unavailable for" arrives with the same tag - same-tag pushes fired within
              # the same delivery window aren't guaranteed to both surface
              - delay:
                  seconds: 1
              - service: notify.mobile_app_ceres
                data:
                  title: "⚠️ Internet"
                  message: >-
                    {% from 'utilities.jinja' import sec_to_hour_and_min %}
                    {% set input_datetime_entity_id = trigger.entity_id | replace('binary_sensor', 'input_datetime') ~ '_disconnected' %}
                    {% set last_available = states(input_datetime_entity_id) | as_timestamp %}
                    {% set seconds = (as_timestamp(now_dt) - last_available) | int %}
                    {% set duration = sec_to_hour_and_min(seconds) %}
                    {% set extender_name = state_attr(trigger.entity_id, 'friendly_name') | lower %}
                    The {{ extender_name }} was unavailable for {{ duration }}.
                  data:
                    group: "home-internet"
                    url: homeassistant://navigate/lovelace-main/internet
                    tag: "{{ trigger.entity_id }}"
      - service: timer.cancel
        target:
          entity_id: "{{ trigger.entity_id | replace('binary_sensor', 'timer') }}_disconnected"

  - alias: "Notify When Extender Disconnected"
    id: "8335b7df-93d6-4ea4-8022-9d0d2ed87e46"
    initial_state: true
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.front_extender_disconnected
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.back_extender_disconnected
    mode: parallel
    action:
      # guard: only continue if still off, otherwise we can get stuff in a timer restart loop due to race conditions
      - condition: template
        value_template: >-
          {% set binary_sensor = trigger.event.data.entity_id | replace('timer', 'binary_sensor') | replace('_disconnected', '') %}
          {{ is_state(binary_sensor, 'off') }}
      - service: notify.mobile_app_ceres
        data:
          title: "⚠️ Internet"
          message: >-
            {% set binary_sensor_entity_id = trigger.event.data.entity_id | replace('timer', 'binary_sensor') | replace('_disconnected', '') %}
            {% set extender_name = state_attr(binary_sensor_entity_id, 'friendly_name') | lower %}
            {% set extender_slug = binary_sensor_entity_id | replace('binary_sensor.', '') %}
            {% set minutes = (now() - states.binary_sensor[extender_slug].last_updated).total_seconds() | multiply(1/60) | int(0) or 1 %}
            The {{ extender_name }} became unavailable {{ minutes }} min ago.
          data:
            group: "home-internet"
            url: homeassistant://navigate/lovelace-main/internet
            tag: >-
              {% set binary_sensor_entity_id = trigger.event.data.entity_id | replace('timer', 'binary_sensor') | replace('_disconnected', '') %}
              {{ binary_sensor_entity_id }}
      - service: timer.start
        target:
          entity_id: "{{ trigger.event.data.entity_id }}"
        data:
          # test duration
          # if changed here, change it in "Detect When Extender Disconnected" too
          duration: "00:02:00"
