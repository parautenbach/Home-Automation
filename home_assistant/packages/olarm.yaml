# olarm alarm panel (official olarm integration: https://github.com/olarmtech/hacs-olarm)
#
# the integration provides (via mqtt, real-time):
#  * one alarm_control_panel per area/partition (no code required: code_arm_required is false)
#  * per-zone state sensors and bypass state sensors
#  * per-zone bypass/unbypass buttons and a user panic button
#  * panel attributes: zone_in_alarm, zone_in_alarm_time (changed_by exists but is
#    always null, so attribution comes from the ha context instead – see security.jinja)
#  * an ac power sensor for the panel's mains supply
#
# this package builds on top of it:
#  * template alarm panels wrapping the integration's panels to require a code
#    (the integration's own panels take none) – these own alarm_control_panel.home
#    and .flatlet, so the rest of the config, the dashboards and homekit are unchanged
#  * presence aware: ask to arm/disarm when leaving/arriving
#  * arm reminders and state-change notifications
#  * template switches wrapping the integration's bypass buttons and sensors
#    (bypass is a state, not an event, so a switch is the honest ui for it)
#  * device class and friendly name customisations for the zone sensors
#
# expected entity ids (after renaming the device from "Home Test" to "Home" –
# see MIGRATION.md in the repo root):
#  * alarm_control_panel.home, alarm_control_panel.flatlet (the template panels below)
#  * alarm_control_panel.home_area_01_home, alarm_control_panel.home_area_02_flatlet
#    (the integration's own panels, kept at their generated ids)
#  * binary_sensor.home_zone_<nnn>_<name> (zone state)
#  * binary_sensor.home_zone_<nnn>_bypass_<name> (bypass state)
#  * button.home_zone_<nnn>_bypass_<name>, button.home_zone_<nnn>_unbypass_<name>
#  * button.home_user_panic
# note: zones 19 and 20 (recently added wireless zones) were unnamed in olarm when
# the integration first created their entities, so some of their entity ids lack the
# name suffix (ids are generated once from the name and never regenerated). those ids
# are normalised by hand in the entity registry during the migration (see MIGRATION.md);
# this package references the normalised ids.
#
# partitions/areas (zones belong to the device, not a partition, so the
# partition membership map lives in custom_templates/security.jinja):
#  * area 1 (home): all zones except 018
#  * area 2 (flatlet): zone 018
#  * ignored: 011, 012 only (the remote receiver channels). unused zones are not
#    excluded by number: a newly activated zone should announce itself rather than
#    be silently dropped – see custom_templates/security.jinja
#
# notes:
#  * you cannot bypass a zone after a partition has been armed
#  * force-arm behaviour is inherited knowledge from the old rest api (olarm: it force-arms
#    only if the alarm system is configured to allow it). how a *rejected* arm command
#    surfaces through this integration is unverified – assumed to show as no state change,
#    since state is mirrored from the panel. to verify during the soak (see MIGRATION.md).
#  * real-time state flows through olarm's mqtt connection. the old webhook was kept as
#    an independent safety net during the soak and has been removed: it arrived after
#    the integration on the one real alarm, and sent one critical push per panel area
#    (eight for a single panic)

homeassistant:
  customize:
    # the integration only sets device_class on the door contacts (1, 7, 19, 20);
    # the motion zones get theirs here so the ui and the 'doors' scope in
    # security.jinja can filter on device class instead of name matching.
    # friendly names are cleaned up ("Zone 001 - Front Door" -> "Front Door") for
    # notifications and cards, and each name ends in its type. that matters for the
    # bypassed-zones list in "Alarm State Changed", which mixes doors and motion zones
    # with no filtering: "Garage" alone does not say whether a door or a PIR was
    # bypassed. door zones already carry "Door" in the name.
    binary_sensor.home_zone_001_front_door:
      friendly_name: Front Door
    binary_sensor.home_zone_003_foyer:
      friendly_name: Foyer PIR
      device_class: motion
    binary_sensor.home_zone_004_living_area:
      friendly_name: Living Area PIR
      device_class: motion
    binary_sensor.home_zone_005_braai_room:
      friendly_name: Braai Room PIR
      device_class: motion
    binary_sensor.home_zone_006_kitchen:
      friendly_name: Kitchen PIR
      device_class: motion
    binary_sensor.home_zone_007_kitchen_door:
      friendly_name: Kitchen Door
    binary_sensor.home_zone_008_bedroom:
      friendly_name: Bedroom PIR
      device_class: motion
    binary_sensor.home_zone_009_guest_room:
      friendly_name: Guest Room PIR
      device_class: motion
    binary_sensor.home_zone_010_main_bedroom:
      friendly_name: Main Bedroom PIR
      device_class: motion
    binary_sensor.home_zone_013_backyard:
      friendly_name: Backyard PIR
      device_class: motion
    binary_sensor.home_zone_017_garage:
      friendly_name: Garage PIR
      device_class: motion
    binary_sensor.home_zone_018_flatlet:
      friendly_name: Flatlet PIR
      device_class: motion
    binary_sensor.home_zone_019_music_room_door:
      friendly_name: Music Room Door
    binary_sensor.home_zone_020_braai_room_door:
      friendly_name: Braai Room Door

# the integration's own panels take no code (code_format is null, code_arm_required is
# false), so arming or disarming from the ha ui would be a single tap. these template
# panels wrap them to restore the code prompt the old manual panels had, and they take
# over the alarm_control_panel.home / .flatlet entity ids, so the rest of the config,
# the dashboards and homekit keep working and the integration's panels can keep their
# generated ids.
#
# note: the template alarm panel does not validate the code itself – it passes whatever
# was entered to the actions as `code`, so each action compares it explicitly.
# https://community.home-assistant.io/t/add-a-code-to-the-template-alarm-control-panel/602869
#
# this is an accident guard, not a security boundary: anybody with access to home
# assistant can still call alarm_control_panel.alarm_disarm on the underlying panel.
#
# state is mirrored straight from the integration's panel, so the ui only moves once the
# physical panel has confirmed – a wrong code, or a command the panel rejects, leaves the
# state where it was.
template:
  - alarm_control_panel:
      - name: "Home"
        unique_id: "f82351c6-5e50-4902-9b9e-48d2ebd5ec87"
        state: "{{ states('alarm_control_panel.home_area_01_home') }}"
        code_format: number
        code_arm_required: true
        arm_home:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected arm (stay) for the home alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_arm_home
            target:
              entity_id: alarm_control_panel.home_area_01_home
        arm_away:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected arm (away) for the home alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_arm_away
            target:
              entity_id: alarm_control_panel.home_area_01_home
        # homekit always offers night mode - the bridge cannot limit which states the
        # home app shows - so map it rather than let the call fail. the panel reports
        # back armed_home, which is what the home app then displays.
        arm_night:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected arm (night) for the home alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_arm_home
            target:
              entity_id: alarm_control_panel.home_area_01_home
        disarm:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected disarm for the home alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_disarm
            target:
              entity_id: alarm_control_panel.home_area_01_home
      - name: "Flatlet"
        unique_id: "0f8ab03e-4fec-45c2-b4c9-62b323787692"
        state: "{{ states('alarm_control_panel.home_area_02_flatlet') }}"
        code_format: number
        code_arm_required: true
        # no arm_home: stay mode doesn't make sense for the flatlet, and leaving it out
        # means the panel doesn't advertise the feature at all (the old manual panel had
        # to list armed_home anyway to keep homekit happy)
        arm_away:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected arm for the flatlet alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_arm_away
            target:
              entity_id: alarm_control_panel.home_area_02_flatlet
        # homekit always offers night mode - the bridge cannot limit which states the
        # home app shows - so map it rather than let the call fail. the panel reports
        # back armed_away, which is what the home app then displays.
        arm_night:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected arm (night) for the flatlet alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_arm_away
            target:
              entity_id: alarm_control_panel.home_area_02_flatlet
        disarm:
          - variables:
              valid_code: !secret alarm_code
          - if: "{{ code != valid_code }}"
            then:
              - service: system_log.write
                data:
                  message: "Rejected disarm for the flatlet alarm: invalid code."
                  level: warning
                  logger: "homeassistant.components.olarm"
              - stop: "Invalid code."
          - service: alarm_control_panel.alarm_disarm
            target:
              entity_id: alarm_control_panel.home_area_02_flatlet

  # bypass is a state you set and clear, not an event, so each zone's pair of
  # bypass/unbypass buttons is wrapped in a template switch. the state comes from
  # the integration's bypass sensor, so the switch also reflects bypasses made
  # from the keypad or the olarm app. if the panel refuses a bypass (e.g. while
  # armed), the switch simply snaps back.
  # only the zones in use get a switch; the unused ones and the remote receiver
  # channels (11, 12) are left out. a zone put into use later needs one adding here.
  # default_entity_id is needed here: this schema derives the entity id from the
  # name, so "Front Door Bypass" would otherwise become switch.front_door_bypass.
  - switch:
      - name: "Front Door Bypass"
        default_entity_id: switch.alarm_bypass_front_door
        icon: mdi:door
        state: "{{ is_state('binary_sensor.home_zone_001_bypass_front_door', 'on') }}"
        turn_on:
          service: button.press
          target:
            entity_id: button.home_zone_001_bypass_front_door
        turn_off:
          service: button.press
          target:
            entity_id: button.home_zone_001_unbypass_front_door
      - name: "Foyer Bypass"
        default_entity_id: switch.alarm_bypass_foyer
        icon: mdi:coat-rack
        state: "{{ is_state('binary_sensor.home_zone_003_bypass_foyer', 'on') }}"
        turn_on:
          service: button.press
          target:
            entity_id: button.home_zone_003_bypass_foyer
        turn_off:
          service: button.press
          target:
            entity_id: button.home_zone_003_unbypass_foyer
      - name: "Living Area Bypass"
        default_entity_id: switch.alarm_bypass_living_area
        icon: mdi:sofa-outline
        state: "{{ is_state('binary_sensor.home_zone_004_bypass_living_area', 'on') }}"
        turn_on:
