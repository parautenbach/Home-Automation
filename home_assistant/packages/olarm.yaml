        icon: mdi:countertop-outline
        state: "{{ is_state('binary_sensor.home_zone_006_bypass_kitchen', 'on') }}"
        turn_on:
          service: button.press
          target:
            entity_id: button.home_zone_006_bypass_kitchen
        turn_off:
          service: button.press
