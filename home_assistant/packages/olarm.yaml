input_datetime:
  workday_alarm_arm_reminder:
    has_time: true
    icon: mdi:calendar-week
  non_workday_alarm_arm_reminder:
    has_time: true
    icon: mdi:calendar-weekend

automation:
  - alias: "Notify When Alarm Triggered"
    id: "45f0ac46-8bbb-42cb-a051-64ea1ca695e2"
    initial_state: true
    trace:
      stored_traces: 20
    trigger:
      - platform: state
        entity_id:
          - alarm_control_panel.home
          - alarm_control_panel.flatlet
        to: "triggered"
    # a panic can trigger both partitions near-simultaneously; the default single
    # mode would silently drop the second notification
    mode: queued
    action:
      - variables:
          area: "{{ trigger.entity_id | replace('alarm_control_panel.', '') }}"
          # zone_in_alarm is an attribute of the integration's own panel; our template
          # panel only mirrors state, so read it from the panel behind this partition
          source_panel: >-
            {{ 'alarm_control_panel.home_area_01_home' if area == 'home'
               else 'alarm_control_panel.home_area_02_flatlet' }}
          zone_in_alarm: "{{ state_attr(source_panel, 'zone_in_alarm') }}"
          message: >-
            The {{ area }} alarm has been triggered at {{ now().strftime('%H:%M') }}!
            {%- if zone_in_alarm not in [none, 'None', ''] %} Zone: {{ zone_in_alarm }}.{% endif %}
      - service: notify.mobile_app_ceres
        data:
          title: "🚨 Security"
          # todo: specialise alert according to a panic, fire, medical alarm
          #       if we have this, we can e.g. contact the fire department or call for an ambulance automatically
          #       or maybe the security company will already triage this when receiving the panic signal
          #       can also trigger the fire alarm here if one of the smoke sensors went off and isn't muted after a set time
          message: "{{ message }}"
          data:
            group: "home-security"
            url: homeassistant://navigate/lovelace-main/security
            push:
              sound:
                name: default
                critical: 1
                volume: 0.3
            actions:
              - action: "GET_HELP"
                title: "Get help!"
                uri: "tel:+27218874777"
                destructive: true
              - action: "DISARM_ALARM"
                title: "Disarm"
                destructive: true
            action_data:
              # each panel now mirrors its own partition, so only the triggered
              # partition needs disarming (one disarm silences the physical panel)
              entity_ids: "{{ [trigger.entity_id] }}"
      # a panic trips both partitions, so this runs twice: only the flatlet's alarm is
      # the tenant's business, same rule as in "Alarm State Changed"
      - condition: template
        value_template: "{{ area == 'flatlet' }}"
      - service: script.turn_on
        target:
          entity_id: script.notify_tenant
        data:
          variables:
            message: "{{ message }}"

  - alias: "Ask To Arm Alarm When Last Person Left"
    id: "e8a63da5-4d84-40ab-9c05-dca93ba4900d"
    initial_state: true
    trace:
      stored_traces: 20
    trigger:
      - platform: state
        entity_id: binary_sensor.pieter_present
        to: "off"
    mode: single
    action:
      - wait_template: "{{ is_state('binary_sensor.anybody_home', 'off') }}"
        timeout: "00:02:00"
        continue_on_timeout: false
      - condition: state
        entity_id: alarm_control_panel.home
        state: "disarmed"
      # ios can neither replace nor group critical notifications, so an unactioned prompt
      # on this tag would stack underneath this one instead of being replaced by it
      # https://companion.home-assistant.io/docs/notifications/notifications-basic
      - service: notify.mobile_app_ceres
        data:
          message: "clear_notification"
          data:
            tag: "arm-alarm-reminder"
      - delay:
          seconds: 1
      # re-check, in case the alarm got armed during the gap above
      - condition: state
        entity_id: alarm_control_panel.home
        state: "disarmed"
      - service: notify.mobile_app_ceres
        data:
          title: "🔒 Security"
          message: >-
            The last person left home. Would you like to arm the alarm?
          data:
            group: "home-security"
            tag: "arm-alarm-reminder"
            url: homeassistant://navigate/lovelace-main/security
            actions:
              - action: "ARM_ALARM"
                title: "Arm (full)"
                destructive: true
              - action: "ARM_ALARM_BYPASS_GARAGE"
                title: "Arm (bypass garage)"
                destructive: true
              - action: "ENABLE_GUEST_MODE"
                title: "Enable guest mode"
            action_data:
              entity_ids: "{{ ['alarm_control_panel.home'] }}"
            push:
              sound:
                name: default
                critical: 1
                volume: 0.3

  - alias: "Ask To Disarm Alarm When Arriving"
    id: "85753536-12f8-4a94-b292-7672ac96a4c2"
    initial_state: true
    trace:
      stored_traces: 20
    trigger:
      - platform: state
        entity_id: binary_sensor.pieter_present
        to: "on"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: alarm_control_panel.home
            state: "disarmed"
      # rather use the wait template below
      # # another check that the alarm is probably disarmed:
      # # state updates can be a tad too slow when we disarm with the remote
      # - condition: and
      #   conditions:
      #     - condition: state
      #       entity_id: cover.garage_doors
      #       state: "closed"
      #     - condition: state
      #       entity_id: switch.alarm_bypass_garage_pir
      #       state: "off"
    action:
      # clear any unactioned arm prompt first: it shares this tag, and ios can neither
      # replace nor group critical notifications. the 30 sec delay below doubles as the
      # gap the clear needs, and the if after it re-checks state
      - service: notify.mobile_app_ceres
        data:
          message: "clear_notification"
          data:
            tag: "arm-alarm-reminder"
      # delivery of the notification can be slow
      # so, even if this triggers immediately, it may only be delivered after the garage door has been opened
      # the traces and history shows the order of events are correct
      # this delay should prevent the false positive
      - delay:
          seconds: 30
      - if: "{{ not is_state('alarm_control_panel.home', 'disarmed') }}"
        then:
          - service: notify.mobile_app_ceres
            data:
              title: "🔒 Security"
              message: >-
                You arrived home. Would you like to disarm the alarm?
              data:
                group: "home-security"
                tag: "arm-alarm-reminder"
                url: homeassistant://navigate/lovelace-main/security
                actions:
                  - action: "DISARM_ALARM"
                    title: "Disarm"
                    destructive: true
                action_data:
                  entity_ids: "{{ ['alarm_control_panel.home'] }}"
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 0.3

  - alias: "Turn On Yard Lights If Alarm Triggered"
    id: "50147e47-23b5-4ed4-973c-0c1e5243c731"
    initial_state: true
    trace:
      stored_traces: 20
    trigger:
      - platform: state
        entity_id: alarm_control_panel.home
        to: "triggered"
    condition:
      - condition: state
        entity_id: binary_sensor.nighttime
        state: "on"
    action:
      - service: light.turn_on
        target:
          entity_id:
            - light.yard_group

  - alias: "Remind To Arm Stay Alarm"
    id: "60793526-4de9-44d9-9ed9-db95a15a071f"
    trace:
      stored_traces: 20
    initial_state: true
    trigger:
      - platform: time
        at: input_datetime.workday_alarm_arm_reminder
        id: "workday"
      - platform: time
        at: input_datetime.non_workday_alarm_arm_reminder
        id: "non_workday"
      - platform: state
        entity_id: sensor.ceres_battery_state
        from: 'Not Charging'  # Can be to Charging or Full
        id: "phone_plugged_in"
      - platform: state
        entity_id: light.living_room_lamp
        to: "off"
        id: "lamp_off"
      - platform: state
        entity_id:
          - binary_sensor.pieter_present
        to: "on"
        for:
          minutes: 5
        id: "arrived_home"
    condition:
      - condition: template
        value_template: >-
          {# this code only works if the workday and non-workday times differ; the trigger is ambiguous if they are the same #}
          {% set workday_reminder = states('input_datetime.workday_alarm_arm_reminder') | today_at %}
          {% set non_workday_reminder = states('input_datetime.non_workday_alarm_arm_reminder') | today_at %}
          {% set is_workday_tomorrow = is_state('binary_sensor.workday_tomorrow', 'on') %}
          {{ (trigger.id == 'workday' and is_workday_tomorrow and workday_reminder <= now() < non_workday_reminder) or
             (trigger.id == 'non_workday' and not is_workday_tomorrow and non_workday_reminder <= now()) or
             (trigger.id in ['phone_plugged_in', 'arrived_home', 'lamp_off'] and is_workday_tomorrow and workday_reminder <= now()) or
             (trigger.id in ['phone_plugged_in', 'arrived_home', 'lamp_off'] and not is_workday_tomorrow and non_workday_reminder <= now()) }}
      - condition: time
        after: "20:00:00"
      - condition: state
        entity_id: alarm_control_panel.home
        state: "disarmed"
      - condition: state
        entity_id: binary_sensor.pieter_present
        state: "on"
      # for now, just always ask at the earliest time (because, baby)
      # - condition: template
      #   value_template: >-
      #     {{ (trigger.id == 'weekdays' and is_state('binary_sensor.workday_tomorrow', 'on')) or trigger.id == 'weekends' }}
    action:
      # this can re-ask several times in an evening (phone plugged in, lamp off, arriving
      # home), and ios can neither replace nor group critical notifications, so clear the
      # previous ask rather than stacking another one on the same tag
      - service: notify.mobile_app_ceres
        data:
          message: "clear_notification"
          data:
            tag: "arm-alarm-reminder"
      - delay:
          seconds: 1
      # re-check, in case the alarm got armed during the gap above
      - condition: state
        entity_id: alarm_control_panel.home
        state: "disarmed"
      - service: notify.mobile_app_ceres
        data:
          title: "🔒 Security"
          message: >-
            {%- from 'security.jinja' import get_active_zones -%}
            {%- set get_active_zones_fn = get_active_zones | as_function -%}
            {%- set active_zones = get_active_zones_fn('home', 'doors') -%}
            You haven't yet armed the stay alarm. Would you like to arm it?

            {% if active_zones -%}
            The following zones are still active:
              {%- for zone in active_zones %}
              - {{ zone }}
              {%- endfor %}
            {% endif -%}

            Remember to lock all doors and gates first.
          data:
            group: "home-security"
            tag: "arm-alarm-reminder"
            url: homeassistant://navigate/lovelace-main/security
            actions:
              - action: "ARM_STAY_ALARM"
                title: "Arm (stay)"
                destructive: true
            action_data:
              entity_ids: "{{ ['alarm_control_panel.home'] }}"
            push:
              sound:
                name: default
                critical: 1
                volume: 0.3

  - alias: "Handle Alarm Notification Event"
    id: "c7a55b28-a909-4cf0-8f91-23f1d8a0e45a"
    trace:
      stored_traces: 20
    initial_state: true
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: ARM_ALARM
        id: "arm_away"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: ARM_STAY_ALARM
        id: "arm_home"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: DISARM_ALARM
        id: "disarm"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: ARM_ALARM_BYPASS_GARAGE
        id: "arm_away_bypass_garage"
    condition:
      - condition: template
        value_template: >-
          {% set new_state = trigger.id | replace('arm', 'armed') %}
          {% set ns = namespace(is_mismatch=false) %}
          {% for entity_id in trigger.event.data.action_data.entity_ids %}
            {% if not is_state(entity_id, new_state) %}
              {% set ns.is_mismatch = true %}
            {% endif %}
          {% endfor %}
          {{ ns.is_mismatch }}
    action:
      - if: "{{ trigger.id == 'arm_away_bypass_garage' }}"
        then:
          - service: switch.turn_on
            target:
              entity_id: switch.alarm_bypass_garage_pir
          # wait on the integration's own bypass sensor: it only turns on once the
          # panel confirmed the bypass, so this cannot be fooled by optimistic state
          # (the template switch mirrors this same sensor, but waiting on the source
          # keeps that explicit and refactor-proof)
          - wait_template: "{{ is_state('binary_sensor.home_zone_017_bypass_garage', 'on') }}"
            timeout: "00:00:15"
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - service: notify.mobile_app_ceres
                data:
                  title: "⛔️ Security"
                  message: >-
                    The garage zone couldn't be bypassed, so the alarm wasn't armed.
                  data:
                    group: "home-security"
                    url: homeassistant://navigate/lovelace-main/security
              - stop: "Garage bypass was not confirmed."
      # the template panels require a code, so pass it (the underlying olarm panels
      # don't, but nothing calls those directly)
      - service: "alarm_control_panel.alarm_{{ trigger.id | replace('_bypass_garage', '') }}"
        target:
          entity_id: "{{ trigger.event.data.action_data.entity_ids }}"
        data:
          code: !secret alarm_code
      - if: "{{ trigger.id[0:3] == 'arm'}}"
        then:
          - service: light.turn_off
            target:
              entity_id:
                - light.yard_group

  - alias: "Alarm State Changed"
    id: "c217ca42-8a3f-40c6-9945-2c77bdf16239"
    initial_state: true
    trace:
      stored_traces: 20
    trigger:
      - platform: state
        entity_id:
          - alarm_control_panel.home
          - alarm_control_panel.flatlet
        to:
          - "disarmed"
          - "armed_home"
          - "armed_away"
    # both partitions can change state near-simultaneously (e.g. after a panic);
    # queued prevents the default single mode from dropping the second run
    mode: queued
    condition:
      # defensive: integration entities typically start as unknown after a restart
      # and can go unavailable on an mqtt reconnect; restoring to the actual state
      # is not a change worth notifying about. from_state is none for a newly
      # created entity, so guard that too.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and
             trigger.from_state.state not in ['unknown', 'unavailable'] }}
    action:
      # a state change from the integration is ground truth (it arrives after the
      # panel confirmed it via mqtt), regardless of whether it originated from ha,
      # the olarm app, the keypad or a remote – so this is pure notification logic.
      # a rejected arm (e.g. force-arm disallowed) shows as no state change at all.
      - variables:
          state_map:
            disarmed: "disarmed"
            armed_home: "armed (stay)"
            armed_away: "armed"
          state: "{{ state_map[trigger.to_state.state] }}"
          area: >-
            {{ trigger.entity_id | replace('alarm_control_panel.', '') }}
          # the panel's changed_by attribute is always null, so attribution comes from
          # the ha context: a name when a person did it in ha, empty otherwise (which
          # includes the app, the keypad and the remotes – so say nothing, don't guess)
          actor: >-
            {%- from 'security.jinja' import get_ha_actor -%}
            {{ get_ha_actor(trigger.to_state.context) | trim }}
          bypassed_zones: >-
            {%- from 'security.jinja' import get_bypassed_zones -%}
            {%- set get_bypassed_zones_fn = get_bypassed_zones | as_function -%}
            {{ get_bypassed_zones_fn(area) }}
          message: >-
            The {{ area }}'s alarm was {{ state }}
            {%- if actor %} by {{ actor }}{% endif %} at {{ now().strftime('%H:%M') }}.
            {%- if trigger.to_state.state != 'disarmed' and bypassed_zones %} Bypassed: {{ bypassed_zones | join(', ') }}.{% endif %}
      - if: "{{ trigger.to_state.state == 'disarmed' }}"
        then:
          - if: "{{ area == 'flatlet' }}"
            then:
              - service: notify.mobile_app_ceres
                data:
                  title: "🔒 Security"
                  message: "{{ message }}"
                  data:
                    group: "home-security"
                    url: homeassistant://navigate/lovelace-main/security
                    actions:
                      - action: "ARM_ALARM"
                        title: "Arm"
                        destructive: true
                    action_data:
                      entity_ids: "{{ [trigger.entity_id] }}"
            else:
              - service: notify.mobile_app_ceres
                data:
                  title: "🔒 Security"
                  message: "{{ message }}"
                  data:
                    group: "home-security"
                    url: homeassistant://navigate/lovelace-main/security
                    actions:
                      - action: "ARM_ALARM"
                        title: "Arm (full)"
                        destructive: true
                      - action: "ARM_ALARM_BYPASS_GARAGE"
                        title: "Arm (bypass garage)"
                        destructive: true
                      - action: "ARM_STAY_ALARM"
                        title: "Arm (stay)"
                        destructive: true
                    # https://companion.home-assistant.io/docs/notifications/actionable-notifications/
                    # https://community.home-assistant.io/t/custom-data-in-actionable-notification-on-ios/429748/2
                    # https://blog.kalavala.net/homeassistant/event/2018/01/11/custom-events.html
                    action_data:
                      entity_ids: "{{ [trigger.entity_id] }}"
        else:
          - service: notify.mobile_app_ceres
            data:
              message: "clear_notification"
              data:
                tag: "arm-alarm-reminder"
          - service: notify.mobile_app_ceres
            data:
              title: "🔒 Security"
              message: "{{ message }}"
              data:
                group: "home-security"
                url: homeassistant://navigate/lovelace-main/security
                actions:
                  - action: "DISARM_ALARM"
                    title: "Disarm"
                    destructive: true
                action_data:
                  entity_ids: "{{ [trigger.entity_id] }}"
      - condition: template
        value_template: "{{ area == 'flatlet' }}"
      - service: script.turn_on
        target:
          entity_id: script.notify_tenant
        data:
          variables:
            message: "{{ message }}"
