homeassistant:
  customize:
    sensor.outside_temperature:
      state_class: measurement
    sensor.outside_temperature_filtered:
      state_class: measurement
    sensor.outside_temperature_change:
      device_class: temperature
    # sensor.uva_irradiance:
    #   icon: mdi:weather-sunny-alert
    # sensor.uvb_irradiance:
    #   icon: mdi:weather-sunny-alert

# https://community.home-assistant.io/t/outdoor-illuminance-template-sensor/228581
# https://community.home-assistant.io/t/automations-to-turn-on-lights-based-on-actual-season/252830/19
# https://www.engineeringtoolbox.com/light-level-rooms-d_708.html
illuminance:
    name: Weather-Based Sun Illuminance
    unique_id: "ad67d49a-4db4-49c0-81b1-1e068df41b31"
    entity_id: weather.openweathermap
    mode: normal
    fallback: 10
    scan_interval:
      minutes: 5

# why not just use binary_sensor.weather_forecast_precipitation_soon's last_changed?
# because that sensor is a sliding-window sum recalculated every 5 minutes, so it can
# flap on/off several times while the same rain event is still "coming" - last_changed
# is not a reliable signal of "have we already told him about this"
input_datetime:
  rain_expected_notification_sent:
    has_date: true
    has_time: true

utility_meter:
  daily_precipitation:
    unique_id: "2355938a-fdc3-4b79-bd5b-f2a68f7f55a4"
    source: sensor.precipitation_total
    cycle: daily
  monthly_precipitation:
    unique_id: "1e1bc0f0-4a3a-4ee3-bd57-4a86d367cdc8"
    source: sensor.precipitation_total
    cycle: monthly
  annual_precipitation:
    unique_id: "b0894141-7ee1-42d7-80c4-5bb3b1708368"
    source: sensor.precipitation_total
    cycle: yearly

binary_sensor:
  - platform: trend
    sensors:
      outside_temperature_trend:
        entity_id: sensor.outside_temperature_filtered
        friendly_name: "Outside Temperature Trend"
        # 1 hours * 60 minutes * 60 seconds
        sample_duration: 3600
        # 1 degree in the last 3 hours
        min_gradient: 0.000278

sensor:
  - platform: history_stats
    name: Fair Weather Time
    entity_id: binary_sensor.is_fair_weather
    state: "on"
    type: time  # duration
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: filter
    name: outside_temperature_filtered
    entity_id: sensor.outside_temperature
    filters:
      filter: lowpass
      time_constant: 4
      precision: 1

  - platform: statistics
    entity_id: sensor.outside_temperature_filtered
    name: "Outside Temperature Change"
    # the difference between the newest and the oldest measurement
    state_characteristic: change
    max_age:
      minutes: 60

  # Both of these were lowpass filters. An EMA is the wrong statistic for either: a wind
  # speed is a 10-minute mean and a gust is the peak within the period, so the EMA was
  # unbiased but jumpy for the mean, and plainly wrong for the max - measured on the
  # 2026-09-04 data it lost 36% of the gust peak (26.3 km/h raw -> 16.8 km/h reported).
  #
  # Both read the RAW station entities. The WS90 already reduces its own ~8.8s sample
  # window twice - 'sustained' is the mean of that window, 'gust' the max - so filtering
  # first and aggregating second just attenuates the signal twice. The two channels are
  # not interchangeable: a rolling max of the sustained channel cannot reproduce the gust
  # channel (correlation peaks at 0.86), because the gust carries sub-8.8s detail that
  # the sustained channel has already averaged away.
  #
  # sampling_size must exceed the number of samples in the window or max_age is never
  # reached: 10 minutes at 8.8s is ~68 samples, so 200 leaves headroom if the WS90 ever
  # reports faster.
  #
  # keep_last_sample is what stops dead calm from reading as a fault. The station only emits a
  # state change when the value changes, so a steady 0.0 adds no samples; on 2026-09-08 six calm
  # spells emptied the 10-minute window and the sensor went unknown, taking apparent temperature,
  # Beaufort, compass direction and fog probability unavailable with it - for up to 47 minutes,
  # and precisely in the conditions fog needs. Holding the last sample reports the calm instead.
  - platform: statistics
    name: "Wind Speed Filtered"
    entity_id: sensor.weather_station_wind_speed_sustained
    state_characteristic: mean
    sampling_size: 200
    max_age:
      minutes: 10
    keep_last_sample: true
    precision: 2

  # a single bad sample owns this for a full 10 minutes - on 2026-09-05 one reading held
  # it at 37.8 km/h when the rest of the window supported ~23. That is inherent to a max
  # and still better than smoothing every peak away; revisit only with labelled data
  - platform: statistics
    name: "Wind Gust Filtered"
    entity_id: sensor.weather_station_wind_speed_gust
    state_characteristic: value_max
    sampling_size: 200
    max_age:
      minutes: 10
    keep_last_sample: true
    precision: 2

  # The raw WS90 index swings 2-8 within a minute. Measured on 2026-09-15 (08:00-12:38 SAST), the UV
  # condition changed band 98 times on it. The 75th percentile over 15 minutes changed band 7 times
  # and still reached high; a mean never got past moderate, and a max kept the single spikes.
  - platform: statistics
    name: "UV Index Filtered"
    unique_id: "71846179-aa0c-4ba7-9c39-9361bc591e04"
    entity_id: sensor.weather_station_uv_index
    state_characteristic: percentile
    percentile: 75
    sampling_size: 200
    max_age:
      minutes: 15
    keep_last_sample: true
    precision: 1

  - platform: filter
    name: "Wind Direction Sin Filtered"
    entity_id: sensor.wind_direction_sin
    filters:
      - filter: lowpass
        time_constant: 15
        precision: 4

  - platform: filter
    name: "Wind Direction Cos Filtered"
    entity_id: sensor.wind_direction_cos
    filters:
      - filter: lowpass
        time_constant: 15
        precision: 4

  - platform: statistics
    name: "Air Pressure Change 3h"
    unique_id: "fe1282c1-da71-4db8-a538-a9c9a7965fb3"
    entity_id: sensor.air_pressure_qnh
    state_characteristic: change
    max_age:
      hours: 3

template:
  - weather:
      - name: "Forecast Tomorrow"
        condition_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['condition'] }}"
        temperature_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['temperature'] }}"
        temperature_unit: °C
        humidity_template: "{{ 0.0 | float(0) }}"
        pressure_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['pressure'] }}"
        pressure_unit: hPa
        wind_speed_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['wind_speed'] }}"
        wind_speed_unit: km/h
        wind_bearing_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['wind_bearing'] }}"
        precipitation_unit: mm
        attribution_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'attribution') }}"
  - binary_sensor:
      # https://www.home-assistant.io/integrations/weather/#condition-mapping
      # see day-time and night-time sensors regarding the value of -0.833
      - name: Is Fair Weather
        # only for daytime
        state: >-
          {# technically it should be -0.833 (not -1), but due to sensor update timings we're stretching it a little bit #}
          {{ (is_state('weather.openweathermap', 'sunny') or
              is_state('weather.openweathermap', 'partlycloudy')) and
             states('sensor.solar_angle') | float(0) >= -1 }}
  - sensor:
      - name: "Outside Temperature Feels Like"
        unique_id: "95a1d418-6c6c-4df2-bda2-30d575612488"
        default_entity_id: sensor.outside_feels_like
        variables:
          # todo
          temperature_entity: sensor.openweathermap_feels_like_temperature
        availability: "{{ temperature_entity | has_value }}"
        state: >-
          {{ states(temperature_entity) | round(1)  }}
        device_class: temperature
        unit_of_measurement: "°C"
        icon: mdi:thermometer
  - sensor:
      - name: "Fair Weather Time Share"
        unique_id: "7564e4b6-c7c6-4536-bd02-efa115f6e6c1"
        state: >-
          {{ min((states('sensor.fair_weather_time') | float(0) / states('sensor.home_sun_daylight') | float(0) * 100) | round(0), 100) if has_value('sensor.home_sun_daylight') else 0 }}
        unit_of_measurement: "%"
  # https://www.home-assistant.io/integrations/template/#trigger-based-handling-of-service-response-data
  # https://community.home-assistant.io/t/petition-dont-delete-the-forecast-attribute/609298/38
  # https://community.home-assistant.io/t/petition-dont-delete-the-forecast-attribute/609298/240
  - trigger:
      - platform: time_pattern
        # every 5 minutes past the hour
        hours: "*"
        minutes: "5"
      - platform: state
        entity_id: weather.openweathermap
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: hourly
    sensor:
      - name: Weather Tomorrow Hourly
        unique_id: "3e214cd0-be86-4ec9-b9ae-d9f7133a35a2"
        # make temperature? (and then device_class and uom)
        state: "{{ now().isoformat() }}"
        # device_class: duration
        # unit_of_measurement: s
        attributes:
          forecast: "{{ hourly['weather.openweathermap']['forecast'][24:] }}"
          attribution: "{{ state_attr('sensor.weather_tomorrow_hourly', 'attribution') }}"
  - trigger:
      - platform: time_pattern
        # every 5 minutes past the hour
        hours: "*"
        minutes: "5"
      - platform: state
        entity_id: weather.openweathermap
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: daily
        response_variable: daily
    sensor:
      - name: Weather Forecast Precipitation Today
        unique_id: "413a950a-150d-4faf-9f93-3d35b240dd5d"
        state: >-
          {{ daily['weather.openweathermap']['forecast'][0]['precipitation'] }}
        device_class: precipitation
        unit_of_measurement: "mm"
        icon: >-
          {% if daily['weather.openweathermap']['forecast'][0]['precipitation'] > 0 %}
            mdi:water
          {% else %}
            mdi:water-off
          {% endif %}
      - name: Weather Forecast Precipitation Tomorrow
        unique_id: "2f58f787-0427-462d-a5c1-c2e1b568f0c7"
        state: >-
          {{ daily['weather.openweathermap']['forecast'][1]['precipitation'] }}
        device_class: precipitation
        unit_of_measurement: "mm"
        icon: >-
          {% if daily['weather.openweathermap']['forecast'][1]['precipitation'] > 0 %}
            mdi:water
          {% else %}
            mdi:water-off
          {% endif %}
      - name: Minimum Temperature Tomorrow
        unique_id: "9ee15a95-74b7-4263-a578-7347e830b68b"
        state: >-
          {{ daily['weather.openweathermap']['forecast'][1]['templow'] }}
        device_class: temperature
        unit_of_measurement: °C
        icon: mdi:thermometer
  - trigger:
      - platform: time_pattern
        # every 5 minutes past the hour
        hours: "*"
        minutes: "5"
      - platform: state
        entity_id: weather.openweathermap
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: hourly
    binary_sensor:
      - name: "Weather Forecast Precipitation Soon"
        unique_id: "949dd25e-35cf-4000-a3f9-f38ab20e112f"
        device_class: moisture
        state: >-
          {% from 'environment.jinja' import rain_outlook %}
          {% set rain_outlook_fn = rain_outlook | as_function %}
          {% set outlook = rain_outlook_fn(hourly['weather.openweathermap']['forecast']) %}
          {# minimum rainy hours in the window to count as significant - a
             single rainy hour is a blip, not a reason to move the chores #}
          {{ outlook.hours >= 3 }}
        attributes:
          onset: >-
            {% from 'environment.jinja' import rain_outlook %}
            {% set rain_outlook_fn = rain_outlook | as_function %}
            {% set outlook = rain_outlook_fn(hourly['weather.openweathermap']['forecast']) %}
            {{ outlook.onset }}
  - binary_sensor:
      - name: "Low Light"
        # alternatives:
        # value_template: "{{ states('sensor.sun_illuminance') != 'unknown' and (states('sensor.sun_illuminance') | int < 15320) }}"
        # value_template: >
        #   {{ states('sensor.sun_illuminance') | int(0) < 7500 or
        #      states('sensor.solar_angle') | int(0) < 5 or
        #      'fog' in states('weather.openweathermap') or
        #      'cloudy' in states('weather.openweathermap') or
        #      'rain' in states('weather.openweathermap') or
        #      'pouring' in states('weather.openweathermap') }}
        # don't use office illuminance, because we might turn on the desk lamp, which will then trigger a low light condition
        # value_template: "{{ states('sensor.office_illuminance') | int(0) <= 25 }}"
        state: >
          {{ states('sensor.weather_station_illuminance') | int(0) < 35000 or is_state('binary_sensor.is_fair_weather', 'off') }}
      # https://github.com/pnbruckner/ha-sun2/blob/master/custom_components/sun2/const.py
      # keep value in sync with the fair weather binary sensor
  - sensor:
      - name: "Outside Thermal Perception"
        unique_id: "a47c934a-e27b-45bd-aa95-c0f0a10b054e"
        icon: >-
          {{ 'mdi:snowflake-thermometer' if this.state in ['cold', 'very_cold', 'freezing']
             else 'mdi:thermometer' }}
        variables:
          perception_entity: sensor.thermal_comfort_outside_summer_simmer_perception
          apparent_entity: sensor.outside_apparent_temperature
        # thermal_tier splits the index's single 'cool' tier, which otherwise makes a 5°C winter
        # morning read identically to a mild 20°C evening; its thresholds live with the macro.
        #
        # it is fed apparent temperature rather than the dry-bulb reading because at the cold end the
        # body loses heat convectively, so wind is what matters - a 12°C day in a 25 km/h southeaster
        # feels like 6°C. Humidity is in that formula too but barely moves it down here (about +2°C
        # across the whole RH range, and in the warming direction); the damp side of cold is carried
        # by sensor.humidity_perception instead, which keeps the two axes separate.
        state: >-
          {% from 'environment.jinja' import thermal_tier %}
          {{ thermal_tier(states(apparent_entity) | float(none), states(perception_entity)) }}
        attributes:
          label: >-
            {{ this.state | replace('_', ' ') | title }}
          # the underlying index reading, what the tiers were judged on, and whether they overrode it
          perception: >-
            {{ states(perception_entity) }}
          apparent_temperature: >-
            {{ states(apparent_entity) | float(0) | round(1) }}
          overridden: >-
            {{ this.state != states(perception_entity) }}
        availability: >-
          {{ has_value(perception_entity) }}
      - name: "Outside Temperature"
        unique_id: "17306e70-7ffe-49a1-a448-9c99df8f7690"
        variables:
          temperature_entity: sensor.weather_station_temperature
          thermal_perception_entity: sensor.outside_thermal_perception
        state: >-
          {{ states(temperature_entity) }}
          {# state_attr('weather.openweathermap', 'temperature') | float(None) #}
          {# states('sensor.saaqis_ambient_temperature') | float(None) #}
        device_class: temperature
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        attributes:
          thermal_comfort_label: "{{ states(thermal_perception_entity) | replace('_', ' ') | title }}"
        availability: "{{ has_value(temperature_entity) }}"
  - sensor:
      - name: "Outside Apparent Temperature"
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {% set t = states('sensor.weather_station_temperature') | float(0) %}
          {% set rh = states('sensor.weather_station_humidity') | float(0) %}
          {% set ws = states('sensor.wind_speed_filtered') | float(0) %}
          {% set vp = rh / 100 * 6.105 * e ** (17.27 * t / (237.7 + t)) %}
          {{ (t + 0.33 * vp - 0.70 * ws - 4.00) | round(1) }}
        # every input defaults to 0, so a missing one yields a plausible-looking -4.0°C rather than an
        # error. That now drives the cold tiers on sensor.outside_thermal_perception, where it would
        # read as "Freezing", so the inputs are required rather than defaulted away
        availability: >-
          {{ has_value('sensor.weather_station_temperature')
             and has_value('sensor.weather_station_humidity')
             and has_value('sensor.wind_speed_filtered') }}
  - trigger:
      - platform: state
        entity_id: sensor.daily_precipitation
        attribute: last_period
    sensor:
      # despite the name (kept for entity-id/dashboard compatibility), this is not a forecast -
      # it's the station's own rain gauge total for the previous day
      - name: Weather Forecast Precipitation Yesterday
        unique_id: "701c1f90-bc1c-47d4-b490-1267ec7155e4"
        state: >-
          {{ state_attr('sensor.daily_precipitation', 'last_period') | float(0) }}
        device_class: precipitation
        unit_of_measurement: "mm"
        icon: >-
          {% if state_attr('sensor.daily_precipitation', 'last_period') | float(0) > 0 %}
            mdi:water
          {% else %}
            mdi:water-off
          {% endif %}
  - sensor:
      - name: "Wind Direction Sin"
        unique_id: "c4415109-747b-4ae9-936f-02303dd4d667"
        state: >-
          {{ sin(states('sensor.weather_station_wind_direction') | float(0) * pi / 180) }}
        unit_of_measurement: "1"
        availability: >-
          {{ has_value('sensor.weather_station_wind_direction') }}
      - name: "Wind Direction Cos"
        unique_id: "405d088b-18f5-4127-9e1a-9747755ee468"
        state: >-
          {{ cos(states('sensor.weather_station_wind_direction') | float(0) * pi / 180) }}
        unit_of_measurement: "1"
        availability: >-
          {{ has_value('sensor.weather_station_wind_direction') }}
  - sensor:
      - name: "Wind Speed Filtered (km/h)"
        unique_id: "129b8596-8fe1-4f6b-8774-6c949f6a1ca3"
        unit_of_measurement: "km/h"
        device_class: wind_speed
        variables:
          wind_speed_entity: sensor.wind_speed_filtered
        state: >-
          {{ (states(wind_speed_entity) | float(0) * 3.6) | round(1) }}
        availability: >-
          {{ has_value(wind_speed_entity) }}
      - name: "Wind Gust Filtered (km/h)"
        unique_id: "c3ea5517-3713-471d-bc0a-c636100528ec"
        unit_of_measurement: "km/h"
        device_class: wind_speed
        variables:
          wind_gust_entity: sensor.wind_gust_filtered
        state: >-
          {{ (states(wind_gust_entity) | float(0) * 3.6) | round(1) }}
        availability: >-
          {{ has_value(wind_gust_entity) }}
      # Benchmarking the station against the forecast, logged with wind direction so the
      # deficit can be binned by quadrant. Measured 2026-09-04/05 in the E-SE quadrant the
      # station reads ~41% of forecast sustained but ~105% of forecast gusts: site shelter,
      # with gusts penetrating gaps in the trees while the steady flow is combed out. This
      # is a comparison, not a calibration - neither reading needs correcting, and forecast
      # agreement is not accuracy in either direction, since the forecast describes
      # open-terrain 10m wind rather than this site.
      #
      # OWM's two wind sensors do not agree on units - wind_speed arrives in m/s while
      # wind_gust_speed arrives already converted to km/h - so normalise off the reported
      # unit rather than assuming either.
      #
      # a percentage, not a bare fraction: a template sensor with no unit_of_measurement is
      # rendered as a state timeline instead of a graph. 41% also says what it means.
      - name: "Wind Speed Forecast Ratio"
        unique_id: "5a182b64-059e-4c41-b9f6-5663e5446481"
        unit_of_measurement: "%"
        icon: mdi:approximate-equal
        # the states() calls stay in the state/attribute/availability templates rather
        # than in variables, or the sensor stops tracking its sources and freezes
        variables:
          station_entity: sensor.wind_speed_filtered
          forecast_entity: sensor.openweathermap_wind_speed
        state: >-
          {% set v = states(forecast_entity) | float(0) %}
          {% set f = v * 3.6 if state_attr(forecast_entity, 'unit_of_measurement') == 'm/s' else v %}
          {% set s = states(station_entity) | float(0) * 3.6 %}
          {{ (100 * s / f) | round(1) if f > 0 else none }}
        attributes:
          station_kmh: "{{ (states(station_entity) | float(0) * 3.6) | round(1) }}"
          forecast_kmh: >-
            {% set v = states(forecast_entity) | float(0) %}
            {{ (v * 3.6 if state_attr(forecast_entity, 'unit_of_measurement') == 'm/s' else v) | round(1) }}
          wind_direction: "{{ states('sensor.wind_direction_filtered') | float(0) | round(0) }}"
          compass_direction: "{{ states('sensor.wind_compass_direction') }}"
        availability: >-
          {% set v = states(forecast_entity) | float(0) %}
          {% set f = v * 3.6 if state_attr(forecast_entity, 'unit_of_measurement') == 'm/s' else v %}
          {{ has_value(station_entity) and has_value(forecast_entity) and f > 0 }}
      - name: "Wind Gust Forecast Ratio"
        unique_id: "b9d45ffc-7893-4d7b-b8d6-cb613fb04668"
        unit_of_measurement: "%"
        icon: mdi:approximate-equal
        variables:
          station_entity: sensor.wind_gust_filtered
          forecast_entity: sensor.openweathermap_wind_gust_speed
        state: >-
          {% set v = states(forecast_entity) | float(0) %}
          {% set f = v * 3.6 if state_attr(forecast_entity, 'unit_of_measurement') == 'm/s' else v %}
          {% set s = states(station_entity) | float(0) * 3.6 %}
          {{ (100 * s / f) | round(1) if f > 0 else none }}
        attributes:
          station_kmh: "{{ (states(station_entity) | float(0) * 3.6) | round(1) }}"
          forecast_kmh: >-
            {% set v = states(forecast_entity) | float(0) %}
            {{ (v * 3.6 if state_attr(forecast_entity, 'unit_of_measurement') == 'm/s' else v) | round(1) }}
          wind_direction: "{{ states('sensor.wind_direction_filtered') | float(0) | round(0) }}"
          compass_direction: "{{ states('sensor.wind_compass_direction') }}"
        availability: >-
          {% set v = states(forecast_entity) | float(0) %}
          {% set f = v * 3.6 if state_attr(forecast_entity, 'unit_of_measurement') == 'm/s' else v %}
          {{ has_value(station_entity) and has_value(forecast_entity) and f > 0 }}
      - name: "Wind Direction Filtered"
        unique_id: "bc1a58b7-29b5-4100-9962-d1c99dbfe31a"
        unit_of_measurement: "°"
        icon: mdi:sign-direction
        state: >-
          {% set s = states('sensor.wind_direction_sin_filtered') | float(0) %}
          {% set c = states('sensor.wind_direction_cos_filtered') | float(0) %}
          {{ (atan2(s, c) * 180 / pi) % 360 }}
        availability: >-
          {{ has_value('sensor.wind_direction_sin_filtered') and has_value('sensor.wind_direction_cos_filtered') }}
      - name: "Wind Condition (Beaufort)"
        unique_id: "c78415ce-adf3-469c-a46d-0a04094e5187"
        icon: mdi:weather-windy
        variables:
          wind_speed_entity: sensor.wind_speed_filtered
        state: >-
          {% from 'environment.jinja' import beaufort_scale %}
          {{ beaufort_scale(states(wind_speed_entity) | float(0) * 3.6) }}
        attributes:
          label: >-
            {% from 'environment.jinja' import beaufort_label %}
            {{ beaufort_label(states(wind_speed_entity) | float(0) * 3.6) }}
          wind_speed_ms: >-
            {{ states(wind_speed_entity) | float(0) }}
          wind_speed_with_unit: >-
            {{ "{:,.1f}".format(states(wind_speed_entity) | float(0) * 3.6) }} km/h
          compass_direction: >-
            {{ states('sensor.wind_compass_direction') }}
        availability: >-
          {{ has_value(wind_speed_entity) }}
      - name: "Wind Compass Direction"
        unique_id: "d8242f18-674c-489a-8182-ef8f5c218f8c"
        icon: mdi:compass-outline
        variables:
          wind_speed_entity: sensor.wind_speed_filtered
        state: >-
          {% from 'environment.jinja' import get_direction_8 %}
