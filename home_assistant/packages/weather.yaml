homeassistant:
  customize:
    sensor.outside_temperature:
      state_class: measurement
    sensor.outside_temperature_filtered:
      state_class: measurement
    sensor.outside_temperature_change:
      device_class: temperature
    # sensor.uva_irradiance:
    #   icon: mdi:weather-sunny-alert
    # sensor.uvb_irradiance:
    #   icon: mdi:weather-sunny-alert

# https://community.home-assistant.io/t/outdoor-illuminance-template-sensor/228581
# https://community.home-assistant.io/t/automations-to-turn-on-lights-based-on-actual-season/252830/19
# https://www.engineeringtoolbox.com/light-level-rooms-d_708.html
illuminance:
    name: Weather-Based Sun Illuminance
    unique_id: "ad67d49a-4db4-49c0-81b1-1e068df41b31"
    entity_id: weather.openweathermap
    mode: normal
    fallback: 10
    scan_interval:
      minutes: 5

# why not just use binary_sensor.weather_forecast_precipitation_soon's last_changed?
# because that sensor is a sliding-window sum recalculated every 5 minutes, so it can
# flap on/off several times while the same rain event is still "coming" - last_changed
# is not a reliable signal of "have we already told him about this"
input_datetime:
  rain_expected_notification_sent:
    has_date: true
    has_time: true

utility_meter:
  daily_precipitation:
    unique_id: "2355938a-fdc3-4b79-bd5b-f2a68f7f55a4"
    source: sensor.precipitation_total
    cycle: daily
  monthly_precipitation:
    unique_id: "1e1bc0f0-4a3a-4ee3-bd57-4a86d367cdc8"
    source: sensor.precipitation_total
    cycle: monthly
  annual_precipitation:
    unique_id: "b0894141-7ee1-42d7-80c4-5bb3b1708368"
    source: sensor.precipitation_total
    cycle: yearly

binary_sensor:
  - platform: trend
    sensors:
      outside_temperature_trend:
        entity_id: sensor.outside_temperature_filtered
        friendly_name: "Outside Temperature Trend"
        # 1 hours * 60 minutes * 60 seconds
        sample_duration: 3600
        # 1 degree in the last 3 hours
        min_gradient: 0.000278

sensor:
  - platform: history_stats
    name: Fair Weather Time
    entity_id: binary_sensor.is_fair_weather
    state: "on"
    type: time  # duration
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: filter
    name: outside_temperature_filtered
    entity_id: sensor.outside_temperature
    filters:
      filter: lowpass
      time_constant: 4
      precision: 1

  - platform: statistics
    entity_id: sensor.outside_temperature_filtered
    name: "Outside Temperature Change"
    # the difference between the newest and the oldest measurement
    state_characteristic: change
    max_age:
      minutes: 60

  - platform: filter
    name: "Wind Speed Filtered"
    entity_id: sensor.weather_station_wind_speed_sustained
    filters:
      - filter: lowpass
        time_constant: 10
        precision: 2

  - platform: filter
    name: "Wind Gust Filtered"
    entity_id: sensor.weather_station_wind_speed_gust
    filters:
      - filter: lowpass
        time_constant: 10
        precision: 2

  - platform: filter
    name: "Wind Direction Sin Filtered"
    entity_id: sensor.wind_direction_sin
    filters:
      - filter: lowpass
        time_constant: 15
        precision: 4

  - platform: filter
    name: "Wind Direction Cos Filtered"
    entity_id: sensor.wind_direction_cos
    filters:
      - filter: lowpass
        time_constant: 15
        precision: 4

  - platform: statistics
    name: "Air Pressure Change 3h"
    unique_id: "fe1282c1-da71-4db8-a538-a9c9a7965fb3"
    entity_id: sensor.air_pressure_qnh
    state_characteristic: change
    max_age:
      hours: 3

template:
  - weather:
      - name: "Forecast Tomorrow"
        condition_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['condition'] }}"
        temperature_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['temperature'] }}"
        temperature_unit: °C
        humidity_template: "{{ 0.0 | float(0) }}"
        pressure_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['pressure'] }}"
        pressure_unit: hPa
        wind_speed_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['wind_speed'] }}"
        wind_speed_unit: km/h
        wind_bearing_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'forecast')[0]['wind_bearing'] }}"
        precipitation_unit: mm
        attribution_template: "{{ state_attr('sensor.weather_tomorrow_hourly', 'attribution') }}"
  - binary_sensor:
      # https://www.home-assistant.io/integrations/weather/#condition-mapping
      # see day-time and night-time sensors regarding the value of -0.833
      - name: Is Fair Weather
        # only for daytime
        state: >-
          {# technically it should be -0.833 (not -1), but due to sensor update timings we're stretching it a little bit #}
          {{ (is_state('weather.openweathermap', 'sunny') or
              is_state('weather.openweathermap', 'partlycloudy')) and
             states('sensor.solar_angle') | float(0) >= -1 }}
  - sensor:
      - name: "Outside Temperature Feels Like"
        unique_id: "95a1d418-6c6c-4df2-bda2-30d575612488"
        default_entity_id: sensor.outside_feels_like
        variables:
          # todo
          temperature_entity: sensor.openweathermap_feels_like_temperature
        availability: "{{ temperature_entity | has_value }}"
        state: >-
          {{ states(temperature_entity) | round(1)  }}
        device_class: temperature
        unit_of_measurement: "°C"
        icon: mdi:thermometer
  - sensor:
      - name: "Fair Weather Time Share"
        unique_id: "7564e4b6-c7c6-4536-bd02-efa115f6e6c1"
        state: >-
          {{ min((states('sensor.fair_weather_time') | float(0) / states('sensor.home_sun_daylight') | float(0) * 100) | round(0), 100) if has_value('sensor.home_sun_daylight') else 0 }}
        unit_of_measurement: "%"
  # https://www.home-assistant.io/integrations/template/#trigger-based-handling-of-service-response-data
  # https://community.home-assistant.io/t/petition-dont-delete-the-forecast-attribute/609298/38
  # https://community.home-assistant.io/t/petition-dont-delete-the-forecast-attribute/609298/240
  - trigger:
      - platform: time_pattern
        # every 5 minutes past the hour
        hours: "*"
        minutes: "5"
      - platform: state
        entity_id: weather.openweathermap
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: hourly
    sensor:
      - name: Weather Tomorrow Hourly
        unique_id: "3e214cd0-be86-4ec9-b9ae-d9f7133a35a2"
        # make temperature? (and then device_class and uom)
        state: "{{ now().isoformat() }}"
        # device_class: duration
        # unit_of_measurement: s
        attributes:
          forecast: "{{ hourly['weather.openweathermap']['forecast'][24:] }}"
          attribution: "{{ state_attr('sensor.weather_tomorrow_hourly', 'attribution') }}"
  - trigger:
      - platform: time_pattern
        # every 5 minutes past the hour
        hours: "*"
        minutes: "5"
      - platform: state
        entity_id: weather.openweathermap
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: daily
        response_variable: daily
    sensor:
      - name: Weather Forecast Precipitation Today
        unique_id: "413a950a-150d-4faf-9f93-3d35b240dd5d"
        state: >-
          {{ daily['weather.openweathermap']['forecast'][0]['precipitation'] }}
        device_class: precipitation
        unit_of_measurement: "mm"
        icon: >-
          {% if daily['weather.openweathermap']['forecast'][0]['precipitation'] > 0 %}
            mdi:water
          {% else %}
            mdi:water-off
          {% endif %}
      - name: Weather Forecast Precipitation Tomorrow
        unique_id: "2f58f787-0427-462d-a5c1-c2e1b568f0c7"
        state: >-
          {{ daily['weather.openweathermap']['forecast'][1]['precipitation'] }}
        device_class: precipitation
        unit_of_measurement: "mm"
        icon: >-
          {% if daily['weather.openweathermap']['forecast'][1]['precipitation'] > 0 %}
            mdi:water
          {% else %}
            mdi:water-off
          {% endif %}
      - name: Minimum Temperature Tomorrow
        unique_id: "9ee15a95-74b7-4263-a578-7347e830b68b"
        state: >-
          {{ daily['weather.openweathermap']['forecast'][1]['templow'] }}
        device_class: temperature
        unit_of_measurement: °C
        icon: mdi:thermometer
  - trigger:
      - platform: time_pattern
        # every 5 minutes past the hour
        hours: "*"
        minutes: "5"
      - platform: state
        entity_id: weather.openweathermap
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: hourly
    binary_sensor:
      - name: "Weather Forecast Precipitation Soon"
        unique_id: "949dd25e-35cf-4000-a3f9-f38ab20e112f"
        device_class: moisture
        state: >-
          {% from 'environment.jinja' import rain_outlook %}
          {% set rain_outlook_fn = rain_outlook | as_function %}
          {% set outlook = rain_outlook_fn(hourly['weather.openweathermap']['forecast']) %}
          {# minimum rainy hours in the window to count as significant - a
             single rainy hour is a blip, not a reason to move the chores #}
          {{ outlook.hours >= 3 }}
        attributes:
          onset: >-
            {% from 'environment.jinja' import rain_outlook %}
            {% set rain_outlook_fn = rain_outlook | as_function %}
            {% set outlook = rain_outlook_fn(hourly['weather.openweathermap']['forecast']) %}
            {{ outlook.onset }}
  - binary_sensor:
      - name: "Low Light"
        # alternatives:
        # value_template: "{{ states('sensor.sun_illuminance') != 'unknown' and (states('sensor.sun_illuminance') | int < 15320) }}"
        # value_template: >
        #   {{ states('sensor.sun_illuminance') | int(0) < 7500 or
        #      states('sensor.solar_angle') | int(0) < 5 or
        #      'fog' in states('weather.openweathermap') or
        #      'cloudy' in states('weather.openweathermap') or
        #      'rain' in states('weather.openweathermap') or
        #      'pouring' in states('weather.openweathermap') }}
        # don't use office illuminance, because we might turn on the desk lamp, which will then trigger a low light condition
        # value_template: "{{ states('sensor.office_illuminance') | int(0) <= 25 }}"
        state: >
          {{ states('sensor.weather_station_illuminance') | int(0) < 35000 or is_state('binary_sensor.is_fair_weather', 'off') }}
      # https://github.com/pnbruckner/ha-sun2/blob/master/custom_components/sun2/const.py
      # keep value in sync with the fair weather binary sensor
  - sensor:
      - name: "Outside Temperature"
        unique_id: "17306e70-7ffe-49a1-a448-9c99df8f7690"
        variables:
          temperature_entity: sensor.weather_station_temperature
          thermal_perception_entity: sensor.thermal_comfort_outside_summer_simmer_perception
        state: >-
          {{ states(temperature_entity) }}
          {# state_attr('weather.openweathermap', 'temperature') | float(None) #}
          {# states('sensor.saaqis_ambient_temperature') | float(None) #}
        device_class: temperature
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        attributes:
          thermal_comfort_label: "{{ states(thermal_perception_entity) | replace('_', ' ') | title }}"
        availability: "{{ has_value(temperature_entity) }}"
  - sensor:
      - name: "Outside Apparent Temperature"
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {% set t = states('sensor.weather_station_temperature') | float(0) %}
          {% set rh = states('sensor.weather_station_humidity') | float(0) %}
          {% set ws = states('sensor.wind_speed_filtered') | float(0) %}
          {% set vp = rh / 100 * 6.105 * e ** (17.27 * t / (237.7 + t)) %}
          {{ (t + 0.33 * vp - 0.70 * ws - 4.00) | round(1) }}
  - trigger:
      - platform: state
        entity_id: sensor.daily_precipitation
        attribute: last_period
    sensor:
      # despite the name (kept for entity-id/dashboard compatibility), this is not a forecast -
      # it's the station's own rain gauge total for the previous day
      - name: Weather Forecast Precipitation Yesterday
        unique_id: "701c1f90-bc1c-47d4-b490-1267ec7155e4"
        state: >-
          {{ state_attr('sensor.daily_precipitation', 'last_period') | float(0) }}
        device_class: precipitation
        unit_of_measurement: "mm"
        icon: >-
          {% if state_attr('sensor.daily_precipitation', 'last_period') | float(0) > 0 %}
            mdi:water
          {% else %}
            mdi:water-off
          {% endif %}
  - sensor:
      - name: "Wind Direction Sin"
        unique_id: "c4415109-747b-4ae9-936f-02303dd4d667"
        state: >-
          {{ sin(states('sensor.weather_station_wind_direction') | float(0) * pi / 180) }}
        unit_of_measurement: "1"
        availability: >-
          {{ has_value('sensor.weather_station_wind_direction') }}
      - name: "Wind Direction Cos"
        unique_id: "405d088b-18f5-4127-9e1a-9747755ee468"
        state: >-
          {{ cos(states('sensor.weather_station_wind_direction') | float(0) * pi / 180) }}
        unit_of_measurement: "1"
        availability: >-
          {{ has_value('sensor.weather_station_wind_direction') }}
  - sensor:
      - name: "Wind Speed Filtered (km/h)"
        unique_id: "129b8596-8fe1-4f6b-8774-6c949f6a1ca3"
        unit_of_measurement: "km/h"
        device_class: wind_speed
        variables:
          wind_speed_entity: sensor.wind_speed_filtered
        state: >-
          {{ (states(wind_speed_entity) | float(0) * 3.6) | round(1) }}
        availability: >-
          {{ has_value(wind_speed_entity) }}
      - name: "Wind Gust Filtered (km/h)"
        unique_id: "c3ea5517-3713-471d-bc0a-c636100528ec"
        unit_of_measurement: "km/h"
        device_class: wind_speed
        variables:
          wind_gust_entity: sensor.wind_gust_filtered
        state: >-
          {{ (states(wind_gust_entity) | float(0) * 3.6) | round(1) }}
        availability: >-
          {{ has_value(wind_gust_entity) }}
      - name: "Wind Direction Filtered"
        unique_id: "bc1a58b7-29b5-4100-9962-d1c99dbfe31a"
        unit_of_measurement: "°"
        icon: mdi:sign-direction
        state: >-
          {% set s = states('sensor.wind_direction_sin_filtered') | float(0) %}
          {% set c = states('sensor.wind_direction_cos_filtered') | float(0) %}
          {{ (atan2(s, c) * 180 / pi) % 360 }}
        availability: >-
          {{ has_value('sensor.wind_direction_sin_filtered') and has_value('sensor.wind_direction_cos_filtered') }}
      - name: "Wind Condition (Beaufort)"
        unique_id: "c78415ce-adf3-469c-a46d-0a04094e5187"
        icon: mdi:weather-windy
        variables:
          wind_speed_entity: sensor.wind_speed_filtered
        state: >-
          {% from 'environment.jinja' import beaufort_scale %}
          {{ beaufort_scale(states(wind_speed_entity) | float(0) * 3.6) }}
        attributes:
          label: >-
            {% from 'environment.jinja' import beaufort_label %}
            {{ beaufort_label(states(wind_speed_entity) | float(0) * 3.6) }}
          wind_speed_ms: >-
            {{ states(wind_speed_entity) | float(0) }}
          wind_speed_with_unit: >-
            {{ "{:,.1f}".format(states(wind_speed_entity) | float(0) * 3.6) }} km/h
          compass_direction: >-
            {{ states('sensor.wind_compass_direction') }}
        availability: >-
          {{ has_value(wind_speed_entity) }}
      - name: "Wind Compass Direction"
        unique_id: "d8242f18-674c-489a-8182-ef8f5c218f8c"
        icon: mdi:compass-outline
        variables:
          wind_speed_entity: sensor.wind_speed_filtered
        state: >-
          {% from 'environment.jinja' import get_direction_8 %}
          {% set wind_bearing = states('sensor.wind_direction_filtered') | float(0) | int %}
          {% set wind_speed = states(wind_speed_entity) | float(0) %}
          {% if wind_speed < 0.5 %}
            {{ '' }}
          {% else %}
            {{ get_direction_8(wind_bearing) }}
          {% endif %}
        availability: >-
          {{ has_value('sensor.wind_direction_filtered') and has_value(wind_speed_entity) }}
      - name: "Lux Condition"
        unique_id: "f349c751-0b26-4dd0-ab86-3c1c6db42598"
        icon: mdi:brightness-6
        variables:
          lux_entity: sensor.weather_station_illuminance
        state: >-
          {% set lux = states(lux_entity) | float(0) %}
          {% if lux < 1 %} dark
          {% elif lux < 50 %} twilight
          {% elif lux < 500 %} dim
          {% elif lux < 10000 %} shaded
          {% elif lux < 32000 %} bright
          {% else %} brilliant
          {% endif %}
        attributes:
          label: >-
            {{ this.state | title }}
          lux_with_unit: >-
            {{ "{:,.0f}".format(states(lux_entity) | float(0)) }} {{ state_attr(lux_entity, 'unit_of_measurement') }}
          lux: >-
            {{ states(lux_entity) | float(0) }}
        availability: >-
          {{ has_value(lux_entity) }}
      - name: "UV Condition"
        unique_id: uv_condition
        icon: mdi:sun-wireless-outline
        variables:
          uv_entity: sensor.weather_station_uv_index
        state: >-
          {% set uv = states(uv_entity) | float(0) %}
          {% if uv < 1 %} no_uv
          {% elif uv < 3 %} low
          {% elif uv < 6 %} moderate
          {% elif uv < 8 %} high
          {% elif uv < 11 %} very_high
          {% else %} extreme
          {% endif %}
        attributes:
          label: >-
            {% set labels = {
              'no_uv': 'No Risk',
              'low': 'Low',
              'moderate': 'Moderate',
              'high': 'High',
              'very_high': 'Very High',
              'extreme': 'Extreme'
            } %}
            {{ labels.get(this.state, 'Unknown') }}
          index: >-
            {{ states(uv_entity) | int(0) }}
        availability: >-
          {{ has_value(uv_entity) }}
      - name: "Humidity Condition"
        unique_id: "0028b666-9493-4775-8055-63d3e8d7745e"
        icon: mdi:water-percent
        variables:
          perception_entity: sensor.thermal_comfort_outside_dew_point_perception
          humidity_entity: sensor.weather_station_humidity
        state: >-
          {{ states(perception_entity) }}
        attributes:
          label: >-
            {% set labels = {
              'dry': 'Dry',
              'very_comfortable': 'Ideal',
              'comfortable': 'Comfortable',
              'ok_but_humid': 'Humid',
              'somewhat_uncomfortable': 'Muggy',
              'quite_uncomfortable': 'Oppressive',
              'extremely_uncomfortable': 'Miserable',
              'severely_high': 'Dangerous'
            } %}
            {{ labels.get(this.state, 'Unknown') }}
          # no space for %
          humidity_with_unit: >-
            {{ "{:.0f}".format(states(humidity_entity) | float(0)) }}{{ state_attr(humidity_entity, 'unit_of_measurement') }}
        availability: >-
          {{ has_value(perception_entity) and has_value(humidity_entity) }}
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
    action:
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.precipitation_total
          start_time: "{{ (now() - timedelta(hours=24)).isoformat() }}"
          period: 5minute
          types:
            - sum
        response_variable: precip_stats
    sensor:
      - name: "Rain 24h (LTS)"
        unique_id: "9c3e1a7f-4b6d-4f2e-8a1c-6d5e9b3f7c1a"
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: measurement
        state: >-
          {% set periods = precip_stats.statistics.get('sensor.precipitation_total', []) %}
          {% if periods | length < 2 %}
            0
          {% else %}
            {{ ((periods[-1].sum | float(0)) - (periods[0].sum | float(0))) | round(2) }}
          {% endif %}
        availability: >-
          {{ precip_stats is defined and (precip_stats.statistics.get('sensor.precipitation_total') | length > 0) }}
  - trigger:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: state
      entity_id: sensor.weather_station_precipitation
    sensor:
      - name: "Raw Rain Rate"
        unique_id: "7a1f3c9e-6b2d-4e8a-9c1f-3d5e7a9b2c4f"
        unit_of_measurement: "mm/h"
        device_class: precipitation_intensity
        state_class: measurement
        variables:
          precipitation_entity: sensor.weather_station_precipitation
          stale_after_minutes: 12
        state: >-
          {% from 'environment.jinja' import compute_rate %}
          {% set is_fresh_sample = trigger.platform == 'state' and trigger.entity_id == precipitation_entity %}
          {% set current_value = states(precipitation_entity) | float(0) %}
          {% set last_value = this.attributes.get('last_value', current_value) %}
          {% set last_time_iso = this.attributes.get('last_time') %}
          {{ compute_rate(current_value, last_value, last_time_iso, is_fresh_sample, stale_after_minutes, this.state) }}
        attributes:
          last_value: >-
            {% set is_fresh_sample = trigger.platform == 'state' and trigger.entity_id == precipitation_entity %}
            {{ states(precipitation_entity) | float(0) if is_fresh_sample
               else this.attributes.get('last_value', states(precipitation_entity) | float(0)) }}
          last_time: >-
            {% set is_fresh_sample = trigger.platform == 'state' and trigger.entity_id == precipitation_entity %}
            {{ now().isoformat() if is_fresh_sample
               else this.attributes.get('last_time', now().isoformat()) }}
        availability: "{{ has_value(precipitation_entity) }}"
  - trigger:
      - trigger: state
        entity_id: sensor.weather_station_precipitation
    sensor:
      - name: "Precipitation Total"
        unique_id: "ee251e57-e2b0-4c5a-b236-516077712fea"
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: total_increasing
        variables:
          raw_precipitation_entity: sensor.weather_station_precipitation
          event_rate_entity: sensor.raw_rain_rate
          gain_tiers:
            - ceiling: 0.3
              # was 3.5 — avg of 2.70x, 4.32x, 2.00x across 3 light-rain readings
              gain: 3.01
            - ceiling: 2.0
              gain: 2.56
          gain_unvalidated: 1.0
        state: >-
          {% from 'environment.jinja' import select_gain %}
          {% set current_raw = states(raw_precipitation_entity) | float(0) %}
          {% set last_raw = this.attributes.get('last_raw', current_raw) %}
          {% set delta_raw = current_raw - last_raw %}
          {% set gain = select_gain(states(event_rate_entity), gain_tiers, gain_unvalidated) | float %}
          {% set prev_total = this.attributes.get('calibrated_total', this.state | float(0)) %}
          {{ (prev_total + delta_raw * gain) | round(2) }}
        attributes:
          last_raw: "{{ states(raw_precipitation_entity) | float(0) }}"
          calibrated_total: >-
            {% from 'environment.jinja' import select_gain %}
            {% set current_raw = states(raw_precipitation_entity) | float(0) %}
            {% set last_raw = this.attributes.get('last_raw', current_raw) %}
            {% set delta_raw = current_raw - last_raw %}
            {% set gain = select_gain(states(event_rate_entity), gain_tiers, gain_unvalidated) | float %}
            {% set prev_total = this.attributes.get('calibrated_total', 0) | float(0) %}
            {{ (prev_total + delta_raw * gain) | round(2) }}
        availability: "{{ has_value(raw_precipitation_entity) }}"
  - sensor:
      - name: "Air Pressure (QNH)"
        unique_id: "f056014d-7059-4b0e-8ea3-cf40bf33a176"
        unit_of_measurement: "hPa"
        icon: mdi:gauge
        device_class: pressure
        variables:
          temperature_entity: sensor.weather_station_temperature
          air_pressure_entity: sensor.weather_station_air_pressure
          air_pressure_trend_entity: sensor.air_pressure_trend
        state: >-
          {% set P_station = states(air_pressure_entity) | float(0) %}
          {% set g = 9.80665 %}
          {% set h = 130 %}
          {# R is the specific gas constant for dry air #}
          {% set R = 287.05 %}
          {% set T = states(temperature_entity) | float(15) + 273.15 %}
          {# P_sealevel = P_station * exp(g * h / (R * T)) #}
          {{ (P_station * (e ** (g * h / (R * T)))) | round(1) }}
        attributes:
          trend_label: >-
            {{ state_attr(air_pressure_trend_entity, 'label') }}
        availability: >-
          {{ has_value(air_pressure_entity) and has_value(temperature_entity) }}
  - sensor:
      - name: "Rain Rate Condition"
        unique_id: "9a9e3b1e-c213-4556-b5ec-fcfa52c5f0a5"
        icon: >-
          {{ 'mdi:water-off-outline' if this.state == 'no_rain' else 'mdi:weather-pouring' }}
        variables:
          rain_rate_entity: sensor.rain_rate
          daily_precipitation_entity: sensor.daily_precipitation
          # 24h rain sensor sql configured via UI:
          #   WITH target AS (
          #       SELECT metadata_id FROM states_meta WHERE entity_id = 'sensor.precipitation_total'
          #   ),
          #   latest AS (
          #       SELECT state
          #       FROM states
          #       WHERE metadata_id = (SELECT metadata_id FROM target)
          #         AND state NOT IN ('unknown', 'unavailable')
          #       ORDER BY last_updated_ts DESC
          #       LIMIT 1
          #   ),
          #   baseline AS (
          #       SELECT state
          #       FROM states
          #       WHERE metadata_id = (SELECT metadata_id FROM target)
          #         AND last_updated_ts <= EXTRACT(EPOCH FROM NOW()) - 86400
          #         AND state NOT IN ('unknown', 'unavailable')
          #       ORDER BY last_updated_ts DESC
          #       LIMIT 1
          #   )
          #   SELECT COALESCE(ROUND(
          #       CAST((SELECT CAST(state AS NUMERIC) FROM latest) -
          #            (SELECT CAST(state AS NUMERIC) FROM baseline) AS NUMERIC), 2
          #   ), 0) AS total;
          rain_24h_entity: sensor.rain_24h
        state: >-
          {% set rate = states(rain_rate_entity) | float(0) %}
          {% if rate <= 0 %} no_rain
          {% elif rate < 2.5 %} light
          {% elif rate < 7.6 %} moderate
          {% elif rate < 50 %} heavy
          {% else %} violent
          {% endif %}
        attributes:
          label: >-
            {{ this.state | replace('_', ' ') | title }}
          rain_rate: >-
            {{ states(rain_rate_entity) | float(0) }}
          rain_rate_with_unit: >-
            {{ "{:,.1f}".format(states(rain_rate_entity) | float(0)) }} {{ state_attr(rain_rate_entity, 'unit_of_measurement') }}
          rain_today_with_unit: >-
            {{ "{:,.1f}".format(states(daily_precipitation_entity) | float(0)) }} {{ state_attr(daily_precipitation_entity, 'unit_of_measurement') }}
          rain_24h_with_unit: >-
            {{ "{:,.1f}".format(states(rain_24h_entity) | float(0)) }} {{ state_attr(rain_24h_entity, 'unit_of_measurement') }}
        availability: >-
          {{ has_value(rain_rate_entity) }}
  - binary_sensor:
      - name: "Raining"
        unique_id: "a20205f5-8e5c-4295-bf3c-e96c6015c940"
        device_class: moisture
        icon: >-
          {{ 'mdi:weather-pouring' if this.state == 'on' else 'mdi:water-off-outline' }}
        variables:
          rain_condition_entity: sensor.rain_rate_condition
        state: >-
          {{ not is_state(rain_condition_entity, 'no_rain') }}
        availability: >-
          {{ has_value(rain_condition_entity) }}
  - sensor:
      - name: "Air Pressure Trend"
        unique_id: "ea2872cc-f7af-4be0-852a-ab25a44ebacf"
        icon: mdi:trending-up
        variables:
          change_entity: sensor.air_pressure_change_3h
        state: >-
          {% set change = states(change_entity) | float(0) %}
          {% if change > 3 %} rising_rapidly
          {% elif change > 1.5 %} rising
          {% elif change > 0.5 %} rising_slowly
          {% elif change >= -0.5 %} steady
          {% elif change >= -1.5 %} falling_slowly
          {% elif change >= -3 %} falling
          {% else %} falling_rapidly
          {% endif %}
        attributes:
          label: >-
            {% set labels = {
              'rising_rapidly': 'Rising Rapidly',
              'rising': 'Rising',
              'rising_slowly': 'Rising Slowly',
              'steady': 'Steady',
              'falling_slowly': 'Falling Slowly',
              'falling': 'Falling',
              'falling_rapidly': 'Falling Rapidly'
            } %}
            {{ labels.get(this.state, 'Unknown') }}
        availability: >-
          {{ has_value(change_entity) }}
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: sensor.precipitation_total
    sensor:
      - name: "Rain Rate"
        unique_id: "283562c0-d3dc-4bab-8d17-2fe3b204f5af"
        unit_of_measurement: "mm/h"
        device_class: precipitation_intensity
        state_class: measurement
        variables:
          precipitation_entity: sensor.precipitation_total
          # stale_after_minutes: how long to hold the last computed rate before
          # decaying to 0 when no new precipitation arrives. sensor resolution
          # is 0.1mm/tick, so this sets the minimum sustained rate we can still
          # detect as nonzero (time to accumulate one 0.1mm tick at that rate):
          #
          #   target min. rate    time for one 0.1mm tick
          #   1.0 mm/h            6 min
          #   0.5 mm/h            12 min
          #   0.2 mm/h            30 min
          #   0.1 mm/h            60 min
          #
          # lower = faster to detect rain has actually stopped, but sustained
          #         rain below the implied floor will flicker to 0 between ticks.
          # higher = detects lighter sustained rain, but slower to admit it's
          #          stopped. Currently set for a ~0.5 mm/h floor.
          stale_after_minutes: 12
        state: >-
          {% from 'environment.jinja' import compute_rate %}
          {% set is_fresh_sample = trigger.platform == 'state' and trigger.entity_id == precipitation_entity %}
          {% set current_value = states(precipitation_entity) | float(0) %}
          {% set last_value = this.attributes.get('last_value', current_value) %}
          {% set last_time_iso = this.attributes.get('last_time') %}
          {{ compute_rate(current_value, last_value, last_time_iso, is_fresh_sample, stale_after_minutes, this.state) }}
        attributes:
          last_value: >-
            {% set is_fresh_sample = trigger.platform == 'state' and trigger.entity_id == precipitation_entity %}
            {{ states(precipitation_entity) | float(0) if is_fresh_sample
               else this.attributes.get('last_value', states(precipitation_entity) | float(0)) }}
          last_time: >-
            {% set is_fresh_sample = trigger.platform == 'state' and trigger.entity_id == precipitation_entity %}
            {{ now().isoformat() if is_fresh_sample
               else this.attributes.get('last_time', now().isoformat()) }}
        availability: "{{ has_value(precipitation_entity) }}"
  - sensor:
      - name: "Dew Point Spread"
        unique_id: "d4f2a9b5-8e3c-4b7f-ad4c-2f9a3b6e8d1f"
        unit_of_measurement: "°C"
        state_class: measurement
        state: >
          {% set t = states('sensor.weather_station_temperature') | float(none) %}
          {% set dp = states('sensor.weather_station_dew_point') | float(none) %}
          {% if t is none or dp is none %}
            {{ none }}
          {% else %}
            {{ (t - dp) | round(1) }}
          {% endif %}
  - sensor:
      - name: "Fog Probability"
        unique_id: "d6dee5e4-64f6-483f-90bb-de1d527c6a9f"
        unit_of_measurement: "%"
        icon: mdi:weather-fog
        variables:
          spread_entity: sensor.dew_point_spread
          wind_entity: sensor.wind_speed_filtered_km_h
        # spread and wind approach 0 as fog becomes more likely; scores fall to 0 by 1.5°C spread / 10 km/h wind
        state: >-
          {% set spread = states(spread_entity) | float(none) %}
          {% set wind = states(wind_entity) | float(none) %}
          {% if spread is none or wind is none %}
            {{ none }}
          {% else %}
            {% set spread_score = [[((1.5 - spread) / 1.5), 0] | max, 1] | min %}
            {% set wind_score = [[((10 - wind) / 10), 0] | max, 1] | min %}
            {{ (spread_score * wind_score * 100) | round(0) }}
          {% endif %}
        availability: "{{ has_value(spread_entity) and has_value(wind_entity) }}"
  - binary_sensor:
      - name: "Fog Conditions"
        unique_id: "e5a3b0c6-9f4d-4c8a-be5d-3a0b4c7f9e2a"
        icon: >-
          {{ 'mdi:weather-fog' if this.state == 'on' else 'mdi:eye-outline' }}
        variables:
          dew_point_entity: sensor.weather_station_dew_point
          spread_entity: sensor.dew_point_spread
          probability_entity: sensor.fog_probability
          rain_entity: binary_sensor.raining
          moisture_entity: binary_sensor.weather_station_moisture
          probability_threshold: 70
        # moisture alone doesn't mean fog (it also confirms dew), but real fog should always wet the sensor,
        # so require it as a confirmatory check on top of the probability estimate rather than as a trigger on its own
        state: >-
          {% set probability = states(probability_entity) | float(none) %}
          {% set raining = is_state(rain_entity, 'on') %}
          {% set moist = is_state(moisture_entity, 'on') %}
          {{ probability is not none and probability > probability_threshold and not raining and moist }}
        delay_on: "00:15:00"
        attributes:
          label: >-
            {{ 'Foggy' if this.state == 'on' else 'Clear' }}
          probability: "{{ states(probability_entity) | float(none) }}"
          # no space for %
          probability_with_unit: >-
            {% set probability = states(probability_entity) | float(none) %}
            {{ probability | round(0) if probability is not none else 0 }}{{ state_attr(probability_entity, 'unit_of_measurement') }}
          dew_point_with_unit: >-
            {{ "{:.1f}".format(states(dew_point_entity) | float(0)) }} {{ state_attr(dew_point_entity, 'unit_of_measurement') }}
          dew_point_spread_with_unit: >-
            {{ "{:.1f}".format(states(spread_entity) | float(0)) }} {{ state_attr(spread_entity, 'unit_of_measurement') }}
        availability: >-
          {{ has_value(spread_entity) and has_value(probability_entity) }}

rest:
  # https://jsoncrack.com/editor
  # - resource_template: 'http://weather.sun.ac.za/api/getSonbesie.php?start={{ utcnow() | as_timestamp | int - 300 }}&end={{ utcnow() | as_timestamp | int }}'
  #   method: GET
  #   scan_interval: 300
  #   timeout: 15
  #   sensor:
  #     - name: Sun Illuminance
  #       device_class: illuminance
  #       # http://weather.sun.ac.za/
  #       # http://weather.sun.ac.za/api/Sonbesie%20metadata.pdf
  #       # we're using the GHI (global horizontal irradiance here)
  #       # https://www.ammonit.com/en/wind-solar-wissen/solarmessung
  #       # https://www.nrel.gov/grid/solar-resource/solar-glossary.html#globalhorizontalradiation
  #       # GHI = DHI + DNI · cos (θ) (where θ is the solar zenith angle)
  #       # The total amount of radiation received from above by a horizontal surface. This value includes both Direct Normal Irradiation (DNI) and Diffuse Horizontal Irradiation (DHI).
  #       # https://physics.stackexchange.com/questions/135618/rm-lux-and-w-m2-relationship
  #       # https://www.nasa.gov/pdf/583137main_Inverse_Square_Law_of_Light.pdf
  #       # Identification of residential electricity consumption profiles for building dynamic simulation through smart-meter data:
  #       # There is no simple conversion from lux to W/m2, since it depends on the wavelength or color of the light. However, a simplification was adapted: for the sun light there is
  #       # an approximate conversion of 0.0079 W/m2 per lux [72], valid for direct sunlight, while for daylight the appropriate conversion drops to 10% of that value [73].
  #       # https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=&cad=rja&uact=8&ved=2ahUKEwjFuLDfl6TwAhXISxUIHQ_yA8sQFjAFegQICBAD&url=https%3A%2F%2Ffenix.tecnico.ulisboa.pt%2FdownloadFile%2F1970719973966843%2FMasterThesis_70481.pdf&usg=AOvVaw35OzdODshLT6JlqkKa_hGJ
  #       # https://www.researchgate.net/publication/347362859_A_conversion_guide_solar_irradiance_and_lux_illuminance
  #       # comparing the last two papers: 1/0.0079 W/mˆ2 = 126 lx ~= 122 +- 1 lx
  #       # general:
  #       # https://en.wikipedia.org/wiki/Irradiance
  #       # https://depts.washington.edu/mictech/optics/me557/Radiometry.pdf
  #       # https://www.jvejournals.com/article/21667
  #       # https://bg.copernicus.org/preprints/6/10625/2009/bgd-6-10625-2009.pdf
  #       # https://www.nrel.gov/docs/legosti/old/2436.pdf
  #       value_template: "{{ value_json[-1].SunWM_Avg | float | multiply(1/0.0079) if value_json else 'unknown' }}"
  #       unit_of_measurement: "lx"
  #     - name: Sun Irradiance
  #       value_template: "{{ value_json[-1].SunWM_Avg | float if value_json else 'unknown' }}"
  #       unit_of_measurement: "W/m²"
  #     # https://www.epa.gov/sunsafety/calculating-uv-index-0
  #     # https://www.canada.ca/en/conservation-institute/services/conservation-preservation-publications/canadian-conservation-institute-notes/measurement-ultraviolet-radiation.html
  #     # https://www.kippzonen.com/Download/137/Brochure-UV-Radiometers-CUV-5-and-UVS-range -> KippZonen_Brochure_UV_Radiometers_V1508.pdf
  #     # https://www.kippzonen.com/News/411/Choosing-the-Right-UV-Radiometer#.YRkvs4Qq2Ak
  #     # To avoid this confusion, United Nations organisations combined to produce the
  #     # Global Solar UV Index (UVI). This is now accepted world-wide as the basis for
  #     # public health. information. The erythemal spectral response function is defined
  #     # by ISO: 17166:1999 / CIE S 007/E-1998. The Global Solar UV Index can be calculated
  #     # by multiplying the UVE radiation value in W/m² by 40 m²/W. For example, 0.25 W/m²
  #     # of UVE represents a UV Index of 10. A UVB radiometer is not ideal for the
  #     # measurement of UVE. The UVS-E-T and UVS-AE-T radiometers are specifically designed
  #     # for this application.
  #     # https://www.who.int/uv/publications/en/UVIGuide.pdf
  #     # https://www.esrl.noaa.gov/gmd/grad/neubrew/docs/UVindex.pdf
  #     # http://www.dfisica.ubi.pt/~hgil/Fotometria/HandBook/ch07.html
  #     # https://www.ncbi.nlm.nih.gov/books/NBK401584/
  #     # https://www.who.int/uv/publications/Protecting_Workers_UV_pub.pdf
  #     # http://strang.smhi.se/extraction/units-conversion.html
  #     - name: UVA Irradiance
  #       value_template: "{{ value_json[-1].UVA_Avg | float if value_json else 'unknown' }}"
  #       unit_of_measurement: "W/m²"
  #     - name: UVB Irradiance
  #       value_template: "{{ value_json[-1].UVB_Avg | float if value_json else 'unknown' }}"
  #       unit_of_measurement: "W/m²"
  # https://www.weatherapi.com/docs/#apis-forecast
  # https://api.weatherapi.com/v1/forecast.json?q=<lat>%2C<long>&days=1&alerts=yes&key=<key>
  # https://www.baeldung.com/linux/jq-command-json
  - resource: !secret weather_api_alerts_url
    headers:
      Accept: 'application/json'
    method: GET
    # an alert seems to last 6 hours, but then they'll re-issue the same alert 6 hours later
    scan_interval: 43200  # 60*60*12
    timeout: 15
    sensor:
      - name: Weather Alerts
        icon: mdi:alert-outline
        value_template: "{{ value_json.alerts.alert | count }}"
        unit_of_measurement: count
        json_attributes_path: "$.alerts"
        json_attributes:
          - alert

automation:
  - alias: "Weather Alert Notification"
    id: "c0b01006-be9e-41e9-b1b5-adafc3ecae1b"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.weather_alerts
    condition:
      # not to 0 is obvious: there's no alert, so nothing to notify
      # otherwise, we can go from 0 to 1, or 0 to 2, or more
      # we only want to alert the first time going from 0
      # and not for e.g. 1 to 2
      - condition: template
        value_template: >-
          {% set from = trigger.from_state.state | int(0) %}
          {% set to = trigger.to_state.state | int(0) %}
          {{ from == 0 and to != 0 }}
    action:
      - repeat:
          for_each: "{{ state_attr('sensor.weather_alerts', 'alert') | sort(attribute='effective') }}"
          sequence:
            - variables:
                message: >-
                  {%- set event = repeat.item['event'] %}
                  {%- set from = repeat.item['effective'] | as_datetime(0) | as_local %}
                  {%- set from_str = from.strftime('%A %-d %B') %}
                  {%- set to = repeat.item['expires'] | as_datetime(0) | as_local %}
                  {%- set to_str = to.strftime('%A %-d %B') %}
                  {%- set event_body = event | capitalize %}
                  {# api encoding bug #}
                  {%- set desc = repeat.item['desc'] | replace('Â', '') %}
                  {%- if from.date() == to.date() -%}
                    {{ event_body }} for {{ from_str }}:
                  {%- else -%}
                    {{ event_body }} from {{ from_str }} until {{ to_str }}:
                  {%- endif %}
                  {%- for line in desc.split('\n') %}
                    - {{ line }}
                  {%- endfor %}
            # only a critical sound notification when it's not night
            - choose:
                - conditions:
                    - condition: time
                      after: "08:00:00"
                      before: "20:00:00"
                  sequence:
                    - service: notify.family
                      data:
                        title: "⚠️ Extreme Weather"
                        message: "{{ message }}"
                        data:
                          group: "weather"
                          url: homeassistant://navigate/lovelace-main/environment
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 0.3
              default:
                - service: notify.family
                  data:
                    title: "⚠️ Extreme Weather"
                    message: "{{ message }}"
                    data:
                      group: "weather"
                      url: homeassistant://navigate/lovelace-main/environment

  - alias: "Notify When Significant Rain Is Expected"
    id: "aff421a7-d99a-45c2-baa5-710b11d010b9"
    initial_state: true
    trigger:
      - platform: time
        at: "06:30:00"
      - platform: time
        at: "12:00:00"
      - platform: time
        at: "17:30:00"
      - platform: time
        at: "19:00:00"
    condition:
      - condition: state
        entity_id: binary_sensor.weather_forecast_precipitation_soon
        state: "on"
      # the sensor is a sliding window recalculated every 5 minutes, so it can
      # flap on/off during a multi-day rain spell - track our own notification
      # history instead of the sensor's last_changed, and only notify once a
      # day at most.
      # 20h rather than 24h: gives enough slack that the same daily trigger
      # slot (e.g. 06:30) is always eligible again the next day, even with a
      # few minutes of timing jitter - a strict 24h gate could skip a whole day
      # if the previous notification landed slightly late
      - condition: template
        value_template: >
          {{ as_timestamp(now()) - as_timestamp(states('input_datetime.rain_expected_notification_sent'), 0) >= 20 * 60 * 60 }}
      - condition: state
        entity_id: binary_sensor.pieter_present
        state: "on"
    action:
      - service: notify.mobile_app_ceres
        data:
          title: "🌧️ Rain Expected"
          message: >-
            {# onset comes from the sensor, so the window is defined in exactly
               one place (environment.jinja) and cannot drift from the state
               that gated this notification #}
            {% set onset = state_attr('binary_sensor.weather_forecast_precipitation_soon', 'onset') %}
            {% if onset %}
              {% set onset_local = onset | as_datetime | as_local %}
              {% set rain_time = onset_local.strftime('%H:%M') %}
              {% if onset_local.date() == now().date() %}
                {% set time_phrase = "tonight" if onset_local.hour >= 18 else "later today" %}
              {% elif onset_local.hour < 4 %}
                {% set time_phrase = "overnight" %}
              {% elif onset_local.hour < 7 %}
                {% set time_phrase = "early morning" %}
              {% elif onset_local.hour < 10 %}
                {% set time_phrase = "early tomorrow" %}
              {% elif onset_local.hour < 18 %}
                {% set time_phrase = "later tomorrow" %}
              {% else %}
                {% set time_phrase = "tomorrow night" %}
              {% endif %}
              Rain is expected {{ time_phrase }} around {{ rain_time }}. Plan accordingly.
            {% else %}
              Rain is expected, but timing is uncertain. Check the forecast and plan accordingly.
            {% endif %}
          data:
            url: homeassistant://navigate/lovelace-main/environment
            group: "environment"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.rain_expected_notification_sent
        data:
          datetime: "{{ now() }}"

  - alias: "High UV Notification"
    id: "101c7f2d-6839-4a8c-be1a-0de46ed70477"
    initial_state: true
    trigger:
      - platform: numeric_state
        entity_id: sensor.weather_station_uv_index
        above: 7
    mode: single
    condition:
      - condition: state
        entity_id: binary_sensor.raining
        state: "off"
    action:
      - service: notify.family
        data:
          title: "☀️ Health"
          message: >-
            UV radiation is high. Remember to apply sunscreen.
          data:
            group: "environment"
            tag: "environment-uv"
            url: homeassistant://navigate/lovelace-main/environment

  - alias: "Morning Weather Brief"
    id: "9c0ff371-189f-4573-8745-17b538695d46"
    initial_state: true
    trigger:
      - platform: time
        at: input_datetime.wake_up_time
    condition:
      - condition: state
        entity_id: binary_sensor.pieter_present
        state: "on"
    action:
      - delay:
          minutes: 15
      - action: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: daily
        response_variable: daily
      - variables:
          # now (measured)
          current_temp: "{{ states('sensor.outside_temperature') | int(0) }}"
          heat_label: "{{ state_attr('sensor.outside_temperature', 'thermal_comfort_label') }}"
          humidity_label: "{{ state_attr('sensor.humidity_condition', 'label') }}"
          humidity_value: "{{ state_attr('sensor.humidity_condition', 'humidity_with_unit') }}"
          fog_on: "{{ is_state('binary_sensor.fog_conditions', 'on') }}"
          fog_probability: "{{ state_attr('binary_sensor.fog_conditions', 'probability_with_unit') }}"
          compass_names: >-
            {{ {
              'N': 'North', 'NE': 'Northeast', 'E': 'East', 'SE': 'Southeast',
              'S': 'South', 'SW': 'Southwest', 'W': 'West', 'NW': 'Northwest'
            } }}
          # full phrases for use in sentences, keyed by beaufort tier - distinct from
          # sensor.wind_condition_beaufort's 'label' attribute, which is a terse
          # dashboard-tile display value (e.g. "Light", "Gale") not meant to stand alone in prose
          wind_phrases: >-
            {{ {
              'calm': 'Calm', 'light_air': 'Light wind', 'light_breeze': 'Light breeze',
              'gentle_breeze': 'Gentle breeze', 'moderate_breeze': 'Moderate breeze',
              'fresh_breeze': 'Fresh breeze', 'strong_breeze': 'Strong breeze',
              'near_gale': 'Near-gale wind', 'gale': 'Gale-force wind', 'strong_gale': 'Strong gale',
              'storm': 'Storm-force wind', 'violent_storm': 'Violent storm', 'extreme_storm': 'Extreme storm'
            } }}
          wind_state: "{{ states('sensor.wind_condition_beaufort') }}"
          wind_speed: "{{ state_attr('sensor.wind_condition_beaufort', 'wind_speed_with_unit') }}"
          wind_dir: >-
            {% set abbr = state_attr('sensor.wind_condition_beaufort', 'compass_direction') %}
            {{ compass_names.get(abbr, abbr) }}
          uv_state: "{{ states('sensor.uv_condition') }}"
          uv_label: "{{ state_attr('sensor.uv_condition', 'label') }}"
          pressure_state: "{{ states('sensor.air_pressure_trend') }}"
          pressure_label: "{{ state_attr('sensor.air_pressure_trend', 'label') }}"
          # later (forecast, via the get_forecasts call above rather than any derived weather entity)
          rain_soon: "{{ is_state('binary_sensor.weather_forecast_precipitation_soon', 'on') }}"
          rain_onset: "{{ state_attr('binary_sensor.weather_forecast_precipitation_soon', 'onset') }}"
          rain_today_mm: "{{ states('sensor.weather_forecast_precipitation_today') | float(0) | round(1) }}"
          today_high: "{{ daily['weather.openweathermap']['forecast'][0]['temperature'] | int(0) }}"
          today_condition: "{{ daily['weather.openweathermap']['forecast'][0]['condition'] }}"
          later_wind_state: >-
            {% from 'environment.jinja' import beaufort_scale %}
            {{ beaufort_scale(daily['weather.openweathermap']['forecast'][0]['wind_speed'] | float(0)) }}
          later_wind_dir: >-
            {% from 'environment.jinja' import get_direction_8 %}
            {% set abbr = get_direction_8(daily['weather.openweathermap']['forecast'][0]['wind_bearing'] | float(0)) %}
            {{ compass_names.get(abbr, abbr) }}
      - service: notify.mobile_app_ceres
        data:
          title: "🌤️ Weather Brief"
          message: >-
            {% set condition_words = {
              'clear-night': 'clear', 'cloudy': 'cloudy', 'fog': 'foggy', 'hail': 'hail',
              'lightning': 'thunderstorms', 'lightning-rainy': 'thunderstorms', 'partlycloudy': 'partly cloudy',
              'pouring': 'heavy rain', 'rainy': 'rain', 'snowy': 'snow', 'snowy-rainy': 'sleet',
              'sunny': 'sunny', 'windy': 'windy', 'windy-variant': 'windy', 'exceptional': 'unusual weather'
            } %}
            {% set later_condition = condition_words.get(today_condition, today_condition | replace('-', ' ')) %}
            {# fog_conditions is inferred from dew point spread + wind + moisture, not observed directly,
               and it's real-time only - there's no forecast for onset or when it would lift #}
            {% set feel_clause = 'Feels ' ~ (heat_label | lower) ~ ' at ' ~ current_temp ~ '°C, humidity ' ~ (humidity_label | lower) ~ ' (' ~ humidity_value ~ ') now.' %}
            {% if fog_on %}
              {% set now_clause = 'Conditions suitable for fog right now (' ~ fog_probability ~ ' probability). ' ~ feel_clause %}
            {% else %}
              {% set now_clause = feel_clause %}
            {% endif %}
            {% if rain_soon %}
              {% set onset_local = rain_onset | as_datetime | as_local %}
              {% set later_clause = 'Rain expected around ' ~ onset_local.strftime('%H:%M') ~ ' (' ~ rain_today_mm ~ ' mm), high of ' ~ today_high ~ '°C.' %}
            {% elif rain_today_mm > 0 %}
              {% set later_clause = (later_condition | capitalize) ~ ' with some rain (' ~ rain_today_mm ~ ' mm), high of ' ~ today_high ~ '°C.' %}
            {% else %}
              {% set later_clause = (later_condition | capitalize) ~ ' later, high of ' ~ today_high ~ '°C.' %}
            {% endif %}
            {% if wind_state == 'calm' %}
              {% set wind_now_clause = 'Calm right now.' %}
            {% elif wind_dir %}
              {% set wind_now_clause = wind_phrases[wind_state] ~ ' from the ' ~ wind_dir ~ ' (' ~ wind_speed ~ ') right now.' %}
            {% else %}
              {% set wind_now_clause = wind_phrases[wind_state] ~ ' right now (' ~ wind_speed ~ ').' %}
            {% endif %}
            {% set extras = [wind_now_clause] %}
            {% if uv_state in ['high', 'very_high', 'extreme'] %}
              {% set extras = extras + ['UV ' ~ (uv_label | lower) ~ '.'] %}
            {% endif %}
            {% if pressure_state in ['rising_rapidly', 'falling_rapidly'] %}
              {% set extras = extras + ['Pressure ' ~ (pressure_label | lower) ~ '.'] %}
            {% endif %}
            {% if later_wind_state not in ['calm', 'light_air', 'light_breeze'] %}
              {% set extras = extras + [wind_phrases[later_wind_state] ~ ' from the ' ~ later_wind_dir ~ ' expected later.'] %}
            {% endif %}
            {{ ([now_clause, later_clause] + extras) | join(' ') }}
          data:
            url: homeassistant://navigate/lovelace-main/environment
            group: "environment"
