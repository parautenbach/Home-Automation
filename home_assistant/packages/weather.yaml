        # so that ideal-but-nonzero inputs aren't penalised, then falls to 0 by 2.5°C spread / 12 km/h wind
        #
        # this entity is user-facing - the dashboards show the % directly - so it states the
        # probability that fog is present now, and every piece of evidence bearing on that
        # belongs here rather than in one consumer. Two things zero it outright:
        #
        #   rain     - it drives the spread to nearly nothing without being fog, so steady light rain
        #              otherwise scores 78-100% on spread and wind alone. This gates on the held
        #              'recently raining' rather than the raw sensor, because intermittent drizzle
        #              leaves the air saturated through the gaps between bursts
        #   dryness  - real fog always wets the sensor, so an explicitly dry sensor rules it out
        #
        # dryness is tested as an explicit 'off' rather than "not on", so that a moisture sensor which
        # goes unavailable leaves the estimate alone instead of silently pinning it to zero
        state: >-
          {% set spread = states(spread_entity) | float(none) %}
          {% set wind = states(wind_entity) | float(none) %}
          {% if spread is none or wind is none %}
            {{ none }}
          {% elif is_state(rain_entity, 'on') or is_state(moisture_entity, 'off') %}
            {{ 0 }}
          {% else %}
            {% set spread_score = [[((2.5 - spread) / 2.0), 0] | max, 1] | min %}
            {% set wind_score = [[((12 - wind) / 9), 0] | max, 1] | min %}
            {{ (spread_score * wind_score * 100) | round(0) }}
          {% endif %}
        availability: "{{ has_value(spread_entity) and has_value(wind_entity) }}"
  # link for retrieving calibration data
  # http://homeassistant.local:8123/history?entity_id=sensor.weather_station_temperature%2Csensor.weather_station_dew_point%2Csensor.dew_point_spread%2Csensor.wind_speed_filtered_km_h%2Csensor.fog_probability%2Cbinary_sensor.fog_conditions%2Csensor.openweathermap_cloud_coverage%2Csensor.weather_station_illuminance%2Cbinary_sensor.raining%2Cbinary_sensor.weather_station_moisture%2Csensor.rain_rate%2Csensor.wind_speed_filtered%2Csensor.weather_station_wind_speed_gust%2Csensor.weather_station_wind_speed_sustained&start_date=2026-09-08T14%3A00%3A00.000Z&end_date=2026-09-09T21%3A59%3A00.000Z
  - binary_sensor:
      - name: "Fog Conditions"
        unique_id: "e5a3b0c6-9f4d-4c8a-be5d-3a0b4c7f9e2a"
        icon: >-
          {{ 'mdi:weather-fog' if this.state == 'on' else 'mdi:eye-outline' }}
        variables:
          dew_point_entity: sensor.weather_station_dew_point
          spread_entity: sensor.dew_point_spread
          probability_entity: sensor.fog_probability
          # two bars on the same probability, each named for the tier it opens (see 'chance' below).
          # the score plateaus make high values common on merely dewy calm nights (~85% observed), so
          # the bar for calling it fog sits above that band; genuine fog scores 88-100 in the same data
          present_threshold: 85
          # the softer bar: high enough to stay out of the ordinary damp-morning range, low enough to
          # reach into the dewy band the one above excludes - which is the point, since a heads-up
          # costs less when wrong than a claim does
          possible_threshold: 80
        # rain and a dry moisture sensor are both handled upstream in the probability, so this is left as
        # a threshold plus delay_on: the sustained-ness of the reading is the only thing it adds
        state: >-
          {% set probability = states(probability_entity) | float(none) %}
          {{ probability is not none and probability > present_threshold }}
        delay_on: "00:15:00"
        attributes:
          label: >-
            {{ 'Foggy' if this.state == 'on' else 'Clear' }}
          # the state answers "is there fog", which loses the difference between a clear night and
          # one sitting just under the bar. Consumers that want to say something about the
          # in-between get it here rather than re-deriving it from the raw %, which would mean
          # duplicating the bars above outside this sensor.
          #
          # 'present' tracks the state rather than the raw %, so it inherits delay_on and cannot
          # contradict it; 'possible' therefore also covers the window where the probability is
          # over the bar but not yet sustained.
          chance: >-
            {% set probability = states(probability_entity) | float(none) %}
            {% if this.state == 'on' %}
              present
            {% elif probability is not none and probability >= possible_threshold %}
              possible
            {% else %}
              none
            {% endif %}
          probability: "{{ states(probability_entity) | float(none) }}"
          # no space for %
          probability_with_unit: >-
            {% set probability = states(probability_entity) | float(none) %}
            {{ probability | round(0) if probability is not none else 0 }}{{ state_attr(probability_entity, 'unit_of_measurement') }}
          dew_point_with_unit: >-
            {{ "{:.1f}".format(states(dew_point_entity) | float(0)) }} {{ state_attr(dew_point_entity, 'unit_of_measurement') }}
          dew_point_spread_with_unit: >-
            {{ "{:.1f}".format(states(spread_entity) | float(0)) }} {{ state_attr(spread_entity, 'unit_of_measurement') }}
        availability: >-
          {{ has_value(spread_entity) and has_value(probability_entity) }}

rest:
  # https://jsoncrack.com/editor
  # - resource_template: 'http://weather.sun.ac.za/api/getSonbesie.php?start={{ utcnow() | as_timestamp | int - 300 }}&end={{ utcnow() | as_timestamp | int }}'
  #   method: GET
  #   scan_interval: 300
  #   timeout: 15
  #   sensor:
  #     - name: Sun Illuminance
  #       device_class: illuminance
  #       # http://weather.sun.ac.za/
  #       # http://weather.sun.ac.za/api/Sonbesie%20metadata.pdf
  #       # we're using the GHI (global horizontal irradiance here)
  #       # https://www.ammonit.com/en/wind-solar-wissen/solarmessung
  #       # https://www.nrel.gov/grid/solar-resource/solar-glossary.html#globalhorizontalradiation
  #       # GHI = DHI + DNI · cos (θ) (where θ is the solar zenith angle)
  #       # The total amount of radiation received from above by a horizontal surface. This value includes both Direct Normal Irradiation (DNI) and Diffuse Horizontal Irradiation (DHI).
  #       # https://physics.stackexchange.com/questions/135618/rm-lux-and-w-m2-relationship
  #       # https://www.nasa.gov/pdf/583137main_Inverse_Square_Law_of_Light.pdf
  #       # Identification of residential electricity consumption profiles for building dynamic simulation through smart-meter data:
  #       # There is no simple conversion from lux to W/m2, since it depends on the wavelength or color of the light. However, a simplification was adapted: for the sun light there is
  #       # an approximate conversion of 0.0079 W/m2 per lux [72], valid for direct sunlight, while for daylight the appropriate conversion drops to 10% of that value [73].
  #       # https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=&cad=rja&uact=8&ved=2ahUKEwjFuLDfl6TwAhXISxUIHQ_yA8sQFjAFegQICBAD&url=https%3A%2F%2Ffenix.tecnico.ulisboa.pt%2FdownloadFile%2F1970719973966843%2FMasterThesis_70481.pdf&usg=AOvVaw35OzdODshLT6JlqkKa_hGJ
  #       # https://www.researchgate.net/publication/347362859_A_conversion_guide_solar_irradiance_and_lux_illuminance
  #       # comparing the last two papers: 1/0.0079 W/mˆ2 = 126 lx ~= 122 +- 1 lx
  #       # general:
  #       # https://en.wikipedia.org/wiki/Irradiance
  #       # https://depts.washington.edu/mictech/optics/me557/Radiometry.pdf
  #       # https://www.jvejournals.com/article/21667
  #       # https://bg.copernicus.org/preprints/6/10625/2009/bgd-6-10625-2009.pdf
  #       # https://www.nrel.gov/docs/legosti/old/2436.pdf
  #       value_template: "{{ value_json[-1].SunWM_Avg | float | multiply(1/0.0079) if value_json else 'unknown' }}"
  #       unit_of_measurement: "lx"
  #     - name: Sun Irradiance
  #       value_template: "{{ value_json[-1].SunWM_Avg | float if value_json else 'unknown' }}"
  #       unit_of_measurement: "W/m²"
  #     # https://www.epa.gov/sunsafety/calculating-uv-index-0
  #     # https://www.canada.ca/en/conservation-institute/services/conservation-preservation-publications/canadian-conservation-institute-notes/measurement-ultraviolet-radiation.html
  #     # https://www.kippzonen.com/Download/137/Brochure-UV-Radiometers-CUV-5-and-UVS-range -> KippZonen_Brochure_UV_Radiometers_V1508.pdf
  #     # https://www.kippzonen.com/News/411/Choosing-the-Right-UV-Radiometer#.YRkvs4Qq2Ak
  #     # To avoid this confusion, United Nations organisations combined to produce the
  #     # Global Solar UV Index (UVI). This is now accepted world-wide as the basis for
  #     # public health. information. The erythemal spectral response function is defined
  #     # by ISO: 17166:1999 / CIE S 007/E-1998. The Global Solar UV Index can be calculated
  #     # by multiplying the UVE radiation value in W/m² by 40 m²/W. For example, 0.25 W/m²
  #     # of UVE represents a UV Index of 10. A UVB radiometer is not ideal for the
  #     # measurement of UVE. The UVS-E-T and UVS-AE-T radiometers are specifically designed
  #     # for this application.
  #     # https://www.who.int/uv/publications/en/UVIGuide.pdf
  #     # https://www.esrl.noaa.gov/gmd/grad/neubrew/docs/UVindex.pdf
  #     # http://www.dfisica.ubi.pt/~hgil/Fotometria/HandBook/ch07.html
  #     # https://www.ncbi.nlm.nih.gov/books/NBK401584/
  #     # https://www.who.int/uv/publications/Protecting_Workers_UV_pub.pdf
  #     # http://strang.smhi.se/extraction/units-conversion.html
  #     - name: UVA Irradiance
  #       value_template: "{{ value_json[-1].UVA_Avg | float if value_json else 'unknown' }}"
  #       unit_of_measurement: "W/m²"
  #     - name: UVB Irradiance
  #       value_template: "{{ value_json[-1].UVB_Avg | float if value_json else 'unknown' }}"
  #       unit_of_measurement: "W/m²"
  # https://www.weatherapi.com/docs/#apis-forecast
  # https://api.weatherapi.com/v1/forecast.json?q=<lat>%2C<long>&days=1&alerts=yes&key=<key>
  # https://www.baeldung.com/linux/jq-command-json
  - resource: !secret weather_api_alerts_url
    headers:
      Accept: 'application/json'
    method: GET
    # an alert seems to last 6 hours, but then they'll re-issue the same alert 6 hours later
    scan_interval: 43200  # 60*60*12
    timeout: 15
    sensor:
      - name: Weather Alerts
        icon: mdi:alert-outline
        value_template: "{{ value_json.alerts.alert | count }}"
        unit_of_measurement: count
        json_attributes_path: "$.alerts"
        json_attributes:
          - alert

automation:
  - alias: "Weather Alert Notification"
    id: "c0b01006-be9e-41e9-b1b5-adafc3ecae1b"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.weather_alerts
    condition:
      # not to 0 is obvious: there's no alert, so nothing to notify
      # otherwise, we can go from 0 to 1, or 0 to 2, or more
      # we only want to alert the first time going from 0
      # and not for e.g. 1 to 2
      - condition: template
        value_template: >-
          {% set from = trigger.from_state.state | int(0) %}
          {% set to = trigger.to_state.state | int(0) %}
          {{ from == 0 and to != 0 }}
    action:
      - repeat:
          for_each: "{{ state_attr('sensor.weather_alerts', 'alert') | sort(attribute='effective') }}"
          sequence:
            - variables:
                message: >-
                  {%- set event = repeat.item['event'] %}
                  {%- set from = repeat.item['effective'] | as_datetime(0) | as_local %}
                  {%- set from_str = from.strftime('%A %-d %B') %}
                  {%- set to = repeat.item['expires'] | as_datetime(0) | as_local %}
                  {%- set to_str = to.strftime('%A %-d %B') %}
                  {%- set event_body = event | capitalize %}
                  {# api encoding bug #}
                  {%- set desc = repeat.item['desc'] | replace('Â', '') %}
                  {%- if from.date() == to.date() -%}
                    {{ event_body }} for {{ from_str }}:
                  {%- else -%}
                    {{ event_body }} from {{ from_str }} until {{ to_str }}:
                  {%- endif %}
                  {%- for line in desc.split('\n') %}
                    - {{ line }}
                  {%- endfor %}
            # only a critical sound notification when it's not night
            - choose:
                - conditions:
                    - condition: time
                      after: "08:00:00"
                      before: "20:00:00"
                  sequence:
                    - service: notify.family
                      data:
                        title: "⚠️ Extreme Weather"
                        message: "{{ message }}"
                        data:
                          group: "weather"
                          url: homeassistant://navigate/lovelace-main/environment
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 0.3
              default:
                - service: notify.family
                  data:
                    title: "⚠️ Extreme Weather"
                    message: "{{ message }}"
                    data:
                      group: "weather"
                      url: homeassistant://navigate/lovelace-main/environment

  - alias: "Notify When Significant Rain Is Expected"
    id: "aff421a7-d99a-45c2-baa5-710b11d010b9"
    initial_state: true
    trigger:
      # covered by the morning brief
      - platform: time
        at: "06:30:00"
        enabled: false
      - platform: time
        at: "12:00:00"
      - platform: time
        at: "17:30:00"
      - platform: time
        at: "19:00:00"
    condition:
      - condition: state
        entity_id: binary_sensor.weather_forecast_precipitation_soon
        state: "on"
      # the sensor is a sliding window recalculated every 5 minutes, so it can
      # flap on/off during a multi-day rain spell - track our own notification
      # history instead of the sensor's last_changed, and only notify once a
      # day at most.
      # 20h rather than 24h: gives enough slack that the same daily trigger
      # slot (e.g. 06:30) is always eligible again the next day, even with a
      # few minutes of timing jitter - a strict 24h gate could skip a whole day
      # if the previous notification landed slightly late
      - condition: template
        value_template: >
          {{ as_timestamp(now()) - as_timestamp(states('input_datetime.rain_expected_notification_sent'), 0) >= 20 * 60 * 60 }}
      - condition: state
        entity_id: binary_sensor.pieter_present
        state: "on"
    action:
      - service: notify.mobile_app_ceres
        data:
          title: "🌧️ Rain Expected"
          message: >-
            {# onset comes from the sensor, so the window is defined in exactly
               one place (environment.jinja) and cannot drift from the state
               that gated this notification #}
            {% set onset = state_attr('binary_sensor.weather_forecast_precipitation_soon', 'onset') %}
            {% if onset %}
              {% set onset_local = onset | as_datetime | as_local %}
              {% set rain_time = onset_local.strftime('%H:%M') %}
              {% if onset_local.date() == now().date() %}
                {% set time_phrase = "tonight" if onset_local.hour >= 18 else "later today" %}
              {% elif onset_local.hour < 4 %}
                {% set time_phrase = "overnight" %}
              {% elif onset_local.hour < 7 %}
                {% set time_phrase = "early morning" %}
              {% elif onset_local.hour < 10 %}
                {% set time_phrase = "early tomorrow" %}
              {% elif onset_local.hour < 18 %}
                {% set time_phrase = "later tomorrow" %}
              {% else %}
                {% set time_phrase = "tomorrow night" %}
              {% endif %}
              Rain is expected {{ time_phrase }} around {{ rain_time }}. Plan accordingly.
            {% else %}
              Rain is expected, but timing is uncertain. Check the forecast and plan accordingly.
            {% endif %}
          data:
            url: homeassistant://navigate/lovelace-main/environment
            group: "environment"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.rain_expected_notification_sent
        data:
          datetime: "{{ now() }}"

  - alias: "High UV Notification"
    id: "101c7f2d-6839-4a8c-be1a-0de46ed70477"
    initial_state: true
    trigger:
      - platform: numeric_state
        entity_id: sensor.uv_index_filtered
        above: 5
    mode: single
    condition:
      - condition: state
        entity_id: binary_sensor.raining
        state: "off"
      # at most once a day - last_triggered is only set when the conditions pass
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or
             this.attributes.last_triggered < today_at() }}
    action:
      - service: notify.family
        data:
          title: "☀️ Health"
          message: >-
            UV radiation is high. Remember to apply sunscreen.
          data:
            group: "environment"
            tag: "environment-uv"
            url: homeassistant://navigate/lovelace-main/environment

  - alias: "Morning Weather Brief"
    id: "9c0ff371-189f-4573-8745-17b538695d46"
    initial_state: true
    trigger:
      - platform: time
        at: input_datetime.wake_up_time
    condition:
      - condition: state
        entity_id: binary_sensor.pieter_present
        state: "on"
    action:
      - delay:
          minutes: 15
      - action: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: daily
        response_variable: daily
      - action: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: hourly
      - variables:
          # now (measured)
          current_temp: "{{ states('sensor.outside_temperature') | int(0) }}"
          heat_label: "{{ state_attr('sensor.outside_temperature', 'thermal_comfort_label') }}"
          humidity_state: "{{ states('sensor.humidity_perception') }}"
          # full adjectives for use in a sentence, keyed by perception state - distinct from the
          # sensor's 'label' attribute, which is a terse dashboard-tile value ("Ideal", "Muggy") that
          # doesn't read as prose after "Feels very cold and ...". The humid end names the humidity
          # out loud, since "oppressive" alone would read as a comment on the heat.
          humidity_phrases: >-
            {{ {
              'damp': 'damp', 'dry': 'dry', 'very_comfortable': 'fresh', 'comfortable': 'comfortable',
              'ok_but_humid': 'humid', 'somewhat_uncomfortable': 'muggy',
              'quite_uncomfortable': 'oppressively humid',
              'extremely_uncomfortable': 'miserably humid', 'severely_high': 'dangerously humid'
            } }}
          # the sensor owns the bars, so the brief carries no threshold of its own and no raw % -
          # just the tier: 'present' is stated outright as fog, 'possible' is a heads-up, 'none'
          # is silence
          fog_chance: "{{ state_attr('binary_sensor.fog_conditions', 'chance') }}"
          compass_names: >-
            {{ {
              'N': 'North', 'NE': 'Northeast', 'E': 'East', 'SE': 'Southeast',
              'S': 'South', 'SW': 'Southwest', 'W': 'West', 'NW': 'Northwest'
            } }}
          # full phrases for use in sentences, keyed by beaufort tier - distinct from
          # sensor.wind_condition_beaufort's 'label' attribute, which is a terse
          # dashboard-tile display value (e.g. "Light", "Gale") not meant to stand alone in prose
          wind_phrases: >-
            {{ {
              'calm': 'Calm', 'light_air': 'Light wind', 'light_breeze': 'Light breeze',
              'gentle_breeze': 'Gentle breeze', 'moderate_breeze': 'Moderate breeze',
              'fresh_breeze': 'Fresh breeze', 'strong_breeze': 'Strong breeze',
              'near_gale': 'Near-gale wind', 'gale': 'Gale-force wind', 'strong_gale': 'Strong gale',
              'storm': 'Storm-force wind', 'violent_storm': 'Violent storm', 'extreme_storm': 'Extreme storm'
            } }}
          wind_state: "{{ states('sensor.wind_condition_beaufort') }}"
          wind_speed: "{{ states('sensor.wind_speed_filtered_km_h') | float(0) | round(0) }} km/h"
          wind_dir: >-
            {% set abbr = state_attr('sensor.wind_condition_beaufort', 'compass_direction') %}
            {{ compass_names.get(abbr, abbr) }}
          uv_state: "{{ states('sensor.uv_condition') }}"
          uv_label: "{{ state_attr('sensor.uv_condition', 'label') }}"
          pressure_state: "{{ states('sensor.air_pressure_trend') }}"
          pressure_label: "{{ state_attr('sensor.air_pressure_trend', 'label') }}"
          # rain right now is the station's call, not the forecast's. recently raining rather than
          # raining, as the piezo flickers off in the gaps between drizzle drops; the rate condition
          # grades how heavy, and a gap in the drizzle reads as light
          raining_now: "{{ is_state('binary_sensor.recently_raining', 'on') }}"
          rain_now_state: "{{ states('sensor.rain_rate_condition') }}"
          # later (forecast, via the get_forecasts call above rather than any derived weather entity)
          # what's left of today, from the hourly forecast. the daily forecast's condition and
          # precipitation cover midnight to midnight, so rain that fell before this brief went out
          # still counts there - a wet night ahead of a dry day once printed "Heavy rain later
          # (14.6 mm)" when 0.3 mm remained. the window opens at the next hour: the hour in
          # progress is what the station is measuring, and the forecast has no say over it. the
          # onset is found here too rather than read from
          # binary_sensor.weather_forecast_precipitation_soon, whose value can be an hour old.
          #  - condition: the wettest condition still to come, ranked so the word says how
          #    heavy (OWM's pouring/rainy split is taken to follow the same rain rate conventions
          #    as sensor.rain_rate_condition); with no wet hour left, the most common condition
          #  - mm: rain still to come today
          #  - onset: HH:MM of the first wet hour, or '' if none
          rest_of_today: >-
            {% set wet_rank = ['snowy', 'rainy', 'snowy-rainy', 'pouring', 'hail', 'lightning-rainy'] %}
            {% set ns = namespace(mm=0, wet=[], wettest=none, conditions=[]) %}
            {% for f in hourly['weather.openweathermap']['forecast'] %}
              {% set dt = f.datetime | as_datetime | as_local %}
              {% if dt.date() == now().date() and dt > now() %}
                {% set ns.mm = ns.mm + f.precipitation | float(0) %}
                {% set ns.conditions = ns.conditions + [f.condition] %}
                {% if f.condition in wet_rank %}
                  {% set ns.wet = ns.wet + [dt] %}
                  {% if ns.wettest is none or wet_rank.index(f.condition) > wet_rank.index(ns.wettest) %}
                    {% set ns.wettest = f.condition %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {# ties go to the earlier condition, as unique keeps first occurrences in order #}
            {% set common = namespace(condition=none, count=0) %}
            {% for c in ns.conditions | unique %}
              {% set count = ns.conditions | select('eq', c) | list | count %}
              {% if count > common.count %}
                {% set common.condition = c %}
                {% set common.count = count %}
              {% endif %}
            {% endfor %}
            {# empty only if the brief runs in the last hour of the day - the daily condition is
               no stand-in, as it's the very midnight-to-midnight summary avoided above #}
            {{ {
              'condition': ns.wettest or common.condition or '',
              'mm': ns.mm | round(1),
              'onset': ns.wet[0].strftime('%H:%M') if ns.wet else ''
            } }}
          today_high: "{{ daily['weather.openweathermap']['forecast'][0]['temperature'] | int(0) }}"
          # the daily forecast carries one representative wind for the whole day, which hides the shape
          # of it - a southeaster that builds through the afternoon and drops at sunset reads the same as
          # a steady breeze. Scanning the whole of what's left of today doesn't fix that either: the
          # windiest hour often lands an hour or two after this notification, where it says nothing the
          # measured "right now" reading above hasn't already. Scan noon to sunset instead - the part of
          # the day worth planning around - and keep the strongest hour in that window, so the clause can
          # say where the afternoon ends up. It says only that, and never how it gets there: a trend verb
          # would be read against the measured speed printed a clause earlier, and the two aren't
          # comparable - the station sits sheltered and reads well under the forecast for sustained wind,
          # so a flat forecast day next to a 3 km/h reading printed as "holding at 12 km/h". Speed stays
          # none once the window has passed (a late wake-up, or sunset already behind us), and the clause
          # is then dropped rather than guessed at.
          afternoon_wind: >-
            {# next_setting rolls to tomorrow once today's sunset is behind us, which would otherwise
               stretch the window across midnight - so a sunset that isn't today's means today's
               afternoon is over. The attribute is tested before it is parsed, not after: as_datetime
               raises on none rather than returning it #}
            {% set next_setting = state_attr('sun.sun', 'next_setting') %}
            {% set sunset = next_setting | as_datetime | as_local if next_setting else none %}
            {% set in_window = sunset is not none and sunset.date() == now().date() %}
            {% set start = now().replace(hour=12, minute=0, second=0, microsecond=0) %}
            {% set ns = namespace(speed=none, bearing=0) %}
            {% for f in hourly['weather.openweathermap']['forecast'] %}
              {% set dt = f.datetime | as_datetime | as_local %}
              {# float(none) rather than float(0) so an hour the forecast reports no wind for is
                 skipped outright rather than read as a genuine dead calm #}
              {% set speed = f.wind_speed | float(none) %}
              {% if speed is not none and in_window and dt >= start and dt >= now() and dt <= sunset
                    and (ns.speed is none or speed > ns.speed) %}
                {% set ns.speed = speed %}
                {% set ns.bearing = f.wind_bearing | float(0) %}
              {% endif %}
            {% endfor %}
            {{ {'speed': ns.speed, 'bearing': ns.bearing} }}
          afternoon_wind_state: >-
            {% from 'environment.jinja' import beaufort_scale %}
            {{ beaufort_scale(afternoon_wind.speed | float(0)) }}
          afternoon_wind_speed: >-
            {{ afternoon_wind.speed | float(0) | round(0) }} km/h
          afternoon_wind_dir: >-
            {% from 'environment.jinja' import get_direction_8 %}
            {% set abbr = get_direction_8(afternoon_wind.bearing | float(0)) | trim %}
            {{ compass_names.get(abbr, abbr) }}
      - service: notify.mobile_app_ceres
        data:
          title: "🌤️ Weather Brief"
          message: >-
            {% set condition_words = {
              'clear-night': 'clear', 'cloudy': 'cloudy', 'fog': 'foggy', 'hail': 'hail',
              'lightning': 'thunderstorms', 'lightning-rainy': 'thunderstorms', 'partlycloudy': 'partly cloudy',
              'pouring': 'heavy rain', 'rainy': 'rain', 'snowy': 'snow', 'snowy-rainy': 'sleet',
              'sunny': 'sunny', 'windy': 'windy', 'windy-variant': 'windy', 'exceptional': 'unusual weather'
            } %}
            {% set later_condition = condition_words.get(rest_of_today.condition, rest_of_today.condition | replace('-', ' ')) %}
            {# how it feels reads as one sentence about the air, not two readings bolted together:
               the humidity word sits alongside the temperature word rather than trailing it with a
               percentage, which the dashboards carry anyway. The word is dropped entirely if the
               perception is unknown, rather than leaving a dangling "and" #}
            {% set humidity_phrase = humidity_phrases.get(humidity_state, '') %}
            {% set feel_clause = 'Feels ' ~ (heat_label | lower) ~ (' and ' ~ humidity_phrase if humidity_phrase else '') ~ ' at ' ~ current_temp ~ '°C' %}
            {# fog_conditions is inferred from dew point spread + wind + moisture, not observed directly,
               and it's real-time only - there's no forecast for onset or when it would lift.
               The brief always opens with how it feels outside; confirmed fog qualifies that sentence
               rather than displacing it, while fog that has only just crossed the bar drops to the
               trailing extras below. Under the bar nothing is said at all - that band is the
               merely-dewy one a calm night produces, where a fog warning is noise #}
            {# rain qualifies the opening sentence the same way; the fog sensor is gated off while
               it's recently been raining, so the two never meet #}
            {% if raining_now %}
              {% set now_clause = feel_clause ~ ' now, with ' ~ rain_now_state | replace('no_rain', 'light') ~ ' rain.' %}
            {% elif fog_chance == 'present' %}
              {% set now_clause = feel_clause ~ ' now, with fog.' %}
            {% else %}
              {% set now_clause = feel_clause ~ ' now.' %}
            {% endif %}
            {# the condition is only wet when a wet hour is still to come, so the condition word
               carries how heavy it is ("Heavy rain expected around 09:00") #}
            {# rain the station is measuring now that the forecast carries into the next hour
               continues rather than starts #}
            {% set next_hour = (now() + timedelta(hours=1)).strftime('%H:00') %}
            {% if raining_now and rest_of_today.onset == next_hour %}
              {% set later_clause = (later_condition | capitalize) ~ ' expected to continue (' ~ rest_of_today.mm ~ ' mm), high of ' ~ today_high ~ '°C.' %}
            {% elif rest_of_today.onset %}
              {% set later_clause = (later_condition | capitalize) ~ ' expected around ' ~ rest_of_today.onset ~ ' (' ~ rest_of_today.mm ~ ' mm), high of ' ~ today_high ~ '°C.' %}
            {% elif rest_of_today.mm > 0 %}
              {# rain still to come but too thin for the forecast to call any hour wet, so
                 "Partly cloudy" alone wouldn't imply it - it needs saying out loud #}
              {% set later_clause = (later_condition | capitalize) ~ ' with some rain (' ~ rest_of_today.mm ~ ' mm), high of ' ~ today_high ~ '°C.' %}
            {% elif rest_of_today.condition %}
              {% set later_clause = (later_condition | capitalize) ~ ' later, high of ' ~ today_high ~ '°C.' %}
            {% else %}
              {% set later_clause = 'High of ' ~ today_high ~ '°C.' %}
            {% endif %}
            {% if wind_state == 'calm' %}
              {% set wind_now_clause = 'Calm right now.' %}
            {% elif wind_dir %}
              {% set wind_now_clause = wind_phrases[wind_state] ~ ' from the ' ~ wind_dir ~ ' (' ~ wind_speed ~ ') right now.' %}
            {% else %}
              {% set wind_now_clause = wind_phrases[wind_state] ~ ' right now (' ~ wind_speed ~ ').' %}
            {% endif %}
            {# the brief reads as two blocks: everything measured right now, then everything
               forecast for the rest of today. Wind, fog, UV and pressure are all current
               readings and belong with the opening sentence, not stranded behind the forecast #}
            {% set now_extras = [wind_now_clause] %}
            {% if fog_chance == 'possible' %}
              {% set now_extras = now_extras + ['Fog possible.'] %}
            {% endif %}
            {% if uv_state in ['high', 'very_high', 'extreme'] %}
              {% set now_extras = now_extras + ['UV ' ~ (uv_label | lower) ~ '.'] %}
            {% endif %}
            {% if pressure_state in ['rising_rapidly', 'falling_rapidly'] %}
              {% set now_extras = now_extras + ['Pressure ' ~ (pressure_label | lower) ~ '.'] %}
            {% endif %}
            {% set later_extras = [] %}
            {# always stated whenever the window still has hours in it, including for a quiet day:
               "no news" would be indistinguishable from a missing forecast, and knowing the afternoon
               stays light is itself worth confirming #}
            {% if afternoon_wind.speed is not none %}
              {# mirrors the now clause above, where a direction is meaningless for calm. The phrase is
                 lowercased here because the article takes the front of the sentence #}
              {% if afternoon_wind_state == 'calm' %}
                {% set wind_later_clause = 'Calm this afternoon.' %}
              {% else %}
                {% set descriptor = (wind_phrases[afternoon_wind_state] | lower)
                                    ~ (' from the ' ~ afternoon_wind_dir if afternoon_wind_dir else '')
                                    ~ ' (' ~ afternoon_wind_speed ~ ')' %}
                {# 'Extreme storm' is the one phrase in the table that opens on a vowel #}
                {% set wind_later_clause = ('An ' if descriptor[0] in 'aeiou' else 'A ') ~ descriptor ~ ' this afternoon.' %}
              {% endif %}
              {% set later_extras = later_extras + [wind_later_clause] %}
            {% endif %}
            {{ ([now_clause] + now_extras + [later_clause] + later_extras) | join(' ') }}
          data:
            url: homeassistant://navigate/lovelace-main/environment
            group: "environment"
