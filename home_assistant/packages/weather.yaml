        unit_of_measurement: "%"
        icon: mdi:weather-hazy
        variables:
          lux_entity: sensor.weather_station_illuminance
          sun_entity: sun.sun
          # below this the sun's path through the atmosphere is long enough that haze, terrain and
          # the horizon dominate, and the ratio stops meaning anything - measured mornings with and
          # without fog are indistinguishable under it
          min_elevation: 10
        # measured illuminance as a percentage of what a clear sky would deliver at the sun's current
        # elevation, using the standard global-horizontal approximation (133.8 klux * sin(h)^1.15).
        #
        # diagnostic only - nothing consumes this. Fog, cloud and haze all depress it, so it cannot
        # identify fog on its own; it is here to be sampled across many mornings, since the two events
        # measured so far (one foggy, one not) only separate from about 09:00 onwards.
