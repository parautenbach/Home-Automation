    sensor:
      - name: "Precipitation Total"
        unique_id: "ee251e57-e2b0-4c5a-b236-516077712fea"
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: total_increasing
        variables:
          raw_precipitation_entity: sensor.weather_station_precipitation
          event_rate_entity: sensor.raw_rain_rate
          # link for retrieving calibration data
          # http://homeassistant.local:8123/history?entity_id=sensor.rain_24h%2Csensor.rain_24h_lts%2Csensor.rain_rate%2Csensor.daily_precipitation%2Csensor.weather_station_precipitation%2Csensor.precipitation_total%2Csensor.raw_rain_rate&start_date=2026-07-01T08%3A00%3A00.000Z&end_date=2026-09-03T21%3A59%3A00.000Z
          # ceilings are raw mm/h (event_rate_entity), not the calibrated rate, so changing
          # a gain doesn't shift which tier a tick lands in.
          #
          # 2026-09-03: RESET TO 1.0. the sensor now passes through raw, uncalibrated, and
          # calibration starts over from the next rain event.
          #
          # the readings behind every earlier gain could not be reconciled with each other,
          # and none of them can be trusted enough to carry forward:
          #
          #   3 light-rain readings  2.70x, 4.32x, 2.00x   a tick or two each, so the
          #                                                gauge's own resolution dominated
          #   2026-08-29             1.6 mm raw, gauge 2.0   booked 4.56 -> implied 0.4386
          #   2026-09-03             1.2 mm raw, gauge 1.0   booked 3.28 -> implied 0.3049
          #
          # (09-03 window: gauge verified empty at 12h00 SAST, first tick 12h31, read at
          # 16h31 with rain stopped since 16h25. booked 3.28 is the daily meter's 4.78 minus
          # the 1.50 standing at 10h00, so it needs no tick decomposition.)
          #
          # those two whole-event scales differ by a third, and it is not even settled which
          # gains were live when each was booked. two events cannot separate two tiers in any
          # case: fitting both gives an exact solution with no residual to validate it, and
          # moving each gauge reading by a quarter division swings it from 1.79/0.36 to
          # 1.16/0.98 to a negative tier 2. building on that is building on noise.
          #
          # protocol for the next event, so the reading is actually usable:
          #   - empty the gauge before it starts and note the time
          #   - read it once the rain has stopped, note that time too
          #   - pull sensor.weather_station_precipitation (raw) for that exact window, not
          #     just the derived totals - at gain 1.0 booked == raw, so this is now a direct
          #     raw-vs-gauge comparison with nothing to unwind
          #   - prefer an event heavy in one rate tier; a mid-range mix cannot split them
          #
          # also unresolved: 5 raw ticks booked before 10h00 SAST on 09-03, on a morning with
          # no rain and an empty gauge at noon. if those are false triggers - plausible on a
          # piezo (wind, debris, a bird) - they inflate every light-rain reading above.
          #
          # the tier boundaries themselves (0.3 and 2.0 mm/h) are inherited guesses and have
          # never been validated either. keep the structure, but do not treat them as known.
          gain_tiers:
            - ceiling: 0.3
              gain: 1.0
            - ceiling: 2.0
              gain: 1.0
          gain_unvalidated: 1.0
        state: >-
          {% from 'environment.jinja' import select_gain %}
          {% set current_raw = states(raw_precipitation_entity) | float(0) %}
          {% set last_raw = this.attributes.get('last_raw', current_raw) %}
          {% set delta_raw = current_raw - last_raw %}
          {% set gain = select_gain(states(event_rate_entity), gain_tiers, gain_unvalidated) | float %}
          {% set prev_total = this.attributes.get('calibrated_total', this.state | float(0)) %}
          {{ (prev_total + delta_raw * gain) | round(2) }}
        attributes:
          last_raw: "{{ states(raw_precipitation_entity) | float(0) }}"
          calibrated_total: >-
            {% from 'environment.jinja' import select_gain %}
            {% set current_raw = states(raw_precipitation_entity) | float(0) %}
            {% set last_raw = this.attributes.get('last_raw', current_raw) %}
            {% set delta_raw = current_raw - last_raw %}
            {% set gain = select_gain(states(event_rate_entity), gain_tiers, gain_unvalidated) | float %}
            {% set prev_total = this.attributes.get('calibrated_total', 0) | float(0) %}
            {{ (prev_total + delta_raw * gain) | round(2) }}
        availability: "{{ has_value(raw_precipitation_entity) }}"
