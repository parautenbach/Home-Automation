title: Security
path: security
icon: mdi:security
badges:
  - type: entity
    entity: binary_sensor.kitchen_smoke
    name: Kitchen
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.braai_room_smoke
    name: Braai
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.garage_smoke
    name: Garage
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.scullery_flooding
    name: Scullery
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.doorbell_rang
    name: Doorbell
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.doorbell_motion_detected
    name: Doorbell
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.foyer_motion_detected
    name: Foyer
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.kitchen_motion_detector_motion
    name: Kitchen
    show_icon: true
    show_name: true
    show_state: false
  - type: entity
    entity: binary_sensor.cabinet_door
    name: Cabinet
    show_icon: true
    show_name: true
    show_state: false
cards:
  - type: vertical-stack
    cards:
      - type: picture-glance
        title: Doorbell Camera
        camera_image: camera.doorbell
        camera_view: auto
        entities:
          - binary_sensor.doorbell_rang
          - binary_sensor.doorbell_motion_detected
          # blocking call
          - entity: script.take_snapshot
            tap_action:
              action: call-service
              service: script.take_snapshot
              data:
                camera_entity_id: camera.doorbell
                subdirectory: "doorbell"
      # https://community.home-assistant.io/t/styling-tile-cards/696907/10
      # https://community.home-assistant.io/t/card-mod-for-tile-card-icon-tile-color/657214/52
      - type: tile
        entity: alarm_control_panel.home
        name: "Home Alarm"
        features:
          - type: "alarm-modes"
            modes:
              - armed_home
              - armed_away
              - disarmed
        uix: &alarm_mods
          style:
            # button hover colours
            hui-card-features $ hui-card-feature $ hui-alarm-modes-card-feature $ ha-control-select $ div: |
              #option-armed_home {
                --control-select-color: #ffa800 !important;
              }
              #option-armed_away {
                --control-select-color: #aa0000 !important;
              }
              #option-disarmed {
                --control-select-color: #40b100 !important;
              }
            # button and card hover colours
            .: |
              :host {
                --state-alarm_control_panel-armed_home-color: #ffa800 !important;
                --state-alarm_control_panel-armed_away-color: #aa0000 !important;
                --state-alarm_control_panel-disarmed-color: #40b100 !important;
                --state-alarm_control_panel-triggered-color: #135dd8 !important;
              }
              ha-card {
                --ha-ripple-hover-opacity: 0;
              }
      - type: tile
        entity: alarm_control_panel.flatlet
        name: "Flatlet Alarm"
        features:
          - type: "alarm-modes"
            modes:
              - armed_away
              - disarmed
        uix: *alarm_mods
      # hold (not tap) plus a confirmation dialog to prevent accidental panics;
      # the button presses the panel's user panic via the olarm integration
      - type: tile
        entity: button.home_user_panic
        name: "Panic"
        icon: mdi:shield-alert-outline
        color: red
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.home_user_panic
          confirmation:
            text: "This will raise a panic alarm and the security company will respond. Are you sure?"
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: alarm_control_panel.home
            name: Home
          - entity: alarm_control_panel.flatlet
            name: Flatlet
        uix:
          style: |
            :host {
              --state-alarm_control_panel-armed_home-color: #ffa800;
              --state-alarm_control_panel-armed_away-color: #aa0000;
              --state-alarm_control_panel-armed_custom_bypass-color: #aa0000;
              --state-alarm_control_panel-disarmed-color: #40b100;
              --state-alarm_control_panel-triggered-color: #135dd8;
            }
      # filtered by device class rather than listed by hand, so a zone added on the
      # panel later appears on its own instead of being silently missing. olarm sets
      # device_class only on door contacts; the motion zones get theirs in
      # packages/olarm.yaml, and anything still unclassified falls into the third card.
      - type: custom:auto-entities
        card:
          type: glance
          title: Door Zones
          columns: 4
          state_color: true
        filter:
          include:
            - entity_id: "binary_sensor.home_zone_*"
              attributes:
                device_class: door
          exclude:
            - entity_id: "*_bypass*"
        sort:
          method: entity_id
      - type: custom:auto-entities
        card:
          type: glance
          title: PIR Zones
          columns: 5
          state_color: true
        filter:
          include:
            - entity_id: "binary_sensor.home_zone_*"
              attributes:
                device_class: motion
          exclude:
            - entity_id: "*_bypass*"
        sort:
          method: entity_id
      # normally empty and hidden: a zone shows up here when it has no device class
      # yet, i.e. it was activated on the panel but not yet classified in
      # packages/olarm.yaml. the remote receiver channels (011/012) are never zones.
      - type: custom:auto-entities
        card:
          type: glance
          title: Unclassified Zones
          columns: 4
          state_color: true
        show_empty: false
        filter:
          include:
            - entity_id: "binary_sensor.home_zone_*"
          exclude:
            - entity_id: "*_bypass*"
            - entity_id: "binary_sensor.home_zone_011*"
            - entity_id: "binary_sensor.home_zone_012*"
            - attributes:
                device_class: door
            - attributes:
                device_class: motion
        sort:
          method: entity_id
      # bypass state is worth seeing while armed, so this is not hidden behind the
      # alarm being disarmed - but the panel refuses bypass changes once armed, and a
      # switch will simply snap back if you try.
      # template-entity-row rather than a plain toggle row: the toggle control ignores
      # tap_action, so it is the only way to get a confirmation on the whole row.
      # names match the zone friendly names in packages/olarm.yaml; the confirmation
      # text is static (the frontend handles it, not the card), which is fine since
      # each row names its own zone.
      # red when a bypass is set: that zone is a hole in the alarm while armed.
      - type: entities
        show_header_toggle: false
        entities:
          - type: custom:fold-entity-row
            head:
              type: section
              label: Zone Bypasses
            entities:
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_front_door
                name: Front Door
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_front_door', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the front door?"
                uix: &bypass_state_colour
                  style: |
                    .state {
                      color: {{ 'var(--custom-color-red)' if is_state(config.entity, 'on') else 'var(--custom-color-green)' }};
                    }
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_foyer
                name: Foyer PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_foyer', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the foyer PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_living_area
                name: Living Area PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_living_area', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the living area PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_braai_room
                name: Braai Room PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_braai_room', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the braai room PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_kitchen
                name: Kitchen PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_kitchen', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the kitchen PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_kitchen_door
                name: Kitchen Door
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_kitchen_door', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the kitchen door?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_bedroom
                name: Bedroom PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_bedroom', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the bedroom PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_guest_room
                name: Guest Room PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_guest_room', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the guest room PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_main_bedroom
                name: Main Bedroom PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_main_bedroom', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the main bedroom PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_backyard
                name: Backyard PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_backyard', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the backyard PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_garage_pir
                name: Garage PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_garage_pir', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the garage PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_flatlet
                name: Flatlet PIR
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_flatlet', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the flatlet PIR?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_music_room_door
                name: Music Room Door
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_music_room_door', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the music room door?"
                uix: *bypass_state_colour
              - type: custom:template-entity-row
                entity: switch.alarm_bypass_braai_room_door
                name: Braai Room Door
                state: >-
                  {{ 'Set' if is_state('switch.alarm_bypass_braai_room_door', 'on') else 'Cleared' }}
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Change the bypass for the braai room door?"
                uix: *bypass_state_colour
      - type: horizontal-stack
        title: Smoke Detectors
        cards:
          - type: custom:button-card
            template: smoke_detector
            name: "Kitchen"
            entity: binary_sensor.kitchen_smoke
            tap_action:
              action: call-service
              service: shell_command.mute_smoke_alarm
              data:
                host: shellyplussmoke-64b7080b93a4
          - type: custom:button-card
            template: smoke_detector
            name: "Braai Room"
            entity: binary_sensor.braai_room_smoke
            tap_action:
              action: call-service
              service: shell_command.mute_smoke_alarm
              data:
                host: shellyplussmoke-a0a3b3b861d0
          - type: custom:button-card
            template: smoke_detector
            name: "Garage"
            entity: binary_sensor.garage_smoke
            tap_action:
              action: call-service
              service: shell_command.mute_smoke_alarm
              data:
                host: shellyplussmoke-a0a3b35c5694
          # todo: mute flood detector
          # not possible today: https://shelly-api-docs.shelly.cloud/gen2/ComponentsAndServices/Flood
          # - type: custom:button-card
          #   template: smoke_detector
          #   name: "Scullery"
          #   icon: mdi:water  # or another icon
          #   entity: binary_sensor.scullery_flooding
          #   tap_action:
          #     action: call-service
          #     service: shell_command.mute_smoke_alarm  # or another script
          #     data:
          #       host: shellyflood...
      - type: horizontal-stack
        title: Events
        cards:
          - type: custom:multiple-logbook-card
            # title: Events
            desc: true
            hours_to_show: 24
            max_items: 50
            date_format: "DD MMM HH:mm"
            scroll: true
            show:
              icon: true
              duration: true
              start_date: true
              end_date: true
              entity_name: true
              separator: true
            entities:
              - entity: binary_sensor.doorbell_rang
                label: Doorbell
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: rang
              - entity: cover.main_gate
                label: Main gate
                hidden_state:
                  - unknown
                  - unavailable
              - entity: cover.garage_doors_lhs
                label: "Rouvé's garage door"
                hidden_state:
                  - unknown
                  - unavailable
              - entity: cover.garage_doors_rhs
                label: "Pieter's garage door"
                hidden_state:
                  - unknown
                  - unavailable
              - entity: alarm_control_panel.home
                label: Home alarm
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: disarmed
                    label: disarmed
                  - value: armed_home
                    label: armed (stay)
                  - value: armed_away
                    label: armed
              - entity: alarm_control_panel.flatlet
                label: Flatlet alarm
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: disarmed
                    label: disarmed
                  - value: armed_away
                    label: armed
              # the remote receivers are wired to arm/disarm zones (one per partition),
              # so these pulse whenever someone arms or disarms with a remote
              - entity: binary_sensor.home_zone_011_p1_remotes
                label: Home remote
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: used
              - entity: binary_sensor.home_zone_012_p2_remotes
                label: Flatlet remote
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: used
              - entity: binary_sensor.kitchen_smoke
                label: Kitchen smoke
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: detected
              - entity: binary_sensor.garage_smoke
                label: Garage smoke
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: detected
              - entity: binary_sensor.braai_room_smoke
                label: Braai room smoke
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: detected
              - entity: binary_sensor.scullery_flooding
                label: Scullery water
                hidden_state:
                  - "off"
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: detected
              - entity: binary_sensor.home_zone_001_front_door
                label: Front door
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: opened
                  - value: "off"
                    label: closed
              - entity: binary_sensor.home_zone_007_kitchen_door
                label: Kitchen door
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: opened
                  - value: "off"
                    label: closed
              - entity: binary_sensor.home_zone_019_music_room_door
                label: Music room door
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: opened
                  - value: "off"
                    label: closed
              - entity: binary_sensor.home_zone_020_braai_room_door
                label: Braai room door
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: opened
                  - value: "off"
                    label: closed
              # mains failure at the panel matters on its own (and during load shedding
              # tells you how long the panel has been on battery)
              - entity: binary_sensor.home_ac_power
                label: Alarm mains
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: restored
                  - value: "off"
                    label: cut
              - entity: binary_sensor.cabinet_door
                label: Backup power cabinet
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: opened
                  - value: "off"
                    label: closed
              # arming with the garage bypassed is worth seeing next to the arm event
              - entity: switch.alarm_bypass_garage_pir
                label: Garage PIR
                hidden_state:
                  - unknown
                  - unavailable
                state_map:
                  - value: "on"
                    label: bypass set
                  - value: "off"
                    label: bypass cleared
      - type: entities
        title: "Gates & Doors"
        show_header_toggle: false
        entities:
          - entity: cover.main_gate
          - entity: cover.garage_doors_lhs
            name: Rouvé's Garage Door (LHS)
          - entity: cover.garage_doors_rhs
            name: Pieter's Garage Door (RHS)
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: cover.main_gate
            name: Gate
          - entity: cover.garage_doors_lhs
            name: Rouvé
          - entity: cover.garage_doors_rhs
            name: Pieter
          - entity: light.garage
            name: Garage L.
          - entity: light.front_door
            name: Front Door L.
          - entity: light.backyard
            name: Backyard L.
      - type: entities
        entities:
          - entity: timer.main_gate_timer
            name: Main Gate Open Timeout
          - entity: timer.garage_doors_lhs_timer
            name: Rouvé's Garage Door Open Timeout (LHS)
          - entity: timer.garage_doors_rhs_timer
            name: Pieter's Garage Door Open Timeout (RHS)
      - type: history-graph
        title: Vehicles
        hours_to_show: 24
        entities:
          - entity: binary_sensor.garage_doors_lhs_occupied
            name: Rouvé
          - entity: binary_sensor.garage_doors_rhs_occupied
            name: Pieter
  - type: vertical-stack
    cards:
      - type: picture-glance
        title: Security Camera
        camera_image: camera.security_camera_proxy
        camera_view: auto
        entities:
          - binary_sensor.foyer_motion_detected
          - entity: script.security_camera_create_snapshot
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.security_camera_create_snapshot
          - entity: script.security_camera_record_clip
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.security_camera_record_clip
          - entity: light.foyer
            tap_action:
              action: call-service
              service: script.toggle_light
              service_data:
                light: light.foyer
                profile: bright_tp_link_rgb
          - group.security_automations
      - type: custom:swipe-card
        parameters:
          autoHeight: true
          pagination:
            type: 'bullets'
        cards:
          - type: picture-glance
            title: Last Snapshot Captured
            camera_image: camera.security_camera_last_snapshot
            entities: []
            uix:
              style: |
                .title:after {
                  content: ": {{ states('sensor.security_camera_last_snapshot_relative') }}";
                }
          - type: picture-glance
            title: Last Clip Captured
            camera_image: camera.security_camera_last_clip
            entities: []
            uix:
              style: |
                .title:after {
                  content: ": {{ states('sensor.security_camera_last_clip_relative') }}";
                }
      - type: entities
        entities:
          - entity: sensor.motion_detected_last_relative
            name: Last Motion Detected
          - entity: timer.living_room_lamp_timer
            name: Living Room Lamp
          - entity: timer.foyer_timer
            name: Foyer Light
          - entity: group.security_automations
            name: Snapshots and Lights
      - type: history-graph
        title: Movement
        hours_to_show: 24
        entities:
          - entity: binary_sensor.doorbell_motion_detected
            name: Doorbell
          - entity: binary_sensor.foyer_occupancy_homebridge
            name: Foyer M.
          - entity: binary_sensor.kitchen_motion_detector_motion
            name: Kitchen
          - entity: light.foyer
            name: Foyer L.
          - entity: light.living_room_lamp
            name: Living R. Lamp
      - type: statistics-graph
        entities:
          - entity: sensor.doorbell_motion_detections
            name: Doorbell
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
          - state
      - type: statistics-graph
        entities:
          - entity: sensor.foyer_motion_detections
            name: Foyer
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
          - state
