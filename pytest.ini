[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = tests
# HA aliases its own httpx build over httpx, and the alias has to be installed before
# anything imports httpx. respx's pytest plugin imports it at entry-point load, before
# pytest-homeassistant gets a chance. respx itself still works; only its plugin is off.
addopts = -p no:respx
# Deprecations in Home Assistant's dependencies, which only they can fix.
filterwarnings =
    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff
