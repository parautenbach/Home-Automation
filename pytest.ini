[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = tests
# HA aliases its own httpx build over httpx, and the alias has to be installed before
# anything imports httpx. respx's pytest plugin imports it at entry-point load, before
# pytest-homeassistant gets a chance. respx itself still works; only its plugin is off.
addopts = -p no:respx
